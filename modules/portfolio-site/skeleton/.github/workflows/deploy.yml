# Deploys the static site to S3 and invalidates CloudFront over GitHub OIDC (PET-774).
# No AWS key exists: the role trusts only this repo's main branch (modules/portfolio-site/iam.tf).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # mint the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      BUCKET: ${{ vars.BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      # A missing variable would otherwise surface as an opaque AWS error, or as a sync to nowhere.
      - name: Require deploy variables
        run: |
          for v in AWS_ROLE_ARN BUCKET DISTRIBUTION_ID; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is empty"; exit 1; }
          done

      # TODO before first use: pin each action to a full commit SHA, as petedio-iac does.
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Sync to S3
        run: |
          count=$(find dist -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::dist/ is empty, refusing to sync with --delete"; exit 1; }
          aws s3 sync dist "s3://$BUCKET" --delete --cache-control "public, max-age=300"
          echo "synced $count file(s) to $BUCKET"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "invalidation $id completed"
