---
# palworld role defaults (PET-157). Fully provisions the LXC incl. the SteamCMD server
# binaries (app 2394010) and an enabled+started systemd unit, so launch day is just a
# power-on + the auto-pulled 1.0 update. Flip palworld_install_binaries=false for the
# old "ready-for-binaries" behavior (binaries left as an operator launch-day step).

# Service account the dedicated server + SteamCMD run as (never root).
palworld_user: steam
palworld_group: steam
palworld_home: /home/steam

# Install layout under the steam user.
palworld_steamcmd_dir: "{{ palworld_home }}/steamcmd"
palworld_server_dir: "{{ palworld_home }}/palworld" # app 2394010 installs here
palworld_steam_app_id: 2394010

# The systemd unit is installed once the binaries are present. Whether it starts at BOOT
# is palworld_service_autostart below; nothing in this role ever starts it directly.
palworld_service_name: palworld
# AppExec path the unit launches; lives under the server dir once binaries land.
palworld_server_exec: "{{ palworld_server_dir }}/PalServer.sh"

# Install/update the SteamCMD server binaries (app 2394010) during the play. Set false
# for a "ready-for-binaries" prep converge.
palworld_install_binaries: true

# Whether systemd starts the server AT BOOT.
#
# FALSE, deliberately: the server starts only when Pedro starts it from the panel
# (decided 2026-08-18). The role does not start it either — the unit task below sets
# enablement but never `state: started`, and the restart handler refuses to start a
# server that is already stopped.
#
# This does not disable the panel. palctl-remote runs `systemctl start palworld`, and
# systemd starts a DISABLED unit perfectly well — enablement governs boot only. Verified
# on the live host 2026-08-18: disabled the unit, started it, it came up with 8211/udp
# listening, stopped it again.
#
# Set true only for a host that genuinely should come back by itself after a power cut.
palworld_service_autostart: false

# --- PalWorldSettings.ini tunables (exposed so the .ini stays declarative) --------
palworld_server_name: "PeteDio Palworld"
palworld_server_description: "Managed by petedio-iac (PET-157)"
palworld_max_players: 32
palworld_public_port: 8211
# Admin/server passwords: leave empty here (no secrets in the repo). The operator
# supplies them as no_log extra-vars at run time if wanted — see the play header.
palworld_admin_password: ""
palworld_server_password: ""
palworld_rcon_enabled: false
palworld_rcon_port: 25575

# REST API — the control panel (PET-266) depends on it; live 234 has had it on since
# launch day but only by hand-edit (drift, found in PET-278). Declared here so a
# converge keeps it. The template task carries no restart notify, so flag changes arm
# at the NEXT server restart (e.g. the next bedtime shutdown/start cycle), never
# mid-session.
palworld_rest_api_enabled: true
palworld_rest_api_port: 8212

# GameData API — /v1/api/game-data (world actor snapshot). RE-ADDED 2026-07-23 after
# PET-278's "not enableable" conclusion turned out to be a CASING miss, not a missing
# feature. Verified live on palworld-mc (v1.0.1.100619, build 24181105): the endpoint
# returns 200 with real actor data.
#
# The switch is a launch arg, and ONLY in this exact spelling:
#     -enable-gamedata-api      <-- lowercase, hyphen-separated. WORKS.
# PET-278 tried `-EnableGameDataAPI` (the CamelCase spelling that appears in the UE
# reflection/exec name table) and correctly proved THAT is a no-op — it was live on the
# running process while the endpoint still 404'd. Both facts are true: the exec-table
# name is not the CLI flag. Don't "normalise" the casing below to match the other
# launch args (-useperfthreads / -NoAsyncLoadingThread) — PalServer parses this one
# literally and any other casing silently does nothing.
#
# Still NOT config: EnableGameDataAPI=True inside OptionSettings is silently dropped
# (never appears in the /v1/api/settings dump), and RCON answers "Unknown command" to
# every GameData verb — Palworld's RCON is a fixed whitelist. The ini and RCON halves
# of the PET-278 finding stand; only the launch-arg half was wrong.
#
# Requires palworld_rest_api_enabled (the endpoint is served by the REST API listener).
# NB the payload contains player IP addresses and Steam IDs — see the panel's own
# access gating before exposing it to any unauthenticated surface.
palworld_gamedata_api_enabled: true

# --- Base-building world tunables (bases + pals) ----------------------------------
# Role defaults mirror the engine defaults (4 base camps per guild / 15 worker pals
# per camp); inventory/group_vars/palworld.yml raises them for the shared world (that
# file is also the panel's GitOps write target — keep overrides there, not here). Like
# the REST flags above, the converge re-templates the ini with no restart notify, so
# new values arm at the NEXT server restart — never mid-session.
palworld_base_camp_max_in_guild: 4 # BaseCampMaxNumInGuild (ini/slider max 10)
palworld_base_camp_worker_max: 15 # BaseCampWorkerMaxNum (slider max 20; ini accepts 1-50, >20 is a perf lever)

# --- Firewall -------------------------------------------------------------------
# Access is intended over Tailscale, so the PUBLIC LAN/WAN rule is off by default.
# Turn on only if you really want the game port reachable on the LAN.
palworld_firewall_enabled: true
palworld_open_public_port: false
palworld_firewall_subnet: 192.168.50.0/24
# Platform-LAN (.50) ingress. True for the LXC, which is dual-homed onto both segments;
# a host with no .50 NIC at all (the baremetal box) turns it off so we don't carry a rule
# for a subnet it can't be reached on. (PET-266 migration)
palworld_lan_ingress_enabled: true

# Mesh (192.168.86.x) ingress — PET-168. Off by default (the dual-home NIC is opt-in);
# the palworld inventory group flips palworld_mesh_enabled on. Opens 8211/udp from the
# mesh subnet so clients on that segment can reach the server over the eth1 NIC.
palworld_mesh_enabled: false
palworld_mesh_subnet: 192.168.86.0/24

# --- Which world to serve ---------------------------------------------------------
# `DedicatedServerName` in GameUserSettings.ini names the SaveGames/0/<name> folder the
# server loads. It is NOT in PalWorldSettings.ini and nothing else points at the world:
# restoring SaveGames/ alone leaves this pointing at whatever world the host last made,
# and the server silently boots a BRAND-NEW empty world instead of the restored one.
# Caught rehearsing the PET-266 migration — the server came up green, the panel showed
# "online", and the map was empty.
#
# Empty -> leave the file alone (the LXC's value is already correct and self-maintained).
# Set it to the world GUID on any host that must be pinned to a specific save.
palworld_dedicated_server_name: ""

# --- Baremetal / physical host ----------------------------------------------------
# The role was written against a Proxmox LXC. These gate the extra handling a PHYSICAL
# host needs (PET-266 migration: LXC 234 -> the ex-mission-control laptop on the .86
# play segment). All default to the LXC behavior, so 234 converges byte-identically.
palworld_baremetal: false

# A laptop suspends on lid-close and on idle — either one kills the game server. When
# true the role masks the sleep targets and writes a logind drop-in. Defaults to
# whatever palworld_baremetal says: physical host -> inhibit, container -> don't
# (a container has no logind sleep targets to mask anyway).
palworld_inhibit_sleep: "{{ palworld_baremetal }}"

# --- Nightly world backup (PET-382) -----------------------------------------------
# Flushes the live world to disk (POST /v1/api/save), tars Pal/Saved, and uploads it to
# MinIO. vzdump alone does not cover this: it backs up the container, not a flushed
# world, and the restore position that PET-381 needed came from two archives someone
# happened to take by hand the night of the PET-266 cutover — nothing had run since.
#
# Unlike vault-snapshot (a live Vault Agent identity on the SAME host) and like
# resume-mongo-backup (no Vault identity on THIS host either), the MinIO creds are
# resolved ONCE at playbook-run time and written to a root-only env file — same
# no-committed-secret, no-Terraform-Vault-role pattern already used for
# palworld_admin_password itself (the apply-on-merge runner's Vault role grants only
# lxc-ssh + Nexus creds, so it can supply neither). See tasks/main.yml for the
# preservation logic that keeps a CI merge-apply from blanking creds an operator seeded
# by hand, and docs/runbooks/palworld-backup.md for the seeding + restore-drill steps.
palworld_backup_enabled: true
palworld_backup_script_path: /usr/local/sbin/palworld-backup.sh
palworld_backup_env_path: /etc/palworld-backup.env
# Off the hours anyone is likely to be playing, and clear of the other nightly timers
# this fleet already runs (vault-snapshot 02:30, resume-mongo-backup 03:15).
palworld_backup_oncalendar: "*-*-* 04:10:00"
palworld_backup_mc_path: /usr/local/bin/mc
palworld_backup_mc_alias: palbackup
palworld_backup_minio_scheme: http
palworld_backup_minio_hostport: "192.168.50.221:9000"
# Bucket the two PET-266 hand-taken archives already live in — created out-of-band by
# the operator, same as vault-snapshots and resume-mongo-backups on this same host. The
# script ASSERTS it exists rather than creating it (mirrors vault-snapshot.sh.j2); see
# docs/GOTCHAS.md "Declare it, don't run it" for why bucket creation on .221 stays a
# hand step rather than a role task.
palworld_backup_bucket: palworld-backups
# Rolling retention: how many of THIS script's own archives to keep. 30 days of a
# ~46 MiB save is ~1.4 GiB against "17 GB a year on a bucket nobody watches" (PET-382) —
# enough runway to notice a stuck timer long before it costs anything. Bucket versioning
# (docs/GOTCHAS.md: "MinIO S3 state backend") is a second net for anything pruned early.
# NB this also ages out the two original PET-266 archives once 30 nightly runs have
# landed — expected, not a special case; they are superseded by a live rolling backup.
palworld_backup_retain: 30
# palworld_backup_minio_access_key / palworld_backup_minio_secret_key: intentionally
# undefined here — optional extra-vars, same convention as palworld_admin_password just
# above. Resolve from Vault kv/services/palworld-backups (fields mc_access_key /
# mc_secret_key) — a scoped svcacct for the palworld-backups bucket only, never a root
# credential. Left unseeded, the units still install; the timer fails loudly until an
# operator runs the playbook once with these set (tasks/main.yml warns, doesn't fail).

# Public half of the control panel's start-hook SSH key. The panel authenticates to
# root with the private half (Vault kv/services/palworld-panel -> panel_ssh_private_key)
# and lands on the palctl-remote forced command, which allow-lists start/status/
# check-update/update. This line was HAND-PLACED on 234 and never codified (PET-266
# migration found it) — without it, a rebuilt host has a dead Start button. A public key
# is not a secret, so it lives here rather than in Vault. Empty -> task skipped.
palworld_panel_starthook_pubkey: >-
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE/w77J42GrWIqYm+55G5FRHoPR3NlbbZG59fDRjrg6Z
  palworld-panel-starthook
