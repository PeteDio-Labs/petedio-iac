---
# The session user. Non-root, with no sudo: a run that can reconfigure the host it runs on
# can also undo the boundary it was given.
codex_user: codex
codex_home: "/home/{{ codex_user }}"

# The Codex CLI, pinned. To upgrade, change both together: the version, and the sha256
# GitHub publishes for the asset (`gh release view rust-v<version> --repo openai/codex
# --json assets`). A wrong digest fails the download, by design.
#
# ⚠ THE PACKAGE, NOT THE BARE BINARY. The `codex-x86_64-unknown-linux-musl` asset holds
# only `codex`. Codex runs every shell command through `codex-code-mode-host`, which it
# looks for beside its own binary, so the bare binary signs in and then fails every tool
# call with "failed to spawn code-mode host". The package carries bin/codex,
# bin/codex-code-mode-host, rg and bwrap in the layout Codex expects.
codex_version: "0.159.3"
codex_asset: codex-package-x86_64-unknown-linux-musl
codex_url: "https://github.com/openai/codex/releases/download/rust-v{{ codex_version }}/{{ codex_asset }}.tar.gz"
codex_sha256: 3930f31ac5fca861ea3e444e2683f261190d96b63fba58e0a40a879174369cdf

# The sandbox modes a run on this host may choose. /etc/codex/requirements.toml holds the
# list, root-owned, so neither a flag nor the user's own config can widen it.
# danger-full-access is left out on purpose.
codex_allowed_sandbox_modes:
  - read-only
  - workspace-write

# Pedro's key, the same one claude-247 trusts. Ansible itself connects as root over the
# automation key that Terraform installs.
codex_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEgSIpFv6ipc5B3CATvK1CIqul0hG6MSUT0cR5TqhAX4 pedro@type-shit"
