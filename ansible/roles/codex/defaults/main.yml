---
# The session user. Non-root, with no sudo: a run that can reconfigure the host it runs on
# can also undo the boundary it was given.
codex_user: codex
codex_home: "/home/{{ codex_user }}"

# The Codex CLI, pinned. To upgrade, change both together: the version, and the sha256
# GitHub publishes for the asset (`gh release view rust-v<version> --repo openai/codex
# --json assets`). A wrong digest fails the download, by design.
#
# ⚠ THE PACKAGE, NOT THE BARE BINARY. The `codex-x86_64-unknown-linux-musl` asset holds
# only `codex`. Codex runs every shell command through `codex-code-mode-host`, which it
# looks for beside its own binary, so the bare binary signs in and then fails every tool
# call with "failed to spawn code-mode host". The package carries bin/codex,
# bin/codex-code-mode-host, rg and bwrap in the layout Codex expects.
codex_version: "0.159.3"
codex_asset: codex-package-x86_64-unknown-linux-musl
codex_url: "https://github.com/openai/codex/releases/download/rust-v{{ codex_version }}/{{ codex_asset }}.tar.gz"
codex_sha256: 3930f31ac5fca861ea3e444e2683f261190d96b63fba58e0a40a879174369cdf

# The sandbox modes a run on this host may choose. /etc/codex/requirements.toml holds the
# list, root-owned, so neither a flag nor the user's own config can widen it.
# danger-full-access is left out on purpose.
# --- The ChatGPT Plus allowance -----------------------------------------------------------
# The account is Plus: a 5-hour window and a weekly window, shared with Pedro's own Codex
# use, and no paid credits. `codex debug models` describes gpt-6.1-sol as the model that
# maximizes usage, near Astra's performance at a lower cost. Low is its catalog default.
# ⚠ A retired model fails every run. Read `codex debug models` before an upgrade: the
# catalog names each model's retirement date and its replacement.
codex_model: gpt-6.1-sol
codex_reasoning_effort: low

# codex-quota refuses a run once either window reaches its limit. Pedro chose these on
# 2026-10-01: the worker may use most of the week.
codex_quota_max_5h_percent: 90
codex_quota_max_weekly_percent: 85

codex_allowed_sandbox_modes:
  - read-only
  - workspace-write

# Pedro's key, the same one claude-247 trusts. Ansible itself connects as root over the
# automation key that Terraform installs.
codex_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEgSIpFv6ipc5B3CATvK1CIqul0hG6MSUT0cR5TqhAX4 pedro@type-shit"

# --- The reviewer's identities (PET-553) -------------------------------------------------
# Codex reviews. Claude implements, and Pedro merges. Two identities let it do that, and
# scripts/deploy-codex-248.sh passes both in from Vault. A run that passes neither leaves
# the files on disk as they are, so a plain `ansible-playbook` run never wipes them.
#
#   kv/services/codex-review-app -> the petedio-codex-review GitHub App: contents:read,
#     pull_requests:write and metadata:read, installed on every PeteDio-Labs repository.
#     With no contents:write, its review cannot count toward branch protection.
#   kv/services/codex-plane      -> the `codex` Plane user's API token. Member on PET.
#
# Never a committed default. Each stays empty here.
codex_review_app_id: ""
codex_review_installation_id: ""
codex_review_app_pem: ""
codex_plane_api_key: ""

codex_github_org: PeteDio-Labs
# Root-owned scripts, so a run cannot rewrite the code that reads the key.
codex_review_broker: /usr/local/bin/codex-review-broker
codex_review_gh: /usr/local/bin/codex-gh
# The session user's credentials. 0700 directories, 0400 files, owned by the session user,
# because the session is what reviews.
codex_review_conf_dir: "{{ codex_home }}/.config/codex-review"
codex_plane_conf_dir: "{{ codex_home }}/.config/plane"

# Plane, through the one LAN rule in codex.tf.
codex_plane_url: http://192.168.50.235:8080
codex_plane_workspace: petedio
