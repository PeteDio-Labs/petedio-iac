---
# lab-watchdog (PET-707): a second alert path that does not pass through pete-bot.
#
# WHY. Every alert goes Uptime Kuma (the Pi) -> pete-bot (237) -> Discord. When 237 is down,
# Kuma's webhook fails and nobody hears. When the Pi or Kuma is down, nothing watches either.
# This timer probes from a different host and posts to the Lab-Agent DM through Discord's bot API
# directly, so it works when pete-bot does not. (It reuses the Lab-Agent app's bot token. A
# Discord webhook cannot post into a DM, so a webhook does not fit.)
#
# ⚠ It shares fate with pve03: 247, 237 and 223 all run there. A pve03 failure silences this
# probe too. pete-pi-2 is separate hardware and the better home once a session can log in to it
# (PET-707). The role is host-agnostic, so moving it is one inventory line.

lab_watchdog_interval: "2min"
# A target must fail this many runs in a row before the first post, so one slow answer
# does not page.
lab_watchdog_fail_threshold: 2
# The daily line proves the timer itself still runs. Local hour (the host's clock) at or
# after which the first run of a day posts it.
lab_watchdog_daily_hour: 8

# name -> url and the HTTP status codes that count as up. TLS is not verified for Vault:
# this is a liveness probe, and Vault answers 200 only when unsealed and active, so a sealed
# Vault (503) reads as down, which is the wanted reading.
lab_watchdog_targets:
  - name: kuma-pi
    url: "http://192.168.50.4:3001/"
    ok: "200 301 302"
  - name: pete-bot
    url: "http://192.168.50.237:3015/health"
    ok: "200"
  - name: vault
    url: "https://192.168.50.223:8200/v1/sys/health"
    ok: "200"
    insecure: true

# Absent by default. The deploy script passes them from kv/services/lab-watchdog, fields
# discord_bot_token and discord_dm_channel_id. A run without both leaves the file on the host
# as it is.
lab_watchdog_discord_bot_token: ""
lab_watchdog_discord_dm_channel_id: ""

# The off-site heartbeat (PET-722). Both absent by default; the deploy script passes them from
# kv/services/aws-watchdog (heartbeat_url, heartbeat_secret). A run without both leaves the
# file on the host as it is.
lab_watchdog_heartbeat_url: ""
lab_watchdog_heartbeat_secret: ""
