---
# See defaults/main.yml for why this exists and what it cannot see.

- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/lab-watchdog
    state: directory
    owner: root
    group: root
    mode: "0700"

# A curl config file: the bot token is the credential, and it stays out of argv when the probe
# reads it. Land it only when the run carries both values, and never print it.
- name: Land the Discord bot config
  ansible.builtin.copy:
    content: |
      url = "https://discord.com/api/v10/channels/{{ lab_watchdog_discord_dm_channel_id }}/messages"
      header = "Authorization: Bot {{ lab_watchdog_discord_bot_token }}"
      user-agent = "DiscordBot (https://github.com/PeteDio-Labs/petedio-iac, 1)"
    dest: /etc/lab-watchdog/discord.curl
    owner: root
    group: root
    mode: "0600"
  when:
    - lab_watchdog_discord_bot_token | length > 0
    - lab_watchdog_discord_dm_channel_id | length > 0
  no_log: true

# A curl config file: the URL and the secret header stay out of argv when the probe reads it.
- name: Land the off-site heartbeat config
  ansible.builtin.copy:
    content: |
      url = "{{ lab_watchdog_heartbeat_url }}"
      header = "x-heartbeat-secret: {{ lab_watchdog_heartbeat_secret }}"
    dest: /etc/lab-watchdog/heartbeat
    owner: root
    group: root
    mode: "0600"
  when:
    - lab_watchdog_heartbeat_url | length > 0
    - lab_watchdog_heartbeat_secret | length > 0
  no_log: true

- name: Read back whether the Discord config exists
  ansible.builtin.stat:
    path: /etc/lab-watchdog/discord.curl
  register: lab_watchdog_discord

- name: Install the probe
  ansible.builtin.template:
    src: lab-watchdog.sh.j2
    dest: /usr/local/sbin/lab-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Install the units
  ansible.builtin.template:
    src: "lab-watchdog.{{ item }}.j2"
    dest: "/etc/systemd/system/lab-watchdog.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd for lab-watchdog

# The timer task below needs the reloaded unit files, so run the handler now.
- name: Apply the systemd reload before enabling the timer
  ansible.builtin.meta: flush_handlers

# The timer runs only once the Discord config exists. A timer that probes and cannot post is a
# green unit over work that never happened.
- name: Enable the timer when the Discord config is present
  ansible.builtin.systemd:
    name: lab-watchdog.timer
    enabled: true
    state: started
  when: lab_watchdog_discord.stat.exists

- name: Say when the timer is not running
  ansible.builtin.debug:
    msg: >-
      /etc/lab-watchdog/discord.curl is absent, so lab-watchdog.timer is not enabled.
      Run scripts/seed-watchdog-discord.sh, then scripts/deploy-lab-watchdog.sh.
  when: not lab_watchdog_discord.stat.exists
