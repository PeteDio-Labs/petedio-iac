# forgejo-mirror — Forgejo plus a timer that copies every repo the read-only GitHub App reaches
# into it (PET-756). Forgejo's own pull mirror is not used: an App installation token lasts one
# hour, and a pull mirror keeps its credential in the repo's remote URL. The sync script mints a
# token per run and keeps it in a process environment.
---
- name: Forgejo — packages
  ansible.builtin.apt:
    name: [git, curl, jq, openssl, ca-certificates, sqlite3]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Forgejo — service account
  ansible.builtin.user:
    name: "{{ forgejo_user }}"
    system: true
    home: "{{ forgejo_home }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Forgejo — sync account
  ansible.builtin.user:
    name: "{{ forgejo_mirror_user }}"
    system: true
    home: "{{ forgejo_mirror_state_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Forgejo — data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ forgejo_home }}", owner: "{{ forgejo_user }}", mode: "0750"}
    - {path: "{{ forgejo_home }}/data", owner: "{{ forgejo_user }}", mode: "0750"}
    - {path: "{{ forgejo_mirror_state_dir }}", owner: "{{ forgejo_mirror_user }}", mode: "0750"}

- name: Forgejo — config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "0750"
  loop:
    - {path: "{{ forgejo_conf_dir }}", group: "{{ forgejo_user }}"}
    - {path: "{{ forgejo_mirror_conf_dir }}", group: "{{ forgejo_mirror_user }}"}

# get_url verifies the binary against the .sha256 file published beside it and fails on a
# mismatch. The version is pinned in defaults, so a re-run installs the same bytes.
- name: Forgejo — install the binary
  ansible.builtin.get_url:
    url: "{{ forgejo_url }}"
    dest: "{{ forgejo_bin }}"
    checksum: "sha256:{{ forgejo_url }}.sha256"
    mode: "0755"
    owner: root
    group: root
  notify: Restart forgejo

- name: Forgejo — generate the three secrets once
  ansible.builtin.command:
    cmd: "{{ forgejo_bin }} generate secret {{ item.kind }}"
  register: forgejo_secret
  args:
    creates: "{{ forgejo_conf_dir }}/{{ item.file }}"
  loop:
    - {kind: SECRET_KEY, file: secret_key}
    - {kind: INTERNAL_TOKEN, file: internal_token}
    - {kind: JWT_SECRET, file: jwt_secret}
  no_log: true
  changed_when: forgejo_secret is not skipped

- name: Forgejo — write the generated secrets
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ forgejo_conf_dir }}/{{ item.item.file }}"
    owner: root
    group: "{{ forgejo_user }}"
    mode: "0640"
    force: false
  loop: "{{ forgejo_secret.results }}"
  when: item.stdout is defined
  no_log: true

- name: Forgejo — app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_conf_dir }}/app.ini"
    owner: root
    group: "{{ forgejo_user }}"
    mode: "0640"
  notify: Restart forgejo

- name: Forgejo — systemd unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: "0644"
  notify: [Reload systemd, Restart forgejo]

- name: Forgejo — flush handlers before the service starts
  ansible.builtin.meta: flush_handlers

- name: Forgejo — enable and start
  ansible.builtin.systemd:
    name: forgejo
    enabled: true
    state: started

- name: Forgejo — wait for the API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_port }}/api/healthz"
  register: forgejo_health
  retries: 15
  delay: 2
  until: forgejo_health.status == 200

- name: Forgejo — list admin users
  ansible.builtin.command:
    argv: [runuser, -u, "{{ forgejo_user }}", --, "{{ forgejo_bin }}", admin, user, list, --admin, --config, "{{ forgejo_conf_dir }}/app.ini"]
  register: forgejo_admins
  changed_when: false
  check_mode: false

- name: Forgejo — create the sync admin (random password, never stored)
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ forgejo_user }}"
      - --
      - "{{ forgejo_bin }}"
      - admin
      - user
      - create
      - --admin
      - --username
      - "{{ forgejo_mirror_api_user }}"
      - --email
      - "{{ forgejo_mirror_api_user }}@forgejo.invalid"
      - --random-password
      - --config
      - "{{ forgejo_conf_dir }}/app.ini"
  when: forgejo_mirror_api_user not in forgejo_admins.stdout
  no_log: true
  changed_when: true

# The token is written once and read by the sync user only. --raw prints the bare token.
- name: Forgejo — mint the sync API token once
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      umask 077;
      runuser -u {{ forgejo_user }} -- {{ forgejo_bin }} admin user generate-access-token
      --username {{ forgejo_mirror_api_user }} --token-name sync
      --scopes write:repository,write:organization --raw
      --config {{ forgejo_conf_dir }}/app.ini
      > {{ forgejo_mirror_conf_dir }}/forgejo-token
      && chown root:{{ forgejo_mirror_user }} {{ forgejo_mirror_conf_dir }}/forgejo-token
      && chmod 0640 {{ forgejo_mirror_conf_dir }}/forgejo-token
    executable: /bin/bash
    creates: "{{ forgejo_mirror_conf_dir }}/forgejo-token"
  no_log: true

- name: Forgejo — App private key for the sync
  ansible.builtin.copy:
    content: "{{ forgejo_mirror_app_pem }}\n"
    dest: "{{ forgejo_mirror_conf_dir }}/app.pem"
    owner: root
    group: "{{ forgejo_mirror_user }}"
    mode: "0440"
  no_log: true

- name: Forgejo — sync environment
  ansible.builtin.template:
    src: sync.env.j2
    dest: "{{ forgejo_mirror_conf_dir }}/sync.env"
    owner: root
    group: "{{ forgejo_mirror_user }}"
    mode: "0640"

- name: Forgejo — sync script
  ansible.builtin.copy:
    src: forgejo-mirror-sync.sh
    dest: /usr/local/bin/forgejo-mirror-sync
    owner: root
    group: root
    mode: "0755"

- name: Forgejo — sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [forgejo-mirror-sync.service, forgejo-mirror-sync.timer]
  notify: Reload systemd

- name: Forgejo — flush handlers before the first sync
  ansible.builtin.meta: flush_handlers

- name: Forgejo — enable the timer
  ansible.builtin.systemd:
    name: forgejo-mirror-sync.timer
    enabled: true
    state: started

# The first sync is the proof. The script exits non-zero unless it examined the repos GitHub
# reported and pushed each one, so a failed play here means the mirror is empty or short.
- name: Forgejo — run the first sync and require success
  ansible.builtin.systemd:
    name: forgejo-mirror-sync.service
    state: started
  register: forgejo_first_sync
  changed_when: true

- name: Forgejo — read the sync summary
  ansible.builtin.command: cat {{ forgejo_mirror_state_dir }}/status.json
  register: forgejo_sync_status
  changed_when: false
  check_mode: false

- name: Forgejo — show what the sync examined
  ansible.builtin.debug:
    msg: "{{ forgejo_sync_status.stdout | from_json }}"
