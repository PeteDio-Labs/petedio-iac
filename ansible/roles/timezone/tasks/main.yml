---
- name: Set the timezone on the node itself
  community.general.timezone:
    name: "{{ timezone_name }}"
  register: timezone_host

- name: Find the guests on this node
  ansible.builtin.command: pct list
  register: timezone_guests
  changed_when: false
  failed_when: false
  when: timezone_include_guests | bool

- name: Set the timezone inside every guest
  when:
    - timezone_include_guests | bool
    - timezone_guests.rc | default(1) == 0
  # /etc/timezone plus the /etc/localtime symlink, rather than timedatectl: an
  # unprivileged container cannot set the system clock, so timedatectl refuses
  # there even though the timezone itself is just a file.
  ansible.builtin.command: >-
    pct exec {{ item }} -- sh -c
    'ln -sf /usr/share/zoneinfo/{{ timezone_name }} /etc/localtime;
     echo {{ timezone_name }} > /etc/timezone'
  loop: "{{ timezone_guests.stdout_lines[1:] | map('regex_replace', '^([0-9]+).*$', '\\1') | list }}"
  loop_control:
    label: "guest {{ item }}"
  register: timezone_applied
  changed_when: true

# ⚠ THE CONTAINER FILE IS NOT ENOUGH. Proxmox has its own `timezone:` key in the
# guest config, and it REWRITES /etc/timezone and /etc/localtime every time the
# container starts. Setting the files alone looks correct until the next reboot
# and then silently reverts.
#
# Proved rather than assumed: 102 read America/New_York after the file was set,
# and America/Chicago again after `pct reboot`. Three guests carried a stale key
# (100, 101, 102), all from the community-script templates that created them.
- name: Align the Proxmox-level timezone key with the files
  when:
    - timezone_include_guests | bool
    - timezone_guests.rc | default(1) == 0
  ansible.builtin.shell: |
    set -o pipefail
    cur=$(pct config {{ item }} | grep -oP '^timezone: \K.*' || true)
    if [ -n "$cur" ] && [ "$cur" != "{{ timezone_name }}" ]; then
      pct set {{ item }} --timezone {{ timezone_name }} && echo "changed {{ item }}: $cur -> {{ timezone_name }}"
    fi
  args: { executable: /bin/bash }
  loop: "{{ timezone_guests.stdout_lines[1:] | map('regex_replace', '^([0-9]+).*$', '\\1') | list }}"
  loop_control:
    label: "guest {{ item }}"
  register: timezone_pct_key
  changed_when: "'changed' in timezone_pct_key.stdout"

- name: Report any Proxmox-level keys corrected
  when: timezone_pct_key is defined and timezone_pct_key.results is defined
  ansible.builtin.debug:
    msg: >-
      {{ timezone_pct_key.results | selectattr('stdout','defined') | map(attribute='stdout')
         | select('search','changed') | list | default(['no stale pct timezone keys'], true) }}

# ------------------------------------------------------------- verification --
- name: Read back what every guest now believes the time is
  when:
    - timezone_include_guests | bool
    - timezone_guests.rc | default(1) == 0
  ansible.builtin.command: >-
    pct exec {{ item }} -- date +%Z
  loop: "{{ timezone_guests.stdout_lines[1:] | map('regex_replace', '^([0-9]+).*$', '\\1') | list }}"
  loop_control:
    label: "guest {{ item }}"
  register: timezone_verify
  changed_when: false
  failed_when: false

- name: Report
  when: timezone_verify is defined and timezone_verify.results is defined
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ timezone_name }}):
      {{ timezone_verify.results | selectattr('stdout', 'defined')
         | map(attribute='stdout') | list | unique | join(', ') }}
      across {{ timezone_verify.results | length }} guests.

# Plex reads TZ once at start, so until it restarts it keeps scheduling against
# the old offset — which is the actual bug this role exists to fix. Restarting
# drops any in-flight stream, so never do it to someone who is watching.
- name: Find Plex guests that need restarting to pick up the change
  when: timezone_include_guests | bool
  ansible.builtin.shell: |
    set -o pipefail
    for id in $(pct list | awk 'NR>1{print $1}'); do
      if pct exec "$id" -- systemctl is-active plexmediaserver >/dev/null 2>&1; then echo "$id"; fi
    done
  args: { executable: /bin/bash }
  register: timezone_plex
  changed_when: false
  failed_when: false

- name: Restart Plex only where nobody is watching
  when:
    - timezone_include_guests | bool
    - timezone_plex.stdout_lines | default([]) | length > 0
  ansible.builtin.shell: |
    set -o pipefail
    TOK=$(pct exec {{ item }} -- grep -oE 'PlexOnlineToken="[^"]*"' \
      '/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Preferences.xml' \
      | sed 's/.*="//;s/"//')
    N=$(pct exec {{ item }} -- curl -s --max-time 8 -H "X-Plex-Token: $TOK" \
      http://127.0.0.1:32400/status/sessions | grep -oE 'size="[0-9]+"' | head -1 | grep -oE '[0-9]+')
    if [ "${N:-0}" -gt 0 ] && [ "{{ timezone_force_restart }}" != "True" ]; then
      echo "SKIPPED: ${N} active stream(s) on {{ item }}"
    else
      pct exec {{ item }} -- systemctl restart plexmediaserver && echo "restarted {{ item }}"
    fi
  args: { executable: /bin/bash }
  loop: "{{ timezone_plex.stdout_lines | default([]) }}"
  loop_control:
    label: "plex on {{ item }}"
  register: timezone_plex_restart
  changed_when: "'restarted' in timezone_plex_restart.stdout"

- name: Report the Plex outcome
  when: timezone_plex_restart is defined and timezone_plex_restart.results is defined
  ansible.builtin.debug:
    msg: "{{ timezone_plex_restart.results | selectattr('stdout', 'defined') | map(attribute='stdout') | select('!=', '') | list }}"
