---
- name: Create the digest directory
  ansible.builtin.file:
    path: "{{ lab_digest_output | dirname }}"
    state: directory
    owner: "{{ lab_digest_user }}"
    mode: "0755"

- name: Install the digest script
  ansible.builtin.template:
    src: lab-digest.sh.j2
    dest: /usr/local/bin/lab-digest
    mode: "0755"

- name: Install the service
  ansible.builtin.template:
    src: lab-digest.service.j2
    dest: /etc/systemd/system/lab-digest.service
    mode: "0644"
  notify: Reload systemd

- name: Install the timer
  ansible.builtin.template:
    src: lab-digest.timer.j2
    dest: /etc/systemd/system/lab-digest.timer
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the timer
  ansible.builtin.systemd:
    name: lab-digest.timer
    enabled: true
    state: started

# Serving the digest is separate from producing it: if the web unit fails the
# timer still writes the file, and vice versa.
- name: Install the read-only digest server
  ansible.builtin.template:
    src: lab-digest-web.service.j2
    dest: /etc/systemd/system/lab-digest-web.service
    mode: "0644"
  when: lab_digest_web_enabled | bool
  notify: Reload systemd

- name: Flush handlers so the unit exists before it is started
  ansible.builtin.meta: flush_handlers

- name: Start the digest server
  ansible.builtin.systemd:
    name: lab-digest-web
    enabled: true
    state: started
    daemon_reload: true
  when: lab_digest_web_enabled | bool
