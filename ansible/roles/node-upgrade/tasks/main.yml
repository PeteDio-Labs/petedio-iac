---
- name: Install the upgrade script
  ansible.builtin.template:
    src: node-upgrade.sh.j2
    dest: /usr/local/sbin/node-upgrade.sh
    mode: "0755"
    owner: root
    group: root

# A transient timer rather than a permanent unit: this is a one-off maintenance
# window, and a persistent timer that silently upgrades a hypervisor every night
# is a different decision from the one being made here.
# noqa reason: the unit is transient (created by `systemd-run --unit=`), so on a first run
# it does not exist. systemd_service state=stopped errors on an unknown unit; the command
# form carries failed_when: false precisely to tolerate that.
- name: Cancel any previous scheduled run  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl stop node-upgrade.timer
  changed_when: false
  failed_when: false

- name: Schedule tonight's run
  ansible.builtin.command: >-
    systemd-run --unit=node-upgrade --on-calendar="{{ node_upgrade_hour }}"
    --timer-property=AccuracySec=1min
    /usr/local/sbin/node-upgrade.sh
  register: node_upgrade_scheduled
  changed_when: true

# noqa reason: the Report task below prints the next-elapse row from `list-timers`.
# systemd_service returns unit facts and no such row.
- name: Confirm it is actually scheduled  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl list-timers node-upgrade.timer --no-pager
  register: node_upgrade_timer
  changed_when: false

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: upgrade scheduled for {{ node_upgrade_hour }}.
      {{ node_upgrade_timer.stdout_lines | select('search', 'node-upgrade') | first | default('timer not listed') }}
