# Ported from homelab-infra for the greenfield petedio-iac.
# Dual-GPU (GTX 1660 SUPER + RTX 3060 Ti), .12.
# Custom Modelfile tasks (copy / ollama create / verify / cleanup) were removed
# along with the 5 petedio-* Modelfiles — this role just pulls base models.
---
- name: Pull base models from Ollama registry
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ ollama_base_models }}"
  loop_control:
    label: "{{ item }}"
  when: ollama_base_models | length > 0
  register: pull_result
  changed_when: "'pulled' in pull_result.stdout | lower or 'pulling' in pull_result.stdout | lower"
  tags: pull

- name: Report pulled models
  ansible.builtin.debug:
    msg: "Base models pulled: {{ ollama_base_models | join(', ') }}"

# ── Residency (PET-132) ───────────────────────────────────────────────────────
# Load each worker-tier model onto its pinned instance/GPU and keep it warm. An empty
# prompt with keep_alive=-1 loads the model into that instance's VRAM and pins it there
# (no idle unload). Requires the target instances to be running (ollama-service role).
#
# Embedding models (kind: embed) do NOT support /api/generate — verified live
# (2026-07-21): a generate warm-up against qwen3-embedding:0.6b 400s with
# `"<model>" does not support generate`. They need /api/embed with an `input` field
# instead. Set `kind: embed` on an ollama_resident_models entry to route it there;
# entries with no `kind` (or `kind: generate`) keep the original /api/generate warm-up.
- name: Split resident models into generate-capable vs embedding
  ansible.builtin.set_fact:
    ollama_resident_generate: >-
      {{ ollama_resident_models | rejectattr('kind', 'defined') | list
         + ollama_resident_models | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'generate') | list }}
    ollama_resident_embed: >-
      {{ ollama_resident_models | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'embed') | list }}

- name: List the instance ports and the declared model@port pairs
  ansible.builtin.set_fact:
    ollama_instance_ports: >-
      {{ [ollama_port | default(11434)]
         + (ollama_extra_instances | default([]) | map(attribute='port') | list) }}
    ollama_resident_keys: >-
      {{ ollama_resident_models | map(attribute='model')
         | zip(ollama_resident_models | map(attribute='port')) | map('join', '@') | list }}

- name: Load each resident GENERATE-capable model onto its pinned instance (keep_alive=-1)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/api/generate"
    method: POST
    body_format: json
    body:
      model: "{{ item.model }}"
      keep_alive: -1
    status_code: 200
    timeout: 300
  loop: "{{ ollama_resident_generate }}"
  loop_control:
    label: "{{ item.model }} -> :{{ item.port }}"
  changed_when: false
  when: ollama_resident_generate | length > 0

- name: Load each resident EMBEDDING model onto its pinned instance (keep_alive=-1)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/api/embed"
    method: POST
    body_format: json
    body:
      model: "{{ item.model }}"
      input: " "
      keep_alive: -1
    status_code: 200
    timeout: 300
  loop: "{{ ollama_resident_embed }}"
  loop_control:
    label: "{{ item.model }} -> :{{ item.port }} (embed)"
  changed_when: false
  when: ollama_resident_embed | length > 0

# ── Unload what is not declared (PET-525) ─────────────────────────────────────
# ⚠ Every instance runs with OLLAMA_KEEP_ALIVE=-1, so a model that leaves
# ollama_resident_models stays in VRAM until something unloads it. Removing qwen3:8b
# from the list freed nothing on its own. These tasks read /api/ps on each instance,
# unload every model not declared resident on that port, then read /api/ps again and
# fail if one is still there. An undeclared embedding model fails the unload with a
# 400, loudly: declare it or unload it by hand, never skip it here.
- name: Read the models each instance holds loaded
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}/api/ps"
    return_content: true
  loop: "{{ ollama_instance_ports }}"
  register: ollama_ps_before

- name: Unload each model an instance holds but does not declare resident
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.0.item }}/api/generate"
    method: POST
    body_format: json
    body:
      model: "{{ item.1.name }}"
      keep_alive: 0
    status_code: 200
    timeout: 120
  loop: "{{ ollama_ps_before.results | subelements('json.models', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.name }} on :{{ item.0.item }}"
  when: (item.1.name ~ '@' ~ item.0.item) not in ollama_resident_keys
  changed_when: true

- name: Read the loaded models back
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}/api/ps"
    return_content: true
  loop: "{{ ollama_instance_ports }}"
  register: ollama_ps_after

- name: Fail if an undeclared model is still loaded
  ansible.builtin.assert:
    that: ollama_undeclared_loaded | length == 0
    fail_msg: >-
      Still loaded but not declared resident: {{ ollama_undeclared_loaded | join(', ') }}.
      Check nvidia-smi for an orphaned llama-server (see host_vars/ollama-host.yml).
    success_msg: "Each instance holds only its declared resident models."
  vars:
    ollama_undeclared_loaded: >-
      {%- set out = [] -%}
      {%- for r in ollama_ps_after.results -%}
      {%- for m in r.json.models | default([]) -%}
      {%- if (m.name ~ '@' ~ r.item) not in ollama_resident_keys -%}
      {%- set _ = out.append(m.name ~ '@' ~ r.item) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- out -}}

- name: Report resident models
  ansible.builtin.debug:
    msg: >-
      Resident models:
      {{ ollama_resident_models | map(attribute='model') | join(', ')
         if ollama_resident_models | length > 0 else 'none' }}
      — verify real GPU placement with `ollama ps` (do NOT trust the offload %; bug #14351).
