---
# Fail before touching /etc/network/interfaces when the named port is absent. A
# bridge on a missing port is written without error and fails at the next boot, which
# is the failure this role is meant to avoid. The message lists what the node has, so
# a stale or empty name is fixed in one read. Examined: /sys/class/net on the node.
- name: List the network interfaces on this node
  ansible.builtin.command: ls -1 /sys/class/net
  register: mesh_usb_ifaces
  changed_when: false

- name: Check the bridge port exists on this node
  ansible.builtin.assert:
    that:
      - mesh_usb_ifaces.stdout_lines | length > 0
      - mesh_usb_interface | length > 0
      - mesh_usb_interface in mesh_usb_ifaces.stdout_lines
    fail_msg: >-
      mesh_usb_interface={{ mesh_usb_interface | to_json }} is not an interface on
      {{ inventory_hostname }}. Interfaces found ({{ mesh_usb_ifaces.stdout_lines | length }}):
      {{ mesh_usb_ifaces.stdout_lines | sort | join(', ') }}. Set it in inventory to the
      port cabled to the mesh.
    success_msg: >-
      {{ mesh_usb_interface }} found among {{ mesh_usb_ifaces.stdout_lines | length }} interfaces.

- name: Back up the interfaces file before first modification
  ansible.builtin.copy:
    src: /etc/network/interfaces
    dest: /etc/network/interfaces.bak-pre-mesh-usb-bridge
    remote_src: true
    force: false          # never clobber the pristine pre-change copy
    mode: "0644"

# Purely additive: a new bridge on a NIC nothing else uses. vmbr0 (the LAN)
# is never touched, so this cannot repeat the pve03 lockout — that trap fired
# on a REPLACEMENT of the interface already carrying the SSH session, and no
# NetworkManager runs on pve02 at all to fight ifupdown2 for ownership.
- name: Declare the USB-NIC mesh bridge
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED BLOCK — mesh-usb-bridge"
    block: |
      auto {{ mesh_usb_bridge }}
      iface {{ mesh_usb_bridge }} inet {{ mesh_usb_bridge_method }}
          bridge-ports {{ mesh_usb_interface }}
          bridge-stp off
          bridge-fd 0
    insertafter: EOF
  register: mesh_usb_bridge_cfg

# Syntax first, same discipline as mesh-vxlan: a bad interfaces file does not
# surface until the next boot.
- name: Validate the interfaces file without applying it
  ansible.builtin.command: ifreload -a -n
  register: mesh_usb_check
  changed_when: false
  failed_when: mesh_usb_check.rc != 0

# Deliberately NOT reloading automatically, same reasoning as mesh-vxlan:
# the config is written and validated, and a reboot comes up correct either
# way. Run `ifreload -a` by hand once ready to bring vmbr2 up live.
#
# noqa reason: this is an operator notice, not deferred work — it has to
# report inline, at this point in the play, not at end-of-play handler time.
- name: Say what is left to do by hand  # noqa: no-handler
  when: mesh_usb_bridge_cfg.changed
  ansible.builtin.debug:
    msg: >-
      Config changed on {{ inventory_hostname }} and passed validation.
      Run `ifreload -a` to bring {{ mesh_usb_bridge }} up — not applied
      automatically.
