---
# Converge `mpN` and `devN` for each declared container on this node, then re-read the
# running config and fail while any running container differs. See defaults/main.yml.
#
#   ansible-playbook playbooks/proxmox/configure-lxc-passthrough.yml --check
#   ansible-playbook playbooks/proxmox/configure-lxc-passthrough.yml
#   ansible-playbook playbooks/proxmox/configure-lxc-passthrough.yml -e lxc_passthrough_allow_restart=true

- name: Look for pct
  ansible.builtin.stat:
    path: /usr/sbin/pct
  register: lxc_passthrough_pct
  check_mode: false

- name: Assert this host is a Proxmox node
  ansible.builtin.assert:
    that: lxc_passthrough_pct.stat.exists
    fail_msg: >-
      No /usr/sbin/pct on {{ inventory_hostname }}. This play converges LXC passthrough
      on a Proxmox node; point it at the node that holds the container.

- name: Converge each container declared for this node
  ansible.builtin.include_tasks: container.yml
  # Ansible renders these vars lazily, inside container.yml's own loops. With the default
  # loop_var, an inner `item` (mp0, dev0) replaced the VMID, and `pct set mp0` failed after
  # `pct stop 244` had run (MED-11, 2026-11-15). A named loop_var keeps the outer value.
  vars:
    lxc_passthrough_vmid: "{{ lxc_passthrough_entry.key }}"
    lxc_passthrough_ct: "{{ lxc_passthrough_entry.value }}"
  loop: "{{ lxc_passthrough_declared | dict2items }}"
  loop_control:
    loop_var: lxc_passthrough_entry
    label: "{{ lxc_passthrough_entry.key }}"
  when: lxc_passthrough_entry.value.node == inventory_hostname

- name: Say what was examined
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: examined
      {{ lxc_passthrough_declared | dict2items
         | selectattr('value.node', 'equalto', inventory_hostname) | list | length }}
      declared container(s) of {{ lxc_passthrough_declared | length }}.
