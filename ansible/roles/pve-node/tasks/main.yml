---
- name: Assert the required variables are set
  ansible.builtin.assert:
    that:
      - pve_node_lan_interface | length > 0
      - pve_node_address | length > 0
    fail_msg: >-
      pve_node_lan_interface and pve_node_address must be set. There is no safe
      default: guessing the interface on a host reached only through it means
      guessing your way out of a lockout.

- name: Assert this is Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] is version("13", ">=")
    fail_msg: >-
      Proxmox VE 9 is built on Debian 13. This host reports
      {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }}.
      Ubuntu and Pop!_OS cannot be converted — reinstall as Debian.

- name: Assert the LAN interface actually exists
  ansible.builtin.assert:
    that:
      - pve_node_lan_interface in ansible_facts["interfaces"]
    fail_msg: >-
      {{ pve_node_lan_interface }} is not present on this host. Interfaces seen:
      {{ ansible_facts["interfaces"] | join(", ") }}. On a USB dongle the name
      derives from its MAC, so a swapped adapter renames it.

# A laptop node suspends on lid close and takes its guests with it. Do this
# BEFORE the long package install, so a lid close mid-run cannot kill it.
- name: Stop the lid and idle from suspending a laptop node
  when: pve_node_is_laptop | bool
  block:
    - name: Mask the sleep targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
        # Not implied by the four above: it is its own target and stays
        # startable when they are masked (found live on pve03, PET-324).
        - suspend-then-hibernate.target

    - name: Write the logind drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/10-pve-node-no-suspend.conf
        mode: "0644"
        content: |
          # Managed by ansible role pve-node — local edits are overwritten.
          # A closed lid must not suspend a hypervisor.
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchDocked=ignore
          HandleLidSwitchExternalPower=ignore
          HandleSuspendKey=ignore
          IdleAction=ignore
      notify: Restart logind

    # GNOME's power plugin suspends on its own schedule and does not consult
    # logind. A desktop install left on the node keeps that behaviour unless
    # it is turned off per-user.
    - name: Find the logged-in users whose GNOME session could still suspend
      ansible.builtin.command: loginctl list-users --no-legend
      register: pve_node_loginctl
      changed_when: false
      failed_when: false

    - name: Stop GNOME from suspending on idle
      ansible.builtin.command: >-
        sudo -u {{ item.split()[1] }}
        DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ item.split()[0] }}/bus
        gsettings set org.gnome.settings-daemon.plugins.power
        {{ setting }} nothing
      loop: "{{ pve_node_loginctl.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item.split()[1] | default(item) }}"
      vars:
        setting: sleep-inactive-ac-type
      changed_when: false
      failed_when: false
      when: pve_node_loginctl.stdout | default("") | length > 0

# Proxmox resolves its own node name to a real address for clustering. If the
# hostname maps to 127.0.1.1 — the Debian installer default — pvecm fails in
# ways that read as a corosync problem.
- name: Point the hostname at the node's real address in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*{{ pve_node_address | ansible.utils.ipaddr("address") }}\s'
    line: "{{ pve_node_address | ansible.utils.ipaddr('address') }}\t{{ inventory_hostname }}.local {{ inventory_hostname }}"
    state: present

- name: Remove the 127.0.1.1 mapping for this hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    state: absent

- name: Add the Proxmox repository key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-{{ ansible_facts["distribution_release"] }}.gpg
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Add the Proxmox repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-install-repo.sources
    mode: "0644"
    content: |
      # Managed by ansible role pve-node — local edits are overwritten.
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts["distribution_release"] }}
      Components: {{ pve_node_repo_component }}
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# The proxmox-ve package ships an enterprise repository that requires a paid
# subscription. Left enabled it returns 401 on every apt update, which reads as
# a broken mirror rather than a licensing choice, and blocks any later install
# on the node. Disable it AFTER the repo is added but BEFORE anything installs.
- name: Disable the enterprise repository
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: "^Enabled:"
    line: "Enabled: false"
    create: false
  failed_when: false

- name: Install proxmox-ve
  ansible.builtin.apt:
    name:
      - proxmox-ve
      - postfix
      - open-iscsi
      - chrony
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: pve_install
  async: 1800
  poll: 30

- name: Report what the install did
  ansible.builtin.debug:
    msg: "proxmox-ve install changed={{ pve_install.changed }}"

# The bridge is the lockout risk, so it only runs when asked for by tag.
#
# `apply` is load-bearing: tags on an include_tasks apply to the include
# STATEMENT, not to the tasks it pulls in. Without it, `--tags bridge` runs the
# include, finds every task inside untagged, filters them all out, and reports
# a green `changed=0` that looks like the bridge was already correct.
- name: Configure the LAN bridge
  ansible.builtin.include_tasks:
    file: bridge.yml
    apply:
      tags: [bridge]
  tags: [bridge, never]
