---
- name: Reload networking
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: Restart logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted
    daemon_reload: true

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true
