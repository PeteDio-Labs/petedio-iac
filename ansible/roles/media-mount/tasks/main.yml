---
- name: Install the NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create the mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ media_mount_paths }}"

- name: Mount the exported pools
  ansible.posix.mount:
    src: "{{ media_mount_server_ip }}:{{ item }}"
    path: "{{ item }}"
    fstype: nfs
    opts: "{{ media_mount_options }}"
    state: mounted
  loop: "{{ media_mount_paths }}"

# A mount that succeeds but shows nothing is the failure this guards against:
# exporting an unmounted path gives the client an empty directory and every
# symptom then points at the client.
- name: Assert each mount actually has content
  ansible.builtin.command: "ls -A {{ item }}"
  loop: "{{ media_mount_paths }}"
  loop_control:
    label: "{{ item }}"
  register: mount_content
  changed_when: false
  failed_when: mount_content.stdout | trim | length == 0

# NFS ID mapping can squash the owners to nobody, and the arr apps then read
# nothing. That must fail here rather than surface later as an empty library.
- name: Assert the ownership survived the mount
  ansible.builtin.command: "stat -c %u:%g {{ item }}"
  loop: "{{ media_mount_paths }}"
  loop_control:
    label: "{{ item }}"
  register: mount_owner
  changed_when: false
  failed_when: "'65534' in mount_owner.stdout"

# The automount unit names come from systemd-escape, not from string
# replacement, so a path with a dash or a space still names the right unit.
- name: Name the automount unit for each mount point
  ansible.builtin.command: "systemd-escape --path --suffix=automount {{ item }}"
  loop: "{{ media_mount_paths }}"
  register: media_mount_escaped
  changed_when: false
  check_mode: false

- name: Collect the automount unit names
  ansible.builtin.set_fact:
    media_mount_automount_units: "{{ media_mount_escaped.results | map(attribute='stdout') | list }}"

- name: Create the pve-guests drop-in directory
  ansible.builtin.file:
    path: "{{ media_mount_guests_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Writing this file changes nothing on a running node. The handler reloads unit
# definitions and restarts nothing: not pve-guests, and not any guest. The
# ordering applies from the next boot.
- name: Order pve-guests after the media automounts
  ansible.builtin.template:
    src: pve-guests-media-mounts.conf.j2
    dest: "{{ media_mount_guests_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ media_mount_paths | join(', ') }} mounted from {{ media_mount_server_ip }}
      with owners intact.
