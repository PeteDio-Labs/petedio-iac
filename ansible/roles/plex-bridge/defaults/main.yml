---
# Reach Plex from the home network when Plex lives on the isolated LAN.
#
# ⚠ RETIRED, AND KEPT ON PURPOSE (PET-474). Set `plex_bridge_state: absent` to tear
# the proxy down; that is what playbooks/configure-pete-pi.yml does. The role stays
# in the tree because the `absent` path is what stops the unit coming back, and
# because this is the fallback if pve02's mesh adapter fails. Read the history below
# before reviving it.
#
# THE PROBLEM. The TVs are on 192.168.86.0/24 (the mesh). Plex is on
# 192.168.50.0/24, and the router does not route between them — verified by
# curling .50 from pi1's wlan0 leg specifically, which times out.
#
# WHAT SOLVES IT NOW. pve02 has a USB-Ethernet adapter cabled into the mesh,
# bridged as vmbr2 (roles/mesh-usb-bridge), and CT 236 takes 192.168.86.236 on its
# net1 through that bridge. A WIRED adapter can bridge other MACs, so plex has a
# genuine layer-2 presence on .86 again and the proxy below is redundant. Measured
# from pi1's wlan0 on 2026-09-17: http://192.168.86.236:32400/identity answered 200
# in 0.21s.
#
# WHAT SOLVED IT BEFORE. A VXLAN carried mesh Ethernet frames from pve02 to pve01,
# which unwrapped them into its real mesh cable. pve01 died on 2026-09-03 and was
# the only host cabled to both networks, so the tunnel lost its far end — see
# roles/mesh-vxlan. The .86.236 address was a dead letter for the twelve days
# between that and the USB adapter.
#
# WHY WIFI IS NOT A SUBSTITUTE. pi1 and pve03 reach .86 over WiFi as *clients*, and
# a WiFi client cannot bridge other MACs: 802.11 uses three-address frames, so the
# AP drops anything sourced from an address it has not associated. 4addr/WDS would
# need support on the AP, and the AP is a Google mesh. That argument still stands,
# and it is why roles/palworld-mesh-nat exists on pve03.
#
# WHY NOT JUST ROUTE. Checked 2026-09-04: Google Nest Wifi does not support static
# routes. The Google Home app offers a custom LAN range, DHCP reservations and WAN
# settings, and no routing table at all.
# https://support.google.com/googlenest/answer/7571856
#
# WHAT THE PROXY DID. pete-pi is on both networks, so it forwarded the Plex port
# from its .86 address to Plex on .50. Layer 4, not layer 2 — so it restored ACCESS
# and never discovery: clients needed the address entered as a custom server URL.
# It also made the TVs depend on a Raspberry Pi carrying the cluster's deciding
# vote, a CI runner, Uptime Kuma and the daily digest, which is a worse blast radius
# than it looks. That cost is the reason it is retired rather than left running.
plex_bridge_state: present

plex_bridge_listen_ip: "192.168.86.46"
plex_bridge_listen_port: 32400
plex_bridge_target: "192.168.50.236"
plex_bridge_target_port: 32400

# Where the TVs reach Plex once the proxy is gone: CT 236's own mesh leg. The
# `absent` path refuses to tear anything down until this answers 200.
plex_bridge_direct_ip: "192.168.86.236"
plex_bridge_direct_port: 32400
