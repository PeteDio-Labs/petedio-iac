---
# Retire the proxy (PET-474). pve02 carries a wired USB-Ethernet leg on the mesh —
# roles/mesh-usb-bridge, bridged as vmbr2 — and CT 236 holds 192.168.86.236 through
# it. Plex answers the TVs on the mesh itself, so this hop buys nothing except a
# dependency on one Raspberry Pi that also carries the cluster's deciding vote.
#
# ORDER MATTERS. The replacement path is proven BEFORE the proxy stops. A teardown
# that runs first and then finds the mesh leg down leaves the TVs with no route to
# Plex and nothing to fall back to.
#
# socat stays installed. Removing the package is a wider change than retiring this
# unit, and anything else on the host that uses it would break silently.

# This host is the vantage because wlan0 is on the mesh and the route to
# 192.168.86.0/24 is on-link. The same request from the Mac answers 200 through
# Tailscale and proves nothing about the mesh.
#
# check_mode: false because the request is a read. A --check run that skipped it
# would report the teardown as safe without testing the thing that makes it safe.
- name: Prove Plex answers on the mesh without the proxy
  ansible.builtin.uri:
    url: "http://{{ plex_bridge_direct_ip }}:{{ plex_bridge_direct_port }}/identity"
    status_code: [200]
    timeout: 15
  register: plex_bridge_direct
  retries: 3
  delay: 3
  until: plex_bridge_direct is succeeded
  check_mode: false

- name: Look for the bridge unit
  ansible.builtin.stat:
    path: /etc/systemd/system/plex-bridge.service
  register: plex_bridge_unit

# Both this and the reload below are guarded on the unit file, so a converge after
# the first one changes nothing. systemd fails on a name it cannot find, and a bare
# daemon_reload always reports changed.
- name: Stop and disable the bridge
  ansible.builtin.systemd:
    name: plex-bridge
    state: stopped
    enabled: false
  when: plex_bridge_unit.stat.exists

- name: Remove the unit
  ansible.builtin.file:
    path: /etc/systemd/system/plex-bridge.service
    state: absent

- name: Reload systemd so the unit leaves its list
  ansible.builtin.systemd:
    daemon_reload: true
  when: plex_bridge_unit.stat.exists

# A stopped unit is not a closed port: socat run by hand, or a second listener on
# the address, would both survive the tasks above. Skipped under --check, where
# nothing was stopped and the port is still open by design.
- name: Confirm nothing listens on the proxy address
  ansible.builtin.wait_for:
    host: "{{ plex_bridge_listen_ip }}"
    port: "{{ plex_bridge_listen_port }}"
    state: stopped
    timeout: 20
  when: not ansible_check_mode

- name: Report
  ansible.builtin.debug:
    msg: >-
      The proxy on {{ plex_bridge_listen_ip }}:{{ plex_bridge_listen_port }} is
      retired. The TVs reach Plex at
      http://{{ plex_bridge_direct_ip }}:{{ plex_bridge_direct_port }}, which
      answered {{ plex_bridge_direct.status | default('unchecked') }} from this
      host. A client holding the proxy address as a custom server URL needs that
      entry replaced.
