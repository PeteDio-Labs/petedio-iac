---
# One role, two states. Retirement has to be expressed as config: present.yml ends
# in `state: restarted`, so stopping the unit by hand on the Pi lasts only until the
# next converge of playbooks/configure-pete-pi.yml starts it again (PET-474).

- name: Check plex_bridge_state is a value this role knows
  ansible.builtin.assert:
    that: plex_bridge_state in ['present', 'absent']
    fail_msg: >-
      plex_bridge_state must be 'present' or 'absent', not
      '{{ plex_bridge_state }}'.
    quiet: true

- name: Serve Plex to the mesh through the proxy
  ansible.builtin.include_tasks: present.yml
  when: plex_bridge_state == 'present'

- name: Retire the proxy
  ansible.builtin.include_tasks: absent.yml
  when: plex_bridge_state == 'absent'
