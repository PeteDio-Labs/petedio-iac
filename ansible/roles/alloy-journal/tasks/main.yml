---
# See defaults/main.yml for why this exists.

- name: Install the apt prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Fetch Grafana's signing key
  ansible.builtin.get_url:
    url: "{{ alloy_journal_apt_key_url }}"
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Grafana's apt repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

# The alloy user reads the journal through this group. Without it the service runs and ships nothing.
- name: Let the alloy user read the journal
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Restart alloy

- name: Land the Alloy config
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    validate: /usr/bin/alloy fmt %s
  notify: Restart alloy

- name: Keep Alloy's HTTP port on loopback
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: "CUSTOM_ARGS=\"--server.http.listen-addr={{ alloy_journal_listen }}\""
  notify: Restart alloy

- name: Apply a pending restart now
  ansible.builtin.meta: flush_handlers

- name: Enable and start Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started

- name: Wait until Alloy is ready
  ansible.builtin.uri:
    url: "http://{{ alloy_journal_listen }}/-/ready"
  register: alloy_ready
  until: alloy_ready.status == 200
  retries: 15
  delay: 2

# Alloy ready means it parsed the config. A quiet host may log nothing above warning for days, so
# write a warning of our own and ask Loki for it. Loki reads the query from a form body on POST only. The canary carries this run's epoch, so an old
# line cannot satisfy the check.
- name: Write a canary warning to the journal
  ansible.builtin.command: "logger -p user.warning -t alloy-journal-canary canary {{ inventory_hostname }} {{ ansible_facts['date_time']['epoch'] }}"
  changed_when: true

- name: Ask Loki for the canary
  ansible.builtin.uri:
    url: "{{ alloy_journal_loki_url | regex_replace('/push$', '/query_range') }}"
    method: POST
    body_format: form-urlencoded
    body:
      query: '{host="{{ inventory_hostname }}"} |= "canary {{ inventory_hostname }} {{ ansible_facts['date_time']['epoch'] }}"'
      since: 10m
      limit: 1
    return_content: true
  register: alloy_journal_canary
  until: alloy_journal_canary.json.data.result | default([]) | length > 0
  retries: 12
  delay: 10
  delegate_to: localhost
  become: false

- name: Say what was examined
  ansible.builtin.debug:
    msg: >-
      alloy is ready on {{ inventory_hostname }}, and Loki returned the canary warning written at
      {{ ansible_facts['date_time']['epoch'] }}.
