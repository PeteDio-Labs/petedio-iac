# vault-snapshot (PET-109) — install the raft-snapshot script + systemd timer on the Vault
# host. Idempotent. scripts/seed-vault-snapshot-approle.sh places the AppRole secret_id, and
# scripts/seed-minio-221.sh creates the MinIO bucket and svcacct (see
# docs/runbooks/vault-resilience.md). This role warns when the secret_id is missing, so a
# half-configured host is visible instead of silently never backing up.
---
# No mc (PET-800): dl.min.io returns 410 Gone for every community MinIO download. The script
# signs S3 requests with `curl --aws-sigv4`, so the role needs curl and nothing to download.
- name: Find curl, which the snapshot script uses to reach MinIO
  ansible.builtin.stat:
    path: /usr/bin/curl
  register: vault_snapshot_curl_stat

- name: Stop if curl is missing
  ansible.builtin.assert:
    that: vault_snapshot_curl_stat.stat.exists
    fail_msg: >-
      /usr/bin/curl is missing on this host. The snapshot script needs curl 7.75 or later
      for --aws-sigv4. Install curl, then rerun.
    quiet: true

- name: Ensure the snapshot credential + staging directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vault_snapshot_cred_dir }}", mode: "0700" }
    - { path: "{{ vault_snapshot_local_dir }}", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: Check whether the AppRole secret_id has been seeded
  ansible.builtin.stat:
    path: "{{ vault_snapshot_secret_id_file }}"
  register: vault_snapshot_secret_id_stat

- name: Warn if the AppRole secret_id is not yet seeded (timer will fail until it is)
  ansible.builtin.debug:
    msg: >-
      {{ vault_snapshot_secret_id_file }} is missing — seed the vault-snapshot AppRole
      role_id/secret_id (root-only, 0600) before the timer can run. See
      docs/runbooks/vault-resilience.md. The units are installed but the job will error
      until the creds exist.
  when: not vault_snapshot_secret_id_stat.stat.exists

- name: Install the snapshot script
  ansible.builtin.template:
    src: vault-snapshot.sh.j2
    dest: "{{ vault_snapshot_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Install the snapshot systemd service + timer units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vault-snapshot.service
    - vault-snapshot.timer
  notify: Reload systemd

- name: Enable and start the snapshot timer
  ansible.builtin.systemd:
    name: vault-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true
