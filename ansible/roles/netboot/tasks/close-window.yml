---
# close-window.yml — stop and disable dnsmasq, so nothing answers PXE. main.yml runs this
# FIRST when netboot_enabled is false, before any task that can fail. Codex's P1 on
# c9c0358 (PET-528): the stop used to come after the apt refresh, the ISO download and the
# nginx start, so a failure in any of them left an open window open, enabled across reboots.
#
# On a fresh container the package isn't installed yet, so the unit doesn't exist. The
# service facts tell that case apart from a real failure, which still fails the play.
- name: Read the service list
  ansible.builtin.service_facts:

- name: Stop and disable dnsmasq
  ansible.builtin.systemd_service:
    name: "{{ netboot_dnsmasq_service }}"
    state: stopped
    enabled: false
  register: netboot_window_close
  when: (netboot_dnsmasq_service ~ '.service') in ansible_facts.services
