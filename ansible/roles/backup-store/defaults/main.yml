---
# backup-store — give the cluster somewhere to back up to that neither node owns.
#
# WHY THIS EXISTS. Surveyed 2026-08-31: there were no scheduled backups anywhere,
# and exactly ONE archive existed in the whole cluster — a 164 MB hand-taken dump
# of 112. The "295 GB reserved" target was /mnt/pete/backups, which is an NFS
# mount FROM pve02, so pve01 backed up to pve02 while pve02 would have backed up
# to itself. That protects nothing.
#
# ollama-host is a THIRD machine, independent of both nodes, and its disk is
# mostly unused: sda3 is 901.6 GB of physical volume while the root LV is 100 GB,
# the Ubuntu installer default. This claims part of that space.
#
# ⚠ THIS IS NOT 3-2-1. One extra copy on one extra machine, same building, same
# power, same LAN, single disk with no redundancy. It is a large improvement on
# zero scheduled backups and it is not offsite. Anything genuinely irreplaceable
# — Vault's data above all — wants a second destination.

backup_store_server: ollama-host
backup_store_server_ip: 192.168.50.12
backup_store_clients:
  # ⚠ .10 was pve01's address and now belongs to pve03. The export kept working
  # through the node replacement by coincidence, not design — worth knowing
  # before anyone "tidies" this list.
  - 192.168.50.10   # pve03
  - 192.168.50.11   # pve02

backup_store_vg: ubuntu-vg
backup_store_lv: backup-lv
backup_store_path: /srv/backups

# ~82 GB of real data across 22 guests, so roughly 45 GB a run compressed.
# 500 GB is about 11 full generations.
backup_store_size: 500G

# Root sits at 76% (71 G of 98 G) and the Ollama models keep growing. Claiming
# backup space is the moment to relieve that, while the free extents are there.
backup_store_extend_root: true
backup_store_root_lv: ubuntu-lv
# ⚠ ABSOLUTE, never relative. `size: +100G` means "add 100G" and lvol applies it
# on EVERY run, so a relative value here grows root by 100G each time the play is
# executed until the volume group is empty. An absolute target is idempotent:
# lvol grows to it once and then does nothing, and it never shrinks.
backup_store_root_target: 200G

# Leave headroom rather than consuming the whole volume group. Asserted before
# anything is created, so a too-greedy change fails loudly instead of filling
# the disk that also holds the models.
backup_store_min_free_after: 150

backup_store_export_options: rw,sync,no_subtree_check,no_root_squash

# ---------------------------------------------------------- pete-pi export ----
# A second, separate export for Uptime Kuma's kuma.db backups on pete-pi (PET-386).
# The Pi does NOT join backup_store_clients: that list gets no_root_squash on the
# whole store, and the Pi runs the arm64 runner, docker and a tailnet-exposed UI.
# Root there must not gain root-level write over the only copies of every guest.
#
# So the Pi gets its own subdirectory, exported to it alone, with every uid squashed
# to one unprivileged account that owns only that directory. subtree_check matters:
# this shares a filesystem with the vzdump archives, and without it a crafted
# filehandle can reach outside the subtree. all_squash makes such a reach
# unprivileged; subtree_check closes it.
backup_store_pi_client: 192.168.50.4   # pete-pi
backup_store_pi_path: "{{ backup_store_path }}/pete-pi"
backup_store_pi_user: kuma-backup
# Fixed, so the export's anonuid and the directory owner cannot drift apart.
backup_store_pi_uid: 2386
backup_store_pi_export_options: >-
  rw,sync,subtree_check,root_squash,all_squash,anonuid={{ backup_store_pi_uid }},anongid={{ backup_store_pi_uid }}

backup_store_mount_options: defaults,_netdev,nofail,x-systemd.mount-timeout=60

# Client side
backup_store_client_mount: /mnt/ollama-backups
backup_store_pve_storage_id: ollama-backups

# Retention. vzdump writes a full archive every run, so these multiply.
backup_store_keep_daily: 7
backup_store_keep_weekly: 3
# ⚠ Superseded by backup_store_jobs below, which sets schedule AND mode per
# node. A single global schedule cannot express that pve03 needs a different
# mode from pve02, and pretending otherwise is what wedged pve03 nightly.

# ---------------------------------------------------------------- tmpdir ----
# vzdump rsyncs a container into a temporary directory and THEN compresses it.
# Left at its default that temp dir lands on the backup target itself, so every
# small file crosses NFS twice. Measured: a 823 MB container reached 382 MB in
# two and a half hours and was still going. Proxmox warns about it in the task
# log and is ignored, because the default silently works — just not usefully.
#
# It matters more than speed. 14 of pve01's 19 guests sit on thick LVM, which
# cannot snapshot, so vzdump falls back to SUSPEND mode: first sync while the
# guest runs, suspend, delta sync, resume. With the temp dir on NFS that first
# sync is the slow part and the suspend window stretches with it. On local disk
# the delta is seconds.
backup_store_tmpdir: /var/tmp/vzdump

# Space the tmpdir needs — one guest's used size, with margin. pve01's largest
# is runner-232 at 18 GB.
backup_store_tmpdir_need_gb: 30

# When the node's root filesystem has less than that free, carve a dedicated
# volume instead. pve01 has 16 GB free on root but 226 GB free in its VG; pve02
# has 48 GB free on root and needs no volume at all.
backup_store_tmpdir_lv: vzdump-tmp
backup_store_tmpdir_lv_size: 40G
backup_store_tmpdir_vg: pve

# ------------------------------------------------------------- the jobs ----
# One nightly job per node, staggered so they do not contend for the single NFS
# target. `mode` is dictated by the node's storage, not by taste — see the long
# note in tasks/jobs.yml for the measurements behind each value.
backup_store_jobs:
  - node: pve02
    schedule: "02:30"
    mode: snapshot   # guests on local-lvm; block snapshot, no downtime
  - node: pve03
    schedule: "02:45"
    mode: stop       # guests on a directory store; snapshot would rsync forever
    # ⚠ EXCLUSION IS "NO BACKUP AT ALL", NOT "BACKED UP DIFFERENTLY". vzdump's mode is
    # per JOB, so on a directory store there is no way to spare one guest the stop —
    # the only lever is leaving it out. Only put a VMID here when losing it entirely is
    # acceptable, and say why:
    #
    #   247 claude-247 — rebuilt end to end by claude.tf + roles/claude-code. Its repos
    #     are clones of GitHub main and its one unique file (~/.claude/.credentials.json)
    #     is recovered by an interactive /login that no restore avoids. Against that, the
    #     nightly stop kills whatever Remote Control session is in flight, which is the
    #     single thing the host exists to provide (PET-396, PET-403).
    exclude: [247]
