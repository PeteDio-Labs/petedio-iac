---
# Deliberately does NOT refresh the apt cache. nfs-common ships with Proxmox and
# is already present on both nodes, and pve01 carries a stale third-party
# nodesource repo that makes `apt-get update` fail outright. Refreshing a cache
# we do not need would make this role fail on unrelated repo drift.
- name: Check whether the NFS client is already present
  ansible.builtin.command: dpkg-query -W -f=${Status} nfs-common
  register: backup_nfs_pkg
  changed_when: false
  failed_when: false

- name: Install the NFS client only if it is missing
  when: "'install ok installed' not in backup_nfs_pkg.stdout"
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create the mount point
  ansible.builtin.file:
    path: "{{ backup_store_client_mount }}"
    state: directory
    mode: "0755"

# nofail and a bounded timeout are not optional here. These are Proxmox nodes,
# and a hard NFS mount to a box that is off will hang the boot — the same
# discipline the media-share role uses in the other direction.
- name: Mount the backup store
  ansible.posix.mount:
    path: "{{ backup_store_client_mount }}"
    src: "{{ backup_store_server_ip }}:{{ backup_store_path }}"
    fstype: nfs
    opts: "{{ backup_store_mount_options }}"
    state: mounted

# A mount that silently failed leaves an empty local directory that every
# downstream check still passes, and backups would then be written to the node's
# own root disk while appearing to succeed.
- name: Assert this really is NFS and not an empty local directory
  ansible.builtin.command: findmnt -no FSTYPE {{ backup_store_client_mount }}
  register: backup_fstype
  changed_when: false
  failed_when: "'nfs' not in backup_fstype.stdout"

- name: Prove it is writable from this node
  ansible.builtin.copy:
    dest: "{{ backup_store_client_mount }}/.write-test-{{ inventory_hostname }}"
    content: "written by {{ inventory_hostname }}\n"
    mode: "0644"

# ------------------------------------------------------------------ tmpdir --
- name: Measure free space on this node's root filesystem
  ansible.builtin.command: df -BG --output=avail /
  register: backup_root_avail
  changed_when: false
  check_mode: false

- name: Decide whether this node needs a dedicated volume for the tmpdir
  ansible.builtin.set_fact:
    backup_tmpdir_needs_lv: >-
      {{ (backup_root_avail.stdout_lines[1] | regex_replace('[^0-9]','') | int)
         < (backup_store_tmpdir_need_gb | int) }}

- name: Carve a volume for the tmpdir where root is too small
  when: backup_tmpdir_needs_lv | bool
  community.general.lvol:
    vg: "{{ backup_store_tmpdir_vg }}"
    lv: "{{ backup_store_tmpdir_lv }}"
    size: "{{ backup_store_tmpdir_lv_size }}"
    state: present

- name: Put a filesystem on it
  when: backup_tmpdir_needs_lv | bool
  community.general.filesystem:
    fstype: ext4
    dev: "/dev/{{ backup_store_tmpdir_vg }}/{{ backup_store_tmpdir_lv }}"
    force: false

- name: Mount the tmpdir volume
  when: backup_tmpdir_needs_lv | bool
  ansible.posix.mount:
    path: "{{ backup_store_tmpdir }}"
    src: "/dev/{{ backup_store_tmpdir_vg }}/{{ backup_store_tmpdir_lv }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

# Set explicitly rather than trusting the filesystem default, so both code paths
# provably end up the same. See the note on the directory case below.
- name: Ensure the mounted tmpdir is traversable by the mapped user
  when: backup_tmpdir_needs_lv | bool
  ansible.builtin.file:
    path: "{{ backup_store_tmpdir }}"
    state: directory
    mode: "0755"

# 0755, NOT 0700. vzdump runs its tar inside a user-namespace mapping
# (lxc-usernsexec -m u:0:100000:65536), so the tar process is an unprivileged
# mapped UID and cannot traverse a root-only directory. With 0700 every backup
# on this node failed with "Cannot open: Permission denied" while pve01 worked,
# purely because there the tmpdir is a MOUNT POINT and inherits 0755. Two code
# paths, two different permissions, one of them broken.
- name: Otherwise just make the directory on local disk
  when: not (backup_tmpdir_needs_lv | bool)
  ansible.builtin.file:
    path: "{{ backup_store_tmpdir }}"
    state: directory
    mode: "0755"

# Without this line vzdump puts the temp directory on the backup target.
- name: Point vzdump at the local tmpdir
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: '^\s*#?\s*tmpdir:'
    line: "tmpdir: {{ backup_store_tmpdir }}"
    create: true
    mode: "0644"

- name: Prove vzdump will not use NFS for scratch
  ansible.builtin.command: findmnt -no FSTYPE --target {{ backup_store_tmpdir }}
  register: backup_tmpdir_fs
  changed_when: false
  failed_when: "'nfs' in backup_tmpdir_fs.stdout"

- name: Read the configured Proxmox storages
  ansible.builtin.command: pvesm status
  register: backup_pvesm
  changed_when: false
  failed_when: false

- name: Register the store with Proxmox
  ansible.builtin.command: >-
    pvesm add dir {{ backup_store_pve_storage_id }}
    --path {{ backup_store_client_mount }}
    --content backup
    --is_mountpoint yes
    --prune-backups keep-daily={{ backup_store_keep_daily }},keep-weekly={{ backup_store_keep_weekly }}
  when: backup_store_pve_storage_id not in (backup_pvesm.stdout | default(''))
  register: backup_storage_added
  changed_when: backup_storage_added.rc == 0

# ⚠ THE NFS ASSERT ABOVE RUNS ONLY WHEN THIS ROLE DOES, NOT AT BOOT. The mount is
# nofail, so a boot that cannot reach ollama-host leaves the mount point an ordinary
# directory on the root disk. Without is_mountpoint, Proxmox reports that directory
# as an active store and vzdump writes every nightly archive into it. pve03 did this
# on 2026-09-04. pve02 did it from 2026-09-14 until its root disk held 0 bytes free
# and three containers were stuck on `lock: snapshot-delete` (PET-529).
#
# With is_mountpoint set, Proxmox reports the store inactive while the path is not a
# mount point, and vzdump fails instead. The option lives in the cluster-wide
# /etc/pve/storage.cfg, so the first node sets it and the second reads it back as set.
- name: Read the store's Proxmox config
  ansible.builtin.command: pvesh get /storage/{{ backup_store_pve_storage_id }} --output-format json
  register: backup_storage_cfg
  changed_when: false

- name: Make Proxmox treat an unmounted store as offline
  when:
    - not (backup_storage_cfg.skipped | default(false))
    - (backup_storage_cfg.stdout | from_json).is_mountpoint | default('no') | string | lower in ['no', '0', 'false', '']
  ansible.builtin.command: pvesm set {{ backup_store_pve_storage_id }} --is_mountpoint yes
  changed_when: true

# is_mountpoint must not take a mounted store offline. The NFS assert above proved the
# mount on this node, so anything but `active` here is the option misbehaving.
- name: Prove Proxmox still reports the mounted store as active
  ansible.builtin.command: pvesm status --storage {{ backup_store_pve_storage_id }}
  register: backup_storage_status
  changed_when: false
  failed_when: >-
    backup_storage_status.rc != 0
    or (backup_storage_status.stdout_lines | length) < 2
    or backup_storage_status.stdout_lines[1].split()[2] != 'active'

# noqa reason: the suggested rewrite joins the {%- %} tags onto the prose lines, which in
# a >- folded block turns a readable conditional into one unbroken line. The `-` markers
# already strip the whitespace at render time, so the output is identical either way.
- name: Report  # noqa: jinja[spacing]
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {% if backup_pvesm.skipped | default(false) -%}
      not checked (dry run) — would register the storage if absent.
      {%- elif backup_store_pve_storage_id in (backup_pvesm.stdout | default('')) -%}
      storage {{ backup_store_pve_storage_id }} present.
      {%- else -%}
      storage {{ backup_store_pve_storage_id }} registered.
      {%- endif %}
      Keeping {{ backup_store_keep_daily }} daily + {{ backup_store_keep_weekly }} weekly.
      The nightly job itself is owned by tasks/jobs.yml.
