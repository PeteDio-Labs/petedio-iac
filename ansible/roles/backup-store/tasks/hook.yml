---
# Removes the vzdump hook that PET-539 installed to warn Palworld players. Palworld is
# retired (PET-779), so no guest needs the hook. Both tasks are idempotent and leave a node
# that never had the hook unchanged.
- name: Stop pointing vzdump at the hook
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: '^\s*script:\s*/usr/local/sbin/vzdump-hook\s*$'
    state: absent

- name: Remove the vzdump hook
  ansible.builtin.file:
    path: /usr/local/sbin/vzdump-hook
    state: absent
