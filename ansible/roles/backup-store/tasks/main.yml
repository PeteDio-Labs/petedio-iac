---
- name: Build the store on the machine that holds the disk
  ansible.builtin.include_tasks: server.yml
  when: inventory_hostname == backup_store_server

- name: Consume it from the Proxmox nodes
  ansible.builtin.include_tasks: client.yml
  when: inventory_hostname != backup_store_server

- name: Schedule the nightly job on each Proxmox node
  ansible.builtin.include_tasks: jobs.yml
  when: inventory_hostname != backup_store_server

# import, not include, so `--tags vzdump-hook` reaches these tasks without the Vault
# values the rest of the role needs.
- name: Warn Palworld players and save the world before a backup
  ansible.builtin.import_tasks: hook.yml
  when: inventory_hostname != backup_store_server
  tags: [vzdump-hook]

- name: Check each morning that the night's backups landed
  ansible.builtin.include_tasks: health.yml
  when: inventory_hostname != backup_store_server
