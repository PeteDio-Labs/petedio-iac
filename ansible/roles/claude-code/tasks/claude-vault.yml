# claude-vault.yml (PET-763): a Claude Code Remote Control session for the operator account,
# started inside the break-glass Vault login. Included from tasks/main.yml behind
# claude_operator_claude_vault_enable and the break-glass conditions, so it lands only where
# vault-breakglass does. templates/claude-vault.j2 carries the design.
#
# WHAT THIS ADDS TO THE OPERATOR ACCOUNT. Its own Claude Code install and, once Pedro signs in,
# a claude.ai login in /home/{{ claude_operator_user }}/.claude. That login is a credential the
# account did not hold before PET-763. It adds no reach: the phone key that opens this account
# also opens claude-ops, which already holds a claude.ai login. It adds no Vault access either:
# Vault admin still needs the password and a TOTP code at every unlock.
#
# NO CREDENTIAL PASSES THROUGH THIS ROLE. The claude.ai login is an operator step
# (`claude auth login`, as the operator), and the Vault token exists only at run time.
---
# Separate from claude_npm_prefix and claude_ops_npm_prefix, under the operator's 0700 home, so
# neither session user can plant the binary claude-vault runs.
- name: Create the operator's npm prefix
  ansible.builtin.file:
    path: "{{ claude_operator_npm_prefix }}/bin"
    state: directory
    follow: false
    owner: "{{ claude_operator_user }}"
    group: "{{ claude_operator_user }}"
    mode: "0755"

- name: Point the operator's npm at its own prefix
  ansible.builtin.copy:
    dest: "/home/{{ claude_operator_user }}/.npmrc"
    owner: "{{ claude_operator_user }}"
    group: "{{ claude_operator_user }}"
    mode: "0644"
    content: |
      # Managed by Ansible (roles/claude-code).
      prefix={{ claude_operator_npm_prefix }}

- name: Check the operator's .bashrc is a real file before root writes to it
  ansible.builtin.stat:
    path: "/home/{{ claude_operator_user }}/.bashrc"
    follow: false
  register: claude_operator_bashrc

- name: Refuse to write through a symlinked operator .bashrc
  ansible.builtin.assert:
    that:
      - not (claude_operator_bashrc.stat.islnk | default(false))
    fail_msg: >-
      /home/{{ claude_operator_user }}/.bashrc is a symlink to
      {{ claude_operator_bashrc.stat.lnk_target | default('unknown') }}. The next task runs as
      root and sets owner/group/mode, so writing through it would hand that target to
      {{ claude_operator_user }} (PET-410). Remove the link and re-run.

# For the one-time `claude auth login`. claude-vault itself calls the binary by its full path.
- name: Put the operator's npm bin first on its PATH
  ansible.builtin.blockinfile:
    path: "/home/{{ claude_operator_user }}/.bashrc"
    owner: "{{ claude_operator_user }}"
    group: "{{ claude_operator_user }}"
    mode: "0644"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK (claude-code)"
    block: |
      export PATH="{{ claude_operator_npm_prefix }}/bin:$PATH"

# Installed only when absent, for the reason tasks/main.yml gives: the auto-updater owns the
# version. runuser, not become_user, for the reason given there too.
- name: Check whether the operator's Claude Code is already installed
  ansible.builtin.stat:
    path: "{{ claude_operator_npm_prefix }}/bin/claude"
  register: claude_operator_binary

- name: Install Claude Code for the operator (npm global, as the operator)
  ansible.builtin.command:
    cmd: runuser -u {{ claude_operator_user }} -- npm install -g {{ claude_npm_package }}
  environment:
    HOME: "/home/{{ claude_operator_user }}"
    NPM_CONFIG_PREFIX: "{{ claude_operator_npm_prefix }}"
  when: not claude_operator_binary.stat.exists
  changed_when: true

# A directory of its own, because Claude Code never saves workspace trust for a home directory
# and would ask on every run.
- name: Create the claude-vault working directory
  ansible.builtin.file:
    path: "{{ claude_operator_claude_vault_dir }}"
    state: directory
    follow: false
    owner: "{{ claude_operator_user }}"
    group: "{{ claude_operator_user }}"
    mode: "0700"

# Root-owned, like vault-breakglass, so no session can rewrite what Pedro runs to unlock.
- name: Install claude-vault
  ansible.builtin.template:
    src: claude-vault.j2
    dest: /usr/local/bin/claude-vault
    owner: root
    group: root
    mode: "0755"
