---
# claude-code tasks (PET-396) — put Claude Code on LXC 247 and leave it ready to serve
# Remote Control sessions. Idempotent: apt/key/repo/user/clone all converge, and the npm
# install runs only when the binary is missing (see its comment).
#
# NO PRECONDITION ON THE NODE. Unlike plane-235 or openfaas-241 there is no
# scripts/lxc-features-247.sh to run first: nothing here needs nesting or keyctl, because
# nothing here runs Docker.
#
# WHAT THIS PLAY CANNOT DO. Remote Control needs a real claude.ai login, and there is no
# unattended path to one — API keys and `claude setup-token` tokens are both refused by the
# feature. So this role installs, configures, and stops. The login, the workspace-trust
# dialog and the one-time Remote Control confirmation are operator steps over SSH, after
# which the units come up by re-running with `-e claude_remote_enable=true`. See README.md
# in this role.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - jq
      - less
      - tmux
      - unzip
    state: present
    update_cache: true

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# --- Node.js (NodeSource) --------------------------------------------------------------
# Claude Code is an npm package, so Node is the runtime, not an accessory. Debian's own
# nodejs is too old for it; NodeSource pins a chosen LTS major instead.
#
# The key is fetched ARMORED to a .asc path. apt reads ascii-armored keys from `signed-by`
# directly, which skips the `gpg --dearmor` dance and the non-idempotent temp file it needs.

- name: Add the NodeSource apt signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add the NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ claude_nodejs_major }}.x nodistro main
    filename: nodesource
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# --- GitHub CLI --------------------------------------------------------------------------
# The session opens its own PRs from this box, which is most of the point of giving it the
# repos. `gh` carries its own auth (`gh auth login`), an operator step like the claude login.

- name: Add the GitHub CLI apt signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add the GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

# --- The session user --------------------------------------------------------------------
# Non-root, and required to be: Claude Code refuses bypassPermissions as root or under sudo.
# This user deliberately gets NO sudo — a session that can reconfigure the host it runs on
# can also undo the boundary it was given.

- name: Create the session user
  ansible.builtin.user:
    name: "{{ claude_user }}"
    home: "{{ claude_home }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Authorize the operator SSH keys for the session user
  ansible.posix.authorized_key:
    user: "{{ claude_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ claude_authorized_keys }}"

# --- npm prefix ----------------------------------------------------------------------------
# Per-user, so Claude Code can update ITSELF. With a root-owned system prefix the auto-update
# fails with EACCES and the host silently rots on the version it was installed with (PET-139,
# learned on the agent-loop box).

- name: Create the per-user npm prefix
  ansible.builtin.file:
    path: "{{ claude_npm_prefix }}/bin"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"

- name: Point npm at the per-user prefix
  ansible.builtin.copy:
    dest: "{{ claude_home }}/.npmrc"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
    content: |
      # Managed by Ansible (roles/claude-code).
      prefix={{ claude_npm_prefix }}

- name: Put the per-user npm bin first on the session user's PATH
  ansible.builtin.blockinfile:
    path: "{{ claude_home }}/.bashrc"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK (claude-code)"
    block: |
      # The user copy of Claude Code must win over anything in /usr/bin, so that an
      # auto-update is the version you get on the next login.
      export PATH="{{ claude_npm_prefix }}/bin:$PATH"

# Installed ONLY when absent. Claude Code updates itself, so re-running `npm i -g` on every
# play would fight the auto-updater and could move a session's version mid-task. Ansible's
# job here is that the binary EXISTS; which version it is belongs to the tool.
- name: Check whether Claude Code is already installed
  ansible.builtin.stat:
    path: "{{ claude_npm_prefix }}/bin/claude"
  register: claude_binary

- name: Install Claude Code (npm global, as the session user)
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.command:
    cmd: npm install -g {{ claude_npm_package }}
  environment:
    HOME: "{{ claude_home }}"
    NPM_CONFIG_PREFIX: "{{ claude_npm_prefix }}"
  when: not claude_binary.stat.exists
  changed_when: true

# --- The workspace -------------------------------------------------------------------------

- name: Create the workspace root
  ansible.builtin.file:
    path: "{{ claude_workspace }}"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"

- name: Clone the workspace repos
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.git:
    repo: "{{ claude_github_base }}/{{ item.name }}.git"
    dest: "{{ claude_workspace }}/{{ item.dest }}"
    update: "{{ claude_update_repos }}"
    version: HEAD
  loop: "{{ claude_repos }}"
  loop_control:
    label: "{{ item.name }}"

# --- Claude Code settings ------------------------------------------------------------------
# SEEDED, NOT OWNED (`force: false`). Claude Code writes this file itself — /config toggles
# and one-time prompts land here — so an Ansible-owned copy would silently revert choices
# made in a session. What the units actually depend on is passed on their command line
# instead, where a flag outranks every settings file. This file only makes a hand-run
# `claude` over SSH behave the way the units do.
#
# ⚠ DO NOT add DISABLE_TELEMETRY, DO_NOT_TRACK, CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC or
# DISABLE_GROWTHBOOK to `env` here, or to the units. Each one disables the feature-flag
# evaluation that Remote Control availability depends on, so the feature stops being offered
# at all — and it presents as "unavailable", which reads like an outage rather than a setting.

- name: Create the Claude Code config directory
  ansible.builtin.file:
    path: "{{ claude_home }}/.claude"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0700"

- name: Seed the Claude Code user settings
  ansible.builtin.copy:
    dest: "{{ claude_home }}/.claude/settings.json"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0600"
    force: false
    content: "{{ claude_seed_settings | to_nice_json }}\n"
  vars:
    claude_seed_settings:
      permissions:
        defaultMode: "{{ claude_permission_mode }}"
      env:
        TZ: "{{ claude_timezone }}"

# --- The Remote Control servers --------------------------------------------------------------
# One unit per project directory, rendered from claude_remote_sessions.

- name: Install the remote-control units
  ansible.builtin.template:
    src: claude-remote.service.j2
    dest: "/etc/systemd/system/claude-remote-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ claude_remote_sessions }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

# A unit left behind by an entry REMOVED from claude_remote_sessions would keep serving a
# session nobody declares any more — drift that answers from a phone. Reconcile by removing
# every managed unit this run did not render.
- name: Find the remote-control units on the host
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "claude-remote-*.service"
  register: claude_units_present

- name: Work out which units are no longer declared
  ansible.builtin.set_fact:
    claude_units_stale: >-
      {{ claude_units_present.files | map(attribute='path') | map('basename') | list
         | difference(claude_remote_sessions | map(attribute='name')
                      | map('regex_replace', '^', 'claude-remote-')
                      | map('regex_replace', '$', '.service') | list) }}

- name: Stop and disable the undeclared remote-control units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ claude_units_stale }}"

- name: Delete the undeclared remote-control unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ claude_units_stale }}"
  notify: Reload systemd

- name: Flush handlers so a changed unit is on disk before it is started
  ansible.builtin.meta: flush_handlers

# Started only once the operator has logged in — see claude_remote_enable in defaults. A
# server started without an eligible login exits immediately, and Restart=always turns that
# into a crash loop that reads like a broken host rather than a missing step.
- name: Enable and start the remote-control servers
  ansible.builtin.systemd:
    name: "claude-remote-{{ item.name }}.service"
    enabled: "{{ claude_remote_enable }}"
    state: "{{ 'started' if claude_remote_enable else 'stopped' }}"
    daemon_reload: true
  loop: "{{ claude_remote_sessions }}"
  loop_control:
    label: "{{ item.name }}"
