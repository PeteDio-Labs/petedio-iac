---
# claude-code / the ticket-driven work loop — units half (PET-399).
#
# The loop's home, its own clone of the repo, the prompt, the tick script and the
# timer/service pair. Unlike tasks/loop.yml, everything here converges on EVERY run whether
# or not the identity was passed: the timer must be reconcilable to `disabled` by someone
# who does not hold the credentials, and a play that installs half a loop is worse than one
# that installs all of it and leaves it off.

- name: Create the loop home and its per-tick run dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # ⚠ follow: false is load-bearing (PET-410). ansible.builtin.file defaults to
    # follow: yes, and this task runs as ROOT while the path lives inside a home the
    # `claude` user owns. Replace the path with a symlink and root chowns the TARGET —
    # the one move that would reach /etc/claude-loop/app.pem, which this design claims is
    # unreachable. PET-410 adds the same line to the three equivalents in main.yml; these
    # are the loop's, and whichever branch merges second must not drop the other's.
    follow: false
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0750"
  loop:
    - "{{ claude_loop_home }}"
    - "{{ claude_loop_home }}/run"

# The state dir and the prompt's parent are ROOT-OWNED (PET-441). The claim records under
# items/, the heartbeat, the lock and the tick's scratch live in the state dir; the session
# reads them (the dir is 0755, the files land 0644) but cannot write them, so it cannot forge
# a claim or drop the lock. These paths sit outside any tree the session owns, so they need
# no `follow: false` the way the claude-owned home above does.
- name: Create the root-owned loop state dir and the prompt dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ claude_loop_state_dir }}"
    - "{{ claude_loop_state_dir }}/items"
    - "{{ claude_loop_prompt | dirname }}"

# ⚠ ONE-TIME MIGRATION (PET-441): the loop may already have written claim records in its old
# ~/loop/state/items. Move them into the root-owned items dir once, then remove the old,
# claude-owned state tree — its heartbeat and lock regenerate at the new location. On a fresh
# host the old dir never existed and all of this no-ops. `force: false` keeps a re-run from
# clobbering a claim the loop has since rewritten at the new location. Remove this block once
# 247 has converged past it.
- name: Check for an old claude-owned state dir to migrate
  ansible.builtin.stat:
    path: "{{ claude_loop_home }}/state"
  register: claude_loop_old_state

- name: Find any claim records the loop left in its old state dir
  ansible.builtin.find:
    paths: "{{ claude_loop_home }}/state/items"
    patterns: "*.json"
    file_type: file
  register: claude_loop_old_claims
  when: claude_loop_old_state.stat.exists

- name: Move those claim records into the root-owned items dir
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ claude_loop_state_dir }}/items/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ claude_loop_old_claims.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: claude_loop_old_state.stat.exists

- name: Remove the emptied old state dir once its claims are migrated
  ansible.builtin.file:
    path: "{{ claude_loop_home }}/state"
    state: absent

# The tick, the prompt and the lock moved to root-owned locations (PET-441); their old copies
# under the loop home are claude-adjacent and must not linger. A stale, still-executable
# ~/loop/claude-loop-tick.sh run by hand would use the old ~/loop/state paths and re-open the
# hole this closes. Remove all three. state=absent no-ops on a fresh host. Drop this task with
# the migration block above once 247 has converged.
- name: Remove the loop files that moved to root-owned locations
  ansible.builtin.file:
    path: "{{ claude_loop_home }}/{{ item }}"
    state: absent
  loop:
    - claude-loop-tick.sh
    - prompt.md
    - tick.lock

# ⚠ THE LOOP GETS ITS OWN CLONE, NOT {{ claude_workspace }}/{{ claude_loop_project_dir }}.
# A tick runs `git reset --hard` and `git clean -ffdx` on this directory before branching,
# and the workspace clone is what a human drives over SSH and what the remote-control
# servers hand out worktrees from. A tick must never be able to throw away someone's
# uncommitted work.
#
# This costs nothing that the shared clone bought: `claude -p` skips the workspace trust
# dialog entirely (`claude --help`, under -p), so the loop does not need a pre-trusted
# directory the way an interactive session does. Trust it by hand anyway if you want MCP
# tools resolving inside a tick — docs/runbooks/claude-loop.md.
#
# SEEDED, NEVER UPDATED, like the workspace clones: `creates:` guards it, and each tick
# fetches and re-branches for itself. runuser rather than become_user, for the reason given
# at the npm install in main.yml.
- name: Clone the repo the loop works in
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ claude_user }} --
      git clone {{ claude_github_base }}/{{ claude_loop_repo | basename }}.git
      {{ claude_loop_home }}/{{ claude_loop_project_dir }}
    creates: "{{ claude_loop_home }}/{{ claude_loop_project_dir }}/.git"
  environment:
    HOME: "{{ claude_home }}"

# The tick refuses to reset a directory that does not carry this file, so a mis-set
# CLAUDE_LOOP_CHECKOUT fails loudly instead of cleaning whatever it was pointed at.
#
# It lives INSIDE .git/ on purpose: in the working tree it would be untracked, so
# `git clean -ffdx` would delete it (and the second tick would refuse to run) and
# `git add -A` would commit it into the pull request. Both were found by running
# scripts/test-claude-loop-tick.sh.
- name: Mark the clone as the loop's own
  ansible.builtin.file:
    path: "{{ claude_loop_home }}/{{ claude_loop_project_dir }}/.git/claude-loop-checkout"
    state: touch
    # Same reason as above, by a different code path: `state: touch` does not realpath in
    # execute_touch, but load_file_common_arguments does it before lchown, so the target
    # still gets the ownership. Same fix.
    follow: false
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# A `files/` entry, not a template. The tick substitutes the prompt's double-brace
# placeholders itself, with a plain string replace — so Ansible must copy the file verbatim
# rather than try to resolve them as variables, which is what moving it to templates/ would
# do, and it would fail the play on the first one.
- name: Install the loop prompt
  ansible.builtin.copy:
    src: claude-loop-prompt.md
    dest: "{{ claude_loop_prompt }}"
    owner: root
    group: root
    mode: "0644"

# Kept in scripts/ rather than this role's files/, because it is an operational script: an
# operator runs it by hand before ever enabling the timer, and
# scripts/test-claude-loop-tick.sh exercises it there. A second copy under files/ would
# drift from the one the tests run.
- name: Check that the tick script is where this role expects it
  ansible.builtin.stat:
    path: "{{ role_path }}/../../../scripts/claude-loop-tick.sh"
  register: claude_loop_tick_src
  delegate_to: localhost
  become: false

- name: Fail if the tick script is missing from the repo
  ansible.builtin.assert:
    that: claude_loop_tick_src.stat.exists
    fail_msg: >-
      scripts/claude-loop-tick.sh is not at
      {{ role_path }}/../../../scripts/claude-loop-tick.sh. This role reaches out of
      ansible/ for it on purpose — if the repo layout moved, fix the path here rather than
      copying the script into the role.

# Installed as a root-owned system binary OFF the loop user's home (PET-441). This IS a
# boundary, not tidiness: systemd's ExecStart runs this path as root every tick, so it must
# be one the session cannot rewrite between ticks. The old ~/loop location made the 0555 a
# guard against a stray edit only; here root owns the dir and the file.
- name: Install the tick script
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/claude-loop-tick.sh"
    dest: "{{ claude_loop_tick_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the loop units
  ansible.builtin.template:
    src: "claude-loop.{{ item }}.j2"
    dest: "/etc/systemd/system/claude-loop.{{ item }}"
    mode: "0644"
  loop:
    - service
    - timer
  notify: Reload systemd

- name: Flush handlers so a changed unit is on disk before it is started
  ansible.builtin.meta: flush_handlers

# ⚠ `| bool` IS LOAD-BEARING ON BOTH LINES, for the reason spelled out at the remote-control
# equivalent in main.yml: `-e claude_loop_enable=false` hands Jinja the STRING "false",
# which is truthy, so a bare `if claude_loop_enable` would turn the loop ON by way of the
# documented way to turn it off. That exact bug shipped in PET-396.
#
# Both branches converge, which is the other half. Most gated timers in this tree wrap
# installation in `when: <flag> | bool` and leave a running timer running when the flag goes
# false; this role does not, and a loop that opens pull requests is the last place to start.
- name: Enable and start the loop timer
  ansible.builtin.systemd:
    name: claude-loop.timer
    enabled: "{{ claude_loop_enable | bool }}"
    state: "{{ 'started' if claude_loop_enable | bool else 'stopped' }}"
    daemon_reload: true

- name: Report where the loop stands
  ansible.builtin.debug:
    msg: >-
      claude-loop.timer is {{ 'ENABLED — it will open draft pull requests on ' ~ claude_loop_repo
                              if claude_loop_enable | bool
                              else 'installed and STOPPED. Run one tick by hand before you enable it' }}.
      Schedule {{ claude_loop_oncalendar }}, label '{{ claude_loop_label }}',
      heartbeat {{ claude_loop_state_dir }}/last-tick.json.
