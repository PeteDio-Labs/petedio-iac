# workspace-mirror.yml — deliver the PRIVATE petedio-workspace clone to this host while no
# session on it holds a credential (PET-480, re-routed by PET-493).
#
# ⚠ THIS WAS A DEPLOY KEY UNTIL PET-493, AND THE KEY WAS NEVER GOING TO WORK. PET-480 chose a
# read-only deploy key generated on the host. PeteDio-Labs disallows deploy keys for every
# repository it owns:
#
#     gh api orgs/PeteDio-Labs --jq .deploy_keys_enabled_for_repositories   # false
#
# The repository's own key page reads "Disabled by PeteDio-Labs". PET-481 ran the flow to
# completion and generated a key on 247 that GitHub would never have accepted, which is why
# the delivery never started. The replacement is a GitHub App installed on THIS ONE
# repository, Contents and Metadata read-only, minting a one-hour installation token per
# fetch. It keeps every property the deploy key was chosen for — it cannot push, cannot read
# a second repository, and cannot act as Pedro — and unlike the key, GitHub accepts it.
#
# THE SESSION USER STILL HOLDS NOTHING. Four properties carry that, and all four are
# load-bearing:
#
#   1. The App private key is 0400 root:root and the broker that reads it is 0500 root:root.
#      Sessions run as {{ claude_user }} with no sudo (PET-408), so a session can neither read
#      the key nor run the broker — the same arrangement {{ claude_loop_conf_dir }} uses.
#   2. No token is ever written down. The broker mints one per fetch and hands it to git over
#      a pipe, as a credential helper. It is in no file, no git config and no command line.
#   3. Root fetches into a BARE MIRROR it owns, and the session's working clone is cloned
#      FROM THAT MIRROR over a local path. So the credential is used only by root, in a
#      directory no session can write.
#   4. The clone command sets the helper with `git -c … clone`, NOT `git clone -c …`. Measured
#      on git 2.50.1: the second form persists the setting into the new repository's config
#      and the first does not. The mirror's config names no helper at all.
#
# ⚠ THE MIRROR IS WHY, NOT AN EXTRA STEP. The obvious shape — point the claude-owned clone
# at GitHub and let a root timer fetch it — hands root a `git` process running inside a
# directory the sessions own. `git` honours `core.sshCommand`, `core.fsmonitor` and
# core.hooksPath from the repository's OWN config, so a session that rewrites
# {{ claude_workspace }}/{{ claude_workspace_mirror_dest }}/.git/config gets arbitrary code
# execution as root on the next fetch. Root must never run git inside a path a session can
# write. The mirror keeps root's git in /var/lib and the session's git in its own clone.
#
# ONE RUN, NOT TWO. The deploy key needed a run to generate it and a run to use it, with a
# paste in between. The App is authorized before Ansible starts, so the run that carries the
# identity also mirrors and clones. A run that carries no identity converges everything else
# and leaves the credentials alone, exactly as tasks/loop.yml does — which is what keeps a
# bare `ansible-playbook playbooks/configure-claude-code.yml` runnable on a host that has
# already been seeded.
---
- name: Create the root-owned mirror credential directory
  ansible.builtin.file:
    path: "{{ claude_workspace_mirror_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ⚠ RECONCILE WHAT THE OLD ROUTE LEFT, not only what this one adds. PET-481's run 1 generated
# a deploy key on 247 and it is still there, 0400 root:root. Nothing rotates it, nothing uses
# it, and GitHub was never going to accept it. A file that only a play can remove is a file
# that stays until a play removes it, so this converges on every run rather than once.
- name: Remove the deploy key the old route generated (PET-493)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ claude_workspace_mirror_key }}"
    - "{{ claude_workspace_mirror_key }}.pub"

# Gated on presence, not on the enable flag — the reverse of tasks/loop.yml, and for a reason
# this host makes concrete. claude_workspace_mirror_enable is declared true in host_vars and
# stays true, so asserting on it would fail every bare run of the play. The end of
# playbooks/configure-claude-code.yml reports an unfinished delivery instead, naming the step
# that stopped, which is what claude_workspace_mirror_blocked_at below is for.
- name: Decide whether this run carries the mirror App identity
  ansible.builtin.set_fact:
    claude_workspace_mirror_identity_present: >-
      {{ claude_workspace_mirror_app_id | default('') | length > 0
         and claude_workspace_mirror_installation_id | default('') | length > 0
         and claude_workspace_mirror_app_pem | default('') | length > 0 }}
  no_log: true

- name: Report that the mirror identity was not passed, so the credentials are left alone
  ansible.builtin.debug:
    msg: >-
      No mirror App identity in this run — {{ claude_workspace_mirror_conf_dir }} is left as
      it is. If this host has already been seeded, delivery continues with what is on disk.
      Run scripts/deploy-claude-247.sh to land or rotate the credentials.
  when: not claude_workspace_mirror_identity_present | bool

# 0400 root:root, and the mode is the entire point. Sessions on this host run
# bypassPermissions as {{ claude_user }}; anything that user can read, a session can read.
# These files are reachable ONLY through the broker below.
- name: Land the App identity the broker reads
  ansible.builtin.template:
    src: claude-workspace-mirror-github.env.j2
    dest: "{{ claude_workspace_mirror_conf_dir }}/github.env"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: claude_workspace_mirror_identity_present | bool

# A trailing newline is added if the Vault field lost one, because openssl rejects a PEM
# without it. Same treatment as the loop's app.pem, for the same reason.
- name: Land the App private key
  ansible.builtin.copy:
    content: "{{ claude_workspace_mirror_app_pem | trim }}\n"
    dest: "{{ claude_workspace_mirror_conf_dir }}/app.pem"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: claude_workspace_mirror_identity_present | bool

# Unconditional: the broker holds no secret, so a run without the identity should still bring
# it up to date. 0500 means root-only, and root-only is what stops a session minting a token.
- name: Install the mirror credential broker
  ansible.builtin.template:
    src: claude-workspace-mirror-broker.j2
    dest: "{{ claude_workspace_mirror_broker }}"
    owner: root
    group: root
    mode: "0500"

# What is ON DISK, not what this run carried. A seeded host converges from a bare run, and
# these two files are the whole credential.
- name: Check whether the App credentials are on this host
  ansible.builtin.stat:
    path: "{{ item }}"
  register: claude_workspace_mirror_creds
  loop:
    - "{{ claude_workspace_mirror_conf_dir }}/github.env"
    - "{{ claude_workspace_mirror_conf_dir }}/app.pem"

- name: Record whether the credentials are complete
  ansible.builtin.set_fact:
    claude_workspace_mirror_creds_on_disk: >-
      {{ (claude_workspace_mirror_creds.results
          | map(attribute='stat.exists') | select | list | length) == 2 }}

# Two probes rather than one, because they fail for different reasons and the operator needs
# to know which. A bad key or installation id fails the mint; an App that is not installed on
# the repository mints a token fine and then cannot read anything.
#
# no_log because stdout IS an installation token. failed_when false because a first run on an
# unseeded host is expected to reach here and fail.
- name: Mint an installation token through the broker, as root
  ansible.builtin.command:
    cmd: "{{ claude_workspace_mirror_broker }} mint-token"
  register: claude_workspace_mirror_mint
  changed_when: false
  failed_when: false
  no_log: true
  when: claude_workspace_mirror_creds_on_disk | bool

# noqa reason: `ansible.builtin.git` has no ls-remote. Its cheapest operation is a clone,
# which is the thing this task exists to avoid attempting.
- name: Check whether the App can read the repository  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      git {{ claude_workspace_mirror_git_opts }}
      ls-remote --heads {{ claude_workspace_mirror_url }} HEAD
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: claude_workspace_mirror_probe
  changed_when: false
  failed_when: false
  when: claude_workspace_mirror_creds_on_disk | bool

# Its own file so tests/workspace-mirror-readiness.yml can include the real expression
# rather than a copy. That file carries the reasoning and the folded-scalar warning.
- name: Decide whether the mirror can be delivered in this run
  ansible.builtin.include_tasks: workspace-mirror-readiness.yml

- name: Report why the mirror cannot be delivered in this run
  ansible.builtin.debug:
    msg:
      - "The {{ claude_workspace_mirror_repo }} mirror did not converge: {{ claude_workspace_mirror_blocked_at }}."
      - "The mirror, its timer and the {{ claude_workspace_mirror_dest }} clone are left alone; everything else in this play converges."
      - "broker mint-token rc={{ claude_workspace_mirror_mint.rc | default('not run') }}"
      - "git ls-remote rc={{ claude_workspace_mirror_probe.rc | default('not run') }} {{ claude_workspace_mirror_probe.stderr | default('') | trim }}"
  when: not claude_workspace_mirror_ready | bool

- name: Create the root-owned mirror directory
  ansible.builtin.file:
    path: "{{ claude_workspace_mirror_state_dir }}"
    state: directory
    owner: root
    group: root
    # 0755: the session user must READ this to clone from it, and must never write it.
    # Ownership is what keeps root's git out of a session-writable config; the mode only
    # decides who can read.
    mode: "0755"
  when: claude_workspace_mirror_ready | bool

# ⚠ `git -c … clone`, NOT `git clone -c …`. The two are not interchangeable and the difference
# is the whole reason the token stays out of the mirror. Measured on git 2.50.1:
#
#   git clone -c credential.helper=X --mirror src a.git   ->  a.git/config KEEPS helper = X
#   git -c credential.helper=X clone --mirror src b.git   ->  b.git/config names no helper
#
# The first form would write the credential path into a config that every later fetch reads,
# which is the thing PET-493 set out not to do. The unit below passes the same options on its
# own command line for the same reason.
#
# noqa reason: `ansible.builtin.git` offers `bare`, not `mirror`, and the two differ in the
# one way that matters here. Measured on git 2.5x: `clone --bare` sets no
# `remote.origin.fetch` at all, while `clone --mirror` sets `+refs/*:refs/*` and
# `remote.origin.mirror=true`. The timer runs `remote update --prune`, which needs that
# refspec, so a bare clone would refresh nothing.
- name: Mirror the repository, as root  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      git {{ claude_workspace_mirror_git_opts }}
      clone --mirror {{ claude_workspace_mirror_url }}
      {{ claude_workspace_mirror_path }}
    creates: "{{ claude_workspace_mirror_path }}/HEAD"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when: claude_workspace_mirror_ready | bool

- name: Install the mirror refresh unit
  ansible.builtin.template:
    src: claude-workspace-mirror.service.j2
    dest: /etc/systemd/system/claude-workspace-mirror.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the mirror refresh timer
  ansible.builtin.template:
    src: claude-workspace-mirror.timer.j2
    dest: /etc/systemd/system/claude-workspace-mirror.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the units are on disk before the timer is started
  ansible.builtin.meta: flush_handlers

# Converges BOTH ways: the timer stops when the mirror is not ready, so a host that loses the
# App, or whose App loses access, does not keep a unit that fails every half hour.
- name: Converge the mirror refresh timer
  ansible.builtin.systemd:
    name: claude-workspace-mirror.timer
    enabled: "{{ claude_workspace_mirror_ready | bool }}"
    state: "{{ 'started' if claude_workspace_mirror_ready | bool else 'stopped' }}"

# ⚠ safe.directory, and it is not optional. The mirror is root-owned and the session user
# reads it, so every git command {{ claude_user }} runs against it — this clone, and every
# `git fetch` a session runs later — refuses with "detected dubious ownership in repository"
# until the path is allowlisted. The error names ownership and reads like corruption.
- name: Read the session user's existing safe.directory entries
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ claude_user }} --
      git config --global --get-all safe.directory
  environment:
    HOME: "{{ claude_home }}"
  register: claude_workspace_mirror_safe_existing
  changed_when: false
  # `--get-all` exits 1 when the key is unset, which is the normal first run.
  failed_when: false
  when: claude_workspace_mirror_ready | bool

- name: Allow the session user to read the root-owned mirror
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ claude_user }} --
      git config --global --add safe.directory {{ claude_workspace_mirror_path }}
  environment:
    HOME: "{{ claude_home }}"
  # The guard below is the idempotence, so reaching this task always writes a line.
  changed_when: true
  # `--add` APPENDS, so the command is not idempotent on its own: without the guard every
  # converge writes another duplicate line into the session user's ~/.gitconfig, forever.
  when:
    - claude_workspace_mirror_ready | bool
    - claude_workspace_mirror_path not in (claude_workspace_mirror_safe_existing.stdout | default(''))

# SEEDED, NEVER UPDATED, for the same reason as the public clones above: a re-run that
# fast-forwarded this would move the branch under a session mid-task.
#
# `origin` is the LOCAL MIRROR, not GitHub. That is deliberate and it is the design: a
# session in this clone can commit and cannot push anywhere, which is the arrangement
# claude-247.md already describes — 247 writes a branch, the Mac bundles and pushes it. It is
# also why no credential helper is set here: the session user has nothing to authenticate to.
#
# ⚠ ONE MORE STEP AFTER THIS, AND NO PLAY CAN DO IT. Claude Code refuses to work in a
# directory nobody has trusted, and the trust dialog is interactive. PET-481 confirmed the
# sequence on the machine: ssh claude@<host>, `cd ~/work/petedio/workspace && claude`, accept
# the dialog, `/exit`. Until then a session started here waits at the prompt while systemd
# reports the unit active — the same failure PET-431 documents for the Remote Control consent.
- name: Clone the workspace repo from the mirror, as the session user
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ claude_user }} --
      git clone {{ claude_workspace_mirror_path }}
      {{ claude_workspace }}/{{ claude_workspace_mirror_dest }}
    creates: "{{ claude_workspace }}/{{ claude_workspace_mirror_dest }}/.git"
  environment:
    HOME: "{{ claude_home }}"
  when: claude_workspace_mirror_ready | bool
