---
# claude-code role defaults (PET-396). This host's whole job is to run Claude Code with
# Remote Control on, so a session is drivable from claude.ai/code or the Claude app while
# the process itself stays on hardware that does not close its lid.

# Claude Code runs as a dedicated NON-ROOT user. That is a hard requirement here, not
# hygiene: on Linux, Claude Code REFUSES to start in bypassPermissions mode as root or
# under sudo, and the work loop's `claude -p` runs in exactly that mode
# (scripts/claude-loop-tick.sh). Running it as root would fail at startup, not degrade quietly.
claude_user: claude
claude_home: "/home/{{ claude_user }}"

# Timezone for the session user — feeds ~/.claude/settings.json `env.TZ` so timestamps in
# a session match the lab rather than UTC.
claude_timezone: America/Chicago

# --- The workspace ------------------------------------------------------------------
# MIRRORS the petedio-workspace layout: a workspace root with the child repos cloned into
# the SAME gitignored nested paths the parent repo uses, so an IaC issue is worked in
# {{ claude_workspace }}/iac and a Co-latro issue in co-latro/backend|frontend. The layout
# is carried over from the retired agent-loop role (PET-130), which proved it; nothing
# else is inherited from that role, which the fleet teardown left as dead code.
claude_workspace: "{{ claude_home }}/work/petedio"
claude_github_base: https://github.com/PeteDio-Labs

# Public child repos — cloned over HTTPS with no token. `dest` is RELATIVE to
# claude_workspace. A PRIVATE repo needs a credential, which this list deliberately cannot
# carry: an HTTPS clone of one would need a token in the URL or a `gh auth login` this host
# forbids. petedio-workspace is delivered by the mirror below instead (PET-480), and any
# other private repo needs the same treatment or none.
claude_repos:
  - { name: petedio-iac, dest: iac }
  - { name: petedio-media-iac, dest: media-iac }
  - { name: co-latro-backend, dest: co-latro/backend }
  - { name: co-latro-frontend, dest: co-latro/frontend }

# --- The private workspace repo (PET-480, re-routed by PET-493) -------------------------
# petedio-workspace is private, so no HTTPS clone reaches it without a credential. PET-480
# chose a read-only deploy key on 2026-09-17, as an explicit override of the rule in
# vault/Claude/claude-247.md that keeps every credential off this host.
#
# ⚠ THAT ROUTE CANNOT WORK, AND THE REASON IS ORGANIZATION POLICY, NOT THIS ROLE:
#
#     gh api orgs/PeteDio-Labs --jq .deploy_keys_enabled_for_repositories   # false
#
# PeteDio-Labs disallows deploy keys for every repository it owns, and the repository's own
# key page reads "Disabled by PeteDio-Labs". PET-481 ran the old flow to completion and
# generated a key on 247 that GitHub would never have accepted. PET-493 replaced the key with
# a GitHub App installed on this ONE repository, Contents and Metadata read-only. Root mints
# a one-hour installation token per fetch through claude-workspace-mirror-broker and hands it
# to git over a pipe, so no token is written to disk, to a config, or to a command line.
#
# ⚠ THE OVERRIDE IS STILL NARROW, AND THE SHAPE IS WHAT MAKES IT SO. Read
# tasks/workspace-mirror.yml before changing anything here. The App key is 0400 root:root and
# is used only by a root timer fetching into a bare mirror under /var/lib. The session user
# gets a working clone of that mirror and no credential at all. Do not "simplify" this by
# pointing the session's clone at GitHub with the helper: root would then run git inside a
# directory the sessions own, which is code execution as root.
#
# The narrowness is a property of the App, not of this file. It holds while the App keeps
# read-only permissions and one installed repository, and stops holding the moment either
# changes — in the GitHub UI, where nothing in this repo would notice.
#
# DEFAULT FALSE, like every other delivery in this role. `true` belongs in host_vars, next to
# claude_remote_enable.
claude_workspace_mirror_enable: false

claude_workspace_mirror_repo: PeteDio-Labs/petedio-workspace

# HTTPS, not ssh: the App authenticates over the git credential protocol, and there is no key
# for ssh to offer. It was git@github.com until PET-493.
claude_workspace_mirror_url: "https://github.com/{{ claude_workspace_mirror_repo }}.git"

# Where the session's working clone lands, RELATIVE to claude_workspace. Must match the
# `dir` of the claude_remote_sessions entry that serves it, or the entry stays unservable.
claude_workspace_mirror_dest: workspace

# Root-owned, 0400. Sessions run as {{ claude_user }} with no sudo, so this is unreadable to
# them — the same arrangement claude_loop_conf_dir uses for the loop's GitHub App key.
claude_workspace_mirror_conf_dir: /etc/claude-workspace-mirror

# 0500 root:root. The only path to the App key, and the git credential helper every fetch
# authenticates through. Read its header before changing any of the three settings below.
claude_workspace_mirror_broker: /usr/local/sbin/claude-workspace-mirror-broker

# ⚠ THE DEPLOY KEY PET-480 GENERATED, KEPT ONLY SO THE PLAY CAN DECLARE IT ABSENT. Nothing
# creates this any more. It exists on 247 from PET-481's run 1, and a file nobody deletes by
# hand is a file that stays; tasks/workspace-mirror.yml removes both halves on every converge.
# Delete this variable once no host has run the old flow.
claude_workspace_mirror_key: "{{ claude_workspace_mirror_conf_dir }}/deploy-key"

# The git options EVERY fetch of this mirror carries — the probe, the clone and the systemd
# unit alike. Three settings, and each one is load-bearing:
#
#   · The empty `credential.helper` FIRST resets the helper list. The key is multi-valued, so
#     a later `-c credential.helper=<x>` appends rather than replaces. Measured on git 2.50.1:
#     without the reset, a machine that already had a stored credential answered first and the
#     broker was never run — which silently disables the host and path checks inside it.
#   · The helper is an ABSOLUTE path, so git runs it directly instead of prefixing
#     `git-credential-`, appending `get`, `store` or `erase` as its one argument.
#   · useHttpPath makes git send the repository path to the helper. The broker refuses any
#     path but this repository's, so the helper cannot be turned on a second one.
claude_workspace_mirror_git_opts: >-
  -c credential.helper=
  -c credential.useHttpPath=true
  -c credential.helper={{ claude_workspace_mirror_broker }}

# The bare mirror root fetches into, and the only path root runs git in.
claude_workspace_mirror_state_dir: /var/lib/claude-workspace-mirror
claude_workspace_mirror_path: "{{ claude_workspace_mirror_state_dir }}/petedio-workspace.git"

# Offset from claude_loop_oncalendar's `*:0/30`, so the two timers never fetch in the same
# minute.
claude_workspace_mirror_oncalendar: "*:15/30"

# --- Mirror identity (resolved from Vault by scripts/deploy-claude-247.sh) ---------------
# NEVER give these a default, for the reason written over the loop's identity below: a
# committed placeholder would land on the host as a 0400 file that looks provisioned and fail
# at the first fetch, in a timer nobody is watching.
#
# Vault kv/services/claude-workspace-mirror — fields app_id, installation_id, app_pem.
#
#   claude_workspace_mirror_app_id
#   claude_workspace_mirror_installation_id
#   claude_workspace_mirror_app_pem

# --- The vault (PET-498) ----------------------------------------------------------------
# petedio-vault is private, and a session on this host has to CLONE it and PUSH to its
# `main`. Pedro approved the direct push explicitly. Vault `main` carries no branch
# protection, and the Obsidian Git plugin already auto-pushes to it every 10 minutes from the
# Mac, so a session committing a note joins a branch that already has a second writer.
#
# ⚠ THIS IS THE FIRST CREDENTIAL ON 247 THE SESSION USER CAN READ, AND THE SHAPE IS INVERTED
# FROM THE WORKSPACE MIRROR ABOVE ON PURPOSE. The mirror keeps its App key 0400 root behind a
# 0500 root broker because ROOT fetches into a bare mirror and the session only clones from a
# local path. That does not transfer here: the SESSION pushes, so the session has to reach the
# credential. The key and the broker live under the session user's own home, owned
# claude:claude, 0400 on the files and 0700 on the directory.
#
# ⚠ SO EVERY PROCESS RUNNING AS `claude` CAN PUSH TO THE VAULT — every Remote Control session,
# and the work loop's `claude -p` too if claude_loop_enable is ever set. The modes keep other
# users out. They cannot keep this user out, because this user is the one the design hands the
# credential to. Read that as the price of the feature, not as a gap to close with a mode.
#
# WHAT KEEPS THE BLAST RADIUS NARROW IS THE APP, NOT THE FILE MODES: one installed
# repository, contents:write and metadata:read and nothing else. It cannot open a pull
# request, cannot read a second repository, and cannot act as Pedro. That holds while both
# halves hold, and either one changes in the GitHub UI, where nothing in this repo notices.
#
# ⚠ NOT THE LOOP'S APP AND NOT THE MIRROR'S. Three Apps, three Vault paths, three
# directories, three brokers. The loop's pushes to petedio-iac and opens PRs, the mirror's is
# read-only, and this one reaches petedio-vault alone. Pointing any of them at another's
# credentials widens all three.
#
# DEFAULT FALSE, like every other delivery in this role. `true` belongs in host_vars, next to
# claude_remote_enable.
claude_vault_enable: false

claude_vault_repo: PeteDio-Labs/petedio-vault

# HTTPS, not ssh: the App authenticates over the git credential protocol, and there is no key
# for ssh to offer. Same reason as the mirror's URL above.
claude_vault_url: "https://github.com/{{ claude_vault_repo }}.git"

# Where the session's clone lands, RELATIVE to claude_workspace. Must match the `dir` of the
# claude_remote_sessions entry that serves it, or the entry stays unservable. `vault` is the
# path petedio-workspace gitignores the vault at, so the layout matches the Mac.
claude_vault_dest: vault

# Owned by the session user, 0700 on the directory and 0400 on the two files in it. Read the
# warning above before you "fix" that to root: a root-owned key here leaves the session unable
# to push, which is the one thing this delivery exists to do.
claude_vault_conf_dir: "{{ claude_home }}/.config/claude-vault"

# 0500 claude:claude, under the session user's own bin directory. The only thing that reads
# the App key, and the git credential helper every push authenticates through. Read its header
# before changing any of the three settings below.
claude_vault_broker: "{{ claude_home }}/.local/bin/claude-vault-broker"

# The git options every vault command carries — the probe and the clone alike. Three settings,
# and each one is load-bearing, for the reasons the mirror measured:
#
#   · The empty `credential.helper` FIRST resets the helper list. The key is multi-valued, so
#     a later `-c credential.helper=<x>` appends rather than replaces. Measured on git 2.50.1:
#     without the reset, a machine that already had a stored credential answered first and the
#     broker was never run — which silently disables the host and path checks inside it.
#   · The helper is an ABSOLUTE path, so git runs it directly instead of prefixing
#     `git-credential-`, appending `get`, `store` or `erase` as its one argument.
#   · useHttpPath makes git send the repository path to the helper. The broker refuses any
#     path but this repository's, so the helper cannot be turned on a second one.
#
# tasks/vault.yml writes the same three settings into the clone's own config, because a
# session pushes with a plain `git push` and carries no flags of its own.
claude_vault_git_opts: >-
  -c credential.helper=
  -c credential.useHttpPath=true
  -c credential.helper={{ claude_vault_broker }}

# --- Vault identity (resolved from Vault by scripts/deploy-claude-247.sh) -----------------
# NEVER give these a default, for the reason written over the loop's identity below: a
# committed placeholder would land on the host as a 0400 file that looks provisioned and fail
# at the first push, inside a session that reports the failure to nobody.
#
# Vault kv/services/claude-vault-push — fields app_id, installation_id, app_pem.
#
#   claude_vault_app_id
#   claude_vault_installation_id
#   claude_vault_app_pem

# --- Code push (PET-507) ------------------------------------------------------------------
# A session on this host pushes branches to three code repositories and opens pull requests
# on them, as the Mac does. Pedro chose this on 2026-09-24. It reverses the line PET-498 held,
# that no session on 247 holds a code credential.
#
# THE PET-498 SHAPE, WIDENED FROM ONE REPOSITORY TO THREE. The key, the identity file and the
# broker belong to the session user, for the reason the vault block above gives: the session
# is what pushes, so the session has to reach the credential. Every process running as
# `claude` can therefore push to these three repositories and open pull requests on them, the
# work loop's `claude -p` included if claude_loop_enable is ever set. Read
# vault/Systems/claude-loop.md before that flag moves.
#
# WHAT BOUNDS IT IS THE APP AND BRANCH PROTECTION, NOT THE FILE MODES:
#
#   · The App is installed on these three repositories alone, with contents:write,
#     pull_requests:write and metadata:read. scripts/seed-claude-code-app.sh refuses to seed
#     it otherwise.
#   · It holds no `workflows` permission, so GitHub refuses any push that touches
#     .github/workflows/**. That keeps the PET-425 property.
#   · `main` on each repository requires a review the App cannot give, so Pedro still decides
#     every merge.
#
# ⚠ THE FOURTH APP, AND IT MUST NOT BECOME ANY OF THE OTHER THREE. The loop's App reaches
# petedio-iac from a root-owned directory, the mirror's is read-only and read by root, and the
# vault's reaches petedio-vault alone. scripts/deploy-claude-247.sh refuses every pairing by
# App id.
#
# DEFAULT FALSE, like every other delivery in this role. `true` belongs in host_vars.
claude_code_push_enable: false

claude_code_push_org: PeteDio-Labs

# The repositories the App is installed on, and the only ones the broker answers for. `dest`
# is the session's clone, RELATIVE to claude_workspace. `mirrored: true` marks the clone whose
# origin is the local workspace mirror rather than GitHub: its fetch URL stays the mirror, and
# the play gives it a GitHub push URL.
#
# ⚠ Adding a repository here does nothing on its own. The App's installation must list it
# too, and scripts/seed-claude-code-app.sh must accept the wider set.
claude_code_push_repos:
  - { name: petedio-iac, dest: iac, mirrored: false }
  - { name: petedio-media-iac, dest: media-iac, mirrored: false }
  - { name: petedio-workspace, dest: "{{ claude_workspace_mirror_dest }}", mirrored: true }

# 0700 claude:claude on the directory, 0400 on the two files in it. Read the vault block above
# before you "fix" that to root.
claude_code_push_conf_dir: "{{ claude_home }}/.config/claude-code-push"

# 0500 claude:claude. The only thing that reads the App key, and the git credential helper
# every push from the three clones authenticates through.
claude_code_push_broker: "{{ claude_home }}/.local/bin/claude-code-push-broker"

# 0500 claude:claude. Runs gh with GH_TOKEN set from the broker, for one command. No
# `gh auth login`, and no token in ~/.config/gh/hosts.yml.
#
# ⚠ ~/.local/bin IS NOT ON THE REMOTE CONTROL UNITS' PATH, and this delivery leaves the units
# alone: a unit change restarts the servers and ends every live session. A session calls the
# wrapper by its full path.
claude_code_push_gh: "{{ claude_home }}/.local/bin/claude-gh"

# The git options the play's own probes carry, for the reasons claude_vault_git_opts gives.
# tasks/code-push.yml writes the same settings into each clone's config.
claude_code_push_git_opts: >-
  -c credential.helper=
  -c credential.useHttpPath=true
  -c credential.helper={{ claude_code_push_broker }}

# --- Code push identity (resolved from Vault by scripts/deploy-claude-247.sh) --------------
# NEVER give these a default, for the reason written over the vault identity above.
#
# Vault kv/services/claude-code-push — fields app_id, installation_id, app_pem.
#
#   claude_code_push_app_id
#   claude_code_push_installation_id
#   claude_code_push_app_pem

# --- Toolchain ------------------------------------------------------------------------
# Node.js LTS major (NodeSource). 22 = active LTS ("jod").
claude_nodejs_major: 22

# Per-user npm global prefix. Claude Code installs here AS the session user, NOT into the
# root-owned /usr prefix, so its auto-update (`npm i -g`) succeeds instead of failing with
# "Auto-update failed: no write permission to npm prefix". Learned the hard way on the
# agent-loop host (PET-139) — the same mistake is available to anyone who installs this
# with `become: true` and a system prefix.
claude_npm_prefix: "{{ claude_home }}/.npm-global"
claude_npm_package: "@anthropic-ai/claude-code"

# Operator SSH public keys authorized to log in directly as the session user, so you can
# `ssh claude@192.168.50.247` and run the one-time login without hopping through root.
# Public keys only (safe to commit). Append to add more operators.
claude_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEgSIpFv6ipc5B3CATvK1CIqul0hG6MSUT0cR5TqhAX4 pedro@type-shit"

# --- Remote Control -------------------------------------------------------------------
# The permission mode the served sessions START in: `auto`, since PET-433. Claude Code
# approves routine actions itself and asks only for risky ones, and Remote Control carries
# that question to the Claude app. Work driven from a phone keeps moving — the reason
# PET-396 chose `bypassPermissions` — without blanket approval of everything.
#
# ⚠ THE MODE DECIDES WHETHER SESSIONS CAN MESSAGE EACH OTHER (PET-431, PET-433). With
# `crossSessionInbound` unset, Claude Code delivers a SendMessage only between sessions of
# the same permission-mode class, bypass↔bypass or prompting↔prompting, and holds any other
# for approval while the sender still sees `success`. Under `bypassPermissions`, every
# message between a 247 session and the prompting Mac session was held. `auto` prompts.
#
# What this does not change: the work loop passes its own
# `--permission-mode bypassPermissions` (scripts/claude-loop-tick.sh), and the seeded
# settings.json is never rewritten (`force: false`), so a `claude` started by hand keeps
# that file's `defaultMode`.
#
# Know what the host exposes whatever the mode. This container is NOT isolated from the
# lab — it sits on the LAN with Vault, Proxmox and Postgres. The role provisions no outbound
# credential for the sessions (the only key it places is a PUBLIC key, authorizing inbound
# SSH), so a session reaches what the LAN serves unauthenticated plus whatever an operator
# adds by hand.
#
# Deny rules apply in every mode — but they live in a settings.json this same user owns and
# can rewrite. roles/claude-code/README.md says where to put rules that have to hold. For
# stricter prompting set `default` (Manual) or `acceptEdits`. Any change is one variable, a
# play re-run, and `systemctl restart claude-remote-iac`: the handler never restarts a
# running server, so it keeps the old mode until you do.
claude_permission_mode: auto

# One `claude remote-control` server per project directory. Each entry renders its own
# systemd unit, so `systemctl status claude-remote-iac` names the project it serves and a
# crash in one does not take the others with it.
#   name   instance name — the unit suffix AND the session-name prefix shown at
#          claude.ai/code, which is how you tell two servers apart on a phone
#   dir    project directory, RELATIVE to claude_workspace
#   spawn  how the server creates sessions: `worktree` gives each on-demand session its own
#          git worktree (requires a git repo — every entry here is one), `same-dir` shares
#          the directory and lets concurrent sessions collide, `session` serves exactly one
#
# An entry whose directory is missing gets NO UNIT, and every other entry converges anyway
# (PET-466). configure-claude-code.yml then fails at the end naming the clone step, so the
# run is red without being stuck. Before PET-466 the check was an assert in the middle of
# the role, and one such entry stopped the play before ANY unit was rendered.
#
# The `workspace` entry below serves the PRIVATE petedio-workspace repo. Set
# claude_workspace_mirror_enable and the mirror delivers the clone; until then the entry is
# inert and the run is red at the end naming the step.
#
# ⚠ DO NOT CLEAR THAT BY RUNNING `gh auth login` ON 247. This comment said to, until
# PET-480. `vault/Claude/claude-247.md` forbids it by name: the login leaves an OAuth
# token carrying PEDRO's permissions in ~/.config/gh/hosts.yml, readable by any session on
# the host whatever its mode — a stronger credential than the one the loop design works to
# keep off that box. A red run is cheaper than that, and the mirror above is cheaper still.
#
# ⚠ THAT SESSION IS NOT A CROSS-REPO SESSION. petedio-workspace gitignores every child repo
# (`iac/`, `media-iac/`, `vault/`, `co-latro/backend/` …) and tracks none of them, so a
# `spawn: worktree` checkout of it holds .agent, .claude, .github, PET-LOG.md, co-latro's
# umbrella docs, repair-eval and scripts — and no repo to work in. It is the right session
# for `scripts/pet-log`, the skills and the lessons files; it is not the one for an IaC
# change, which belongs in the `iac` entry above. Its `dir: workspace` also nests a second
# workspace root inside {{ claude_workspace }}, which already mirrors that layout.
# ⚠ THE `vault` ENTRY IS `same-dir`, AND THE THREE OTHERS ARE NOT (PET-498). A vault session
# commits to `main` and pushes it, so it has to work in the clone itself, on `main`. A git
# worktree cannot check out a branch another worktree already holds — measured on git 2.50.1:
#
#     git worktree add ../wt main
#     fatal: 'main' is already used by worktree at '…'
#
# So `spawn: worktree` would hand every vault session a side branch, and a note written there
# reaches `main` only by a push nobody asked for. `same-dir` shares one working tree, which is
# the collision the comment above warns about: two concurrent vault sessions fight over one
# index. That is the accepted trade, because the vault has a second writer already — Obsidian
# Git auto-pushes from the Mac every 10 minutes — and one tree on `main` is what both the push
# and the rebase pull below are built for. For stricter serialization, `session` serves
# exactly one session and gives up on-demand spawning.
claude_remote_sessions:
  - { name: iac, dir: iac, spawn: worktree }
  - { name: workspace, dir: workspace, spawn: worktree }
  - { name: vault, dir: vault, spawn: same-dir }

# Whether the units are enabled and started. DEFAULT FALSE, so a host that has never been
# bootstrapped gets stopped units rather than a server with no login behind it.
#
# ⚠ `false` STOPS AND DISABLES THE UNITS, RUNNING OR NOT. A host that serves Remote Control
# must declare `true` in its host_vars, never pass it with `-e`: the next run without the
# flag stops the server. That is how a loop deploy took claude-247's server down on
# 2026-09-12 (PET-431). inventory/host_vars/claude-247.yml declares it.
#
# `true` starts nothing until the operator has signed in and answered the one-time consent
# (roles/claude-code/README.md). The role checks for the consent first, because a unit
# started without it waits at the prompt forever while systemd reports it active.
#
# ⚠ If you override it on the command line anyway, use `=true` / `=false` and NOTHING ELSE,
# and note that the task reading it has to say `| bool`: `-e` hands Jinja a STRING, and the
# string "false" is truthy.
claude_remote_enable: false

# --- The IaC toolchain (PET-508) --------------------------------------------------------
# terraform, ansible-core, ansible-lint and shellcheck, so a session here can verify the IaC
# it writes instead of handing it to the Mac. tasks/iac-tools.yml installs them root-owned
# under claude_iac_tools_dir and links them into /usr/local/bin.
#
# DEFAULT FALSE, like every other delivery in this role. `true` belongs in host_vars.
# `false` installs nothing and removes nothing: a tool left on disk grants no access.
#
# Not `vault`: a CLI without a token verifies nothing, and a token here is PET-509's question.
# Not `sudo`: its absence is part of this host's permission model.
claude_iac_tools_enable: false

claude_iac_tools_dir: /opt/claude-iac-tools

# ⚠ THESE PINS COPY THE CI WORKFLOWS, AND tests/claude-iac-tools-pins.yml FAILS CI WHEN THEY
# DIFFER. terraform comes from .github/workflows/terraform.yml, and the ansible pair from the
# `pip install` line in .github/workflows/ansible-validate.yml. Bump them in the same PR.
# A pin that matches CI is not a verdict that matches CI: collections and Python can still
# differ, so compare a lint run here with CI's own `Passed:` line for the same commit.
claude_terraform_version: "1.16.3"
# The linux_amd64 row of
# https://releases.hashicorp.com/terraform/<version>/terraform_<version>_SHA256SUMS.
# Change it together with the version.
claude_terraform_sha256: 093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8
claude_ansible_core_version: "2.20.4"
claude_ansible_lint_version: "26.4.0"

# CI pins no shellcheck, so this pins the Debian trixie package. Read the candidate with
# `apt-cache policy shellcheck` on the host before you change it.
claude_shellcheck_version: "0.10.0-1"

# --- The read-only Proxmox token (PET-510) ------------------------------------------------
# claude-247@pve!audit, PVEAuditor on / with privilege separation, so a session here reads the
# cluster's state through the API instead of asking the Mac. tasks/pve.yml lands it, and
# templates/claude-pve-get.j2 is the only client this role installs.
#
# DEFAULT FALSE, like every other delivery in this role. `true` belongs in host_vars.
# `false` removes nothing: revoke the token on pve02 with `pveum user token remove`, because a
# deleted file on this host revokes nothing.
claude_pve_audit_enable: false

# 0700 claude:claude on the directory, 0400 on token.env and 0444 on ca.pem.
claude_pve_conf_dir: "{{ claude_home }}/.config/claude-pve"

# 0500 claude:claude. GET only, and pinned to ca.pem. Not on the units' PATH, like claude-gh.
claude_pve_get: "{{ claude_home }}/.local/bin/pve-get"

# --- Proxmox token identity (resolved from Vault by scripts/deploy-claude-247.sh) ----------
# NEVER give these a default, for the reason written over the vault identity above.
#
# Vault kv/services/claude-247-pve — fields token_id, secret, endpoint, ca_pem. Written once by
# playbooks/mint-claude-247-pve.yml.
#
#   claude_pve_token_id
#   claude_pve_token_secret
#   claude_pve_endpoint
#   claude_pve_ca_pem

# --- The ticket-driven work loop (PET-399) ---------------------------------------------
# A systemd timer picks up ONE Plane work item carrying a label, runs `claude -p` against
# it, and opens a DRAFT pull request. It revives the shape of the agent fleet retired in
# PET-265, deliberately and with the two things that killed it fixed: the bot identity is
# structurally unable to merge (branch protection, PET-399 step 0), and every PR closes
# with a table diffing what the item asked for against what shipped.
#
# Read docs/runbooks/claude-loop.md before turning this on.

# Whether the timer is enabled and running. DEFAULT FALSE, like claude_remote_enable, and
# for a stronger reason: this one opens pull requests.
#
# ⚠ Override with `=true` / `=false` and NOTHING ELSE, and note that the task reading it
# says `| bool` on BOTH lines. `-e claude_loop_enable=false` hands Jinja the STRING
# "false", which is truthy — a bare `if claude_loop_enable` turns the loop ON by way of the
# documented way to turn it off. That exact bug shipped in PET-396.
claude_loop_enable: false

# How often a tick fires. Most ticks find no work and cost one Plane query.
#
# ⚠ KEEP claude_loop_max_age_sec IN STEP WITH THIS. It is the staleness threshold
# lab-verify.sh uses to tell "the timer is enabled but has not run" from "it ran and found
# nothing", and it is written INTO the heartbeat so that check never has to parse an
# OnCalendar expression. Two ticks plus the randomized delay is the rule: 30 min → 3900 s.
claude_loop_oncalendar: "*:0/30"
claude_loop_max_age_sec: 3900

# The Plane label that means "a loop tick may take this". The project had no labels at all
# when this was written, so creating it is a step, not a lookup — see the runbook.
claude_loop_label: agent-ready

# Where the loop keeps its pause sentinel and its per-tick run dir. NOT in the workspace: a
# session working in {{ claude_workspace }}/iac must not be one `rm -rf` away from the loop's
# own files. The claim records, the lock, the prompt and the heartbeat are NOT here — they
# moved to root-owned locations (PET-441) so the session cannot forge a claim or drop the
# lock. The three vars below name those locations.
claude_loop_home: "{{ claude_home }}/loop"

# Root-owned loop state (PET-441): claim records under items/, the flock, the heartbeat and
# the tick's scratch files. The session reads this dir (0755) but cannot write it.
claude_loop_state_dir: /var/lib/claude-loop

# The tick's prompt, rendered by root into the per-tick dir. Root-owned so the session cannot
# rewrite the instructions root feeds the next `claude -p`.
claude_loop_prompt: /usr/local/share/claude-loop/prompt.md

# The tick script itself, installed as a root-owned system binary off the loop user's home so
# systemd's ExecStart never runs a path the session can rewrite between ticks.
claude_loop_tick_bin: /usr/local/sbin/claude-loop-tick

# Root-owned 0400 secrets, and the root-owned broker that is the only path to them. See
# templates/claude-loop-broker.j2 for why an EnvironmentFile is not enough here.
claude_loop_conf_dir: /etc/claude-loop
claude_loop_broker: /usr/local/sbin/claude-loop-broker

# The repo the loop works in, and the name of its clone under claude_loop_home. The clone
# needs no trust: `claude -p` skips the trust dialog, and the session loads no MCP server,
# on purpose (PET-487).
claude_loop_repo: PeteDio-Labs/petedio-iac
claude_loop_project_dir: iac

# Give up on an item after this many failed ticks, so one broken work item cannot burn the
# shared Max quota every half hour forever. Clearing the claim retries it — see the runbook.
claude_loop_max_attempts: 3

# Hard ceiling on one `claude -p` run. systemd kills the tick at this point and the tick
# records the item as failed, rather than a session holding the single-instance lock
# indefinitely and every later tick exiting "already running".
claude_loop_timeout_sec: 3600

# Turn ceiling on one `claude -p` run, passed as --max-turns. The flag is missing from
# `claude --help` but works (measured on 2026-09-14, Claude Code 2.1.270). Sized at about
# four times the 12 to 15 API requests each live tick made on 2026-09-12, so a normal item
# never meets it and a runaway session stops long before the wall-clock ceiling above.
# A stop exits 1 and the tick records the item as failed, naming the ceiling.
claude_loop_max_turns: 60

# The model one `claude -p` run uses, passed as --model (PET-484). An alias (`sonnet`,
# `opus`, `haiku`) follows the family to each release; a full id (`claude-sonnet-5`) pins one.
# Without --model a tick runs the account default, which moves when Anthropic ships a model,
# so the loop's cost against the shared Max quota would change with no commit to show for it.
# The tick has no fallback and refuses an empty value. To change the model, set this in
# host_vars and re-run the play — see docs/runbooks/claude-loop.md, "Change the model".
claude_loop_model: sonnet

# --- Loop identity (resolved from Vault by scripts/deploy-claude-247.sh) ---------------
# NEVER give the secret ones a default. A committed placeholder here would land on the host
# as a 0400 file that looks provisioned and fails at the first mint, and the assert in
# tasks/loop.yml exists precisely to refuse that.
#
# Vault kv/services/claude-loop — fields app_id, installation_id, app_pem.
# Vault kv/services/plane       — field  api_key (the PAT CI already uses).
claude_loop_plane_base_url: http://192.168.50.235:8080
claude_loop_plane_workspace: petedio
