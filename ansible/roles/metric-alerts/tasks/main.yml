---
# See defaults/main.yml for why this exists.

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/metric-alerts
    state: directory
    owner: root
    group: root
    mode: "0700"

# A curl config file: the bot token is the credential, and it stays out of argv when the script
# reads it. Land it only when the run carries both values, and never print it.
- name: Land the Discord bot config
  ansible.builtin.copy:
    content: |
      url = "https://discord.com/api/v10/channels/{{ metric_alerts_discord_dm_channel_id }}/messages"
      header = "Authorization: Bot {{ metric_alerts_discord_bot_token }}"
      user-agent = "DiscordBot (https://github.com/PeteDio-Labs/petedio-iac, 1)"
    dest: /etc/metric-alerts/discord.curl
    owner: root
    group: root
    mode: "0600"
  when:
    - metric_alerts_discord_bot_token | length > 0
    - metric_alerts_discord_dm_channel_id | length > 0
  no_log: true

- name: Read back whether the Discord config exists
  ansible.builtin.stat:
    path: /etc/metric-alerts/discord.curl
  register: metric_alerts_discord

- name: Land the rules
  ansible.builtin.copy:
    content: "{{ metric_alerts_rules | to_nice_json }}\n"
    dest: /etc/metric-alerts/rules.json
    owner: root
    group: root
    mode: "0644"

- name: Install the evaluator
  ansible.builtin.copy:
    src: metric-alerts.py
    dest: /usr/local/sbin/metric-alerts
    owner: root
    group: root
    mode: "0755"

- name: Install the units
  ansible.builtin.template:
    src: "metric-alerts.{{ item }}.j2"
    dest: "/etc/systemd/system/metric-alerts.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd for metric-alerts

# The timer task below needs the reloaded unit files, so run the handler now.
- name: Apply the systemd reload before enabling the timer
  ansible.builtin.meta: flush_handlers

# The timer runs only once the Discord config exists. A timer that evaluates and cannot post is a
# green unit over work that never happened.
- name: Enable the timer when the Discord config is present
  ansible.builtin.systemd:
    name: metric-alerts.timer
    enabled: true
    state: started
  when: metric_alerts_discord.stat.exists

- name: Say when the timer is not running
  ansible.builtin.debug:
    msg: >-
      /etc/metric-alerts/discord.curl is absent, so metric-alerts.timer is not enabled.
      Run scripts/seed-watchdog-discord.sh, then scripts/deploy-metrics.sh.
  when: not metric_alerts_discord.stat.exists
