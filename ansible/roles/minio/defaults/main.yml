---
# minio role defaults (PET-124) — the Terraform STATE BACKEND host (LXC 221 / .221).
#
# .221 is HAND-MANAGED by design: there is NO Terraform resource for it, ever, because
# Terraform cannot create the host that stores Terraform's own state (bootstrap
# circularity). See the rebuild runbook (docs/runbooks/minio-221-rebuild.md), the repo
# exception (environments/homelab/minio-state-backend.tf), and the MinIO ADR (PET-102).
#
# The role is idempotent and SAFE to re-run against the LIVE host: it converges the
# binaries, the systemd unit, and the state bucket's versioning. It NEVER writes object
# data, NEVER removes a bucket, and NEVER suspends versioning — a converged host reports
# zero changes and triggers no restart.

# --- MinIO server + client binaries (pinned + checksummed, lab mirror) -----------
# PET-801: dl.min.io returns 410 Gone for every community MinIO download, so the role
# fetches both binaries from a lab-held mirror: assets on a GitHub release of this repo.
# `scripts/mirror-minio-binaries.sh` publishes them. It refuses to upload a file whose
# sha256 differs from the pin below, so the mirror holds exactly the bytes the role checks.
#
# Pin BOTH the version and its sha256, bumped together (cf. PET-111). The sha256 values
# came from the official dl.min.io `.sha256sum` sidecars on 2026-06-10. The server value
# also matches the binary on LXC 221 (PET-795 step 1c, 2026-11-03). To upgrade, change the
# version and hash here, then run the mirror script with the new files in the same PR.
minio_version: "RELEASE.2025-09-07T16-13-09Z"
minio_sha256: "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f"

minio_mc_version: "RELEASE.2025-08-13T08-35-41Z"
minio_mc_sha256: "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"

# Release that holds the mirrored assets. Asset names are `minio.<version>` and
# `mc.<version>`, so a version bump adds assets and never overwrites one.
minio_mirror_base: "https://github.com/PeteDio-Labs/petedio-iac/releases/download/minio-binaries"
minio_server_url: "{{ minio_mirror_base }}/minio.{{ minio_version }}"
minio_mc_url: "{{ minio_mirror_base }}/mc.{{ minio_mc_version }}"

minio_bin: /usr/local/bin/minio
minio_mc_bin: /usr/local/bin/mc

# --- Service account / storage ---------------------------------------------------
minio_user: minio-user
minio_group: minio-user
# The single data drive for the state backend. A fresh host starts empty; the runbook
# restores the `tfstate` objects from backup BEFORE the first `terraform init`.
minio_data_dir: /var/lib/minio
minio_config_env: /etc/default/minio   # systemd EnvironmentFile (holds root creds)
minio_config_env_owner: root
minio_config_env_group: "{{ minio_group }}"
minio_config_env_mode: "0640"

# PET-811: LXC 221 predates this role. Its data lives in /data/minio, it has no
# `minio-user`, and its env file is root:root 0600 (inventory/host_vars/minio-221.yml).
# Where the host already owns an account and a data directory, set these to false so the
# role takes the names as given and creates nothing. With manage_data_dir false the role
# also asserts the directory exists, so a wrong path fails the run instead of silently
# pointing MinIO at an empty directory (an empty tfstate backend).
minio_manage_account: true
minio_manage_data_dir: true

# --- Network ---------------------------------------------------------------------
# S3 API on :9000, web console on :9001 (matches backend.tf endpoint .221:9000).
minio_server_address: ":9000"
minio_console_address: ":9001"
# Loopback endpoint mc dials to administer the server — admin stays on-box.
minio_local_endpoint: "http://127.0.0.1:9000"
minio_mc_alias: local

# --- Buckets ---------------------------------------------------------------------
# Versioning is the recovery net for the lock-light backend (docs/GOTCHAS.md →
# "MinIO S3 state backend"; backend.tf uses S3-native use_lockfile + versioning). The
# role ENABLES versioning when off; it never suspends it.
minio_state_bucket: tfstate

# The buckets THIS host owns. The role converges each one: create if absent, enable
# versioning if off, and set a hard quota if `quota_bytes` is given. It never removes a
# bucket, never suspends versioning, and never touches object data.
#
# The default is exactly .221's single `tfstate` bucket, so the state backend's converge
# is unchanged by this list existing. The app-data host (LXC 245) overrides it in
# inventory/group_vars/minio_data.yml — that is where new app buckets go, NOT here and
# NOT on .221.
#
# Per-bucket keys:
#   name        (required) bucket name
#   quota_bytes (optional) hard quota in BYTES. Deliberately bytes and not "5gi": the
#               converge compares this integer against `mc quota info --json`'s `quota`
#               field, so an exact unit-free value keeps the check idempotent instead of
#               re-setting the quota (and reporting "changed") on every run.
minio_buckets:
  - name: "{{ minio_state_bucket }}"

# systemd unit Description=. Per-host so `systemctl status minio` says which MinIO this is.
minio_service_description: "MinIO (Terraform state backend, LXC 221)"

# PET-851: the environment file and unit keep the shape of a host that predates the role.
# Defaults write the role's own shape. 221 overrides all three (inventory/host_vars/minio-221.yml).
minio_config_env_header: true          # false omits the "ANSIBLE MANAGED" comment lines
minio_opts: "--address {{ minio_server_address }} --console-address {{ minio_console_address }}"
minio_service_type: notify             # "" omits the Type= line from the unit

# --- Root credentials (REQUIRED — no default, never commit) ----------------------
# Resolve from Vault and pass as a no_log extra-var via a 0600 JSON @file — the
# configure-postgres.yml pattern (PET-106). Referenced Vault path (by name only):
#   kv/iac/minio-root   fields: root_user, root_password
# Deliberately left UNDEFINED: a committed placeholder would silently become the live
# root credential on a bare re-run. tasks/main.yml asserts both are defined first.
# minio_root_user: <from Vault kv/iac/minio-root>
# minio_root_password: <from Vault kv/iac/minio-root>

# --- Firewall (UFW) --------------------------------------------------------------
minio_firewall_enabled: true
minio_firewall_subnet: "192.168.50.0/24"

# --- Off-host backup of the state bucket (issue item 3) --------------------------
# DISABLED by default: enabling needs an off-host destination you choose (a pre-
# configured `mc` alias for another MinIO/S3, or a path on a mounted off-host share).
# When enabled the role installs an `mc mirror` script + a systemd timer. See the
# runbook for picking a target, first-run seeding, and the check cadence.
minio_backup_enabled: false
# Which bucket gets mirrored. Defaults to the state bucket (.221's only reason to back
# anything up); the app-data host would point this at one of its own buckets.
minio_backup_bucket: "{{ minio_state_bucket }}"
# The mc target the backup mirrors INTO, e.g. "offsite/tfstate-backup" (an mc alias you
# configure on the host out-of-band). No default — must be set when enabling.
minio_backup_dest: ""
minio_backup_oncalendar: "daily"       # systemd OnCalendar= for the backup timer
minio_backup_script: /usr/local/bin/minio-tfstate-backup.sh
