---
# The pools as built on 2026-09-04, replacing the NFS export that died with
# pve01. Disks are named by /dev/disk/by-id/ because USB device names shuffle
# across reboots and a pool built on /dev/sdX fails to import.
media_storage_pools:
  - name: media
    # RAIDZ1 over four SSDs: one disk of parity on the library, which is the
    # thing that is expensive to re-acquire.
    raid: raidz1
    mount: /mnt/media
    # Sonarr and Radarr write as root inside their unprivileged containers
    # (host uid 100000); Plex and Prowlarr read as uid 999 (host 100999).
    owner: "100000"
    group: "100999"
    devices:
      - ata-SATA_SSD_BF330743164401430637
      - ata-SATA_SSD_BB2A07340AF101344771
      - ata-SATA_SSD_2E8D07431A9700001353
      - ata-SATA_SSD_BF330743164401430632
    # No anime directory since PET-482. Sonarr's add dialog reuses the last root
    # folder chosen, so a second TV root sent two shows to a path the TV Shows
    # library never scanned. Anime files under tv-shows like any other series.
    dirs: [tv-shows, movies]

  - name: downloads
    # No redundancy on purpose. This holds in-flight torrents, which are
    # re-downloadable; a disk of parity here would buy nothing.
    raid: ""
    mount: /mnt/downloads
    # qbittorrent writes as uid 1000 (host 101000); the arr apps read as 100000.
    owner: "101000"
    group: "100000"
    devices:
      - ata-SATA_SSD_122207360F4900002963
    # BOTH are required. qBittorrent's save path is /downloads/completed and its
    # temp path /downloads/incomplete; a missing save path is reported in the web
    # UI as "no available space", which sends you to the disk instead of the
    # config. That cost real time on 2026-09-04.
    dirs: [completed, incomplete]

# `continue` returns EIO to a new write instead of blocking it. It does NOT stop a
# suspension: the enclosure drops on 2026-11-08 and 2026-11-13 suspended both pools
# with `continue` set. zpool-autoclear below is what brings a pool back.
media_storage_failmode: continue

# setgid on every directory: new files inherit the group, which is what lets one
# app read what another wrote. Without it, imports fail on permissions days
# later, far from the cause.
media_storage_dir_mode: "2775"

# zpool-autoclear (PET-914). The JMicron enclosure on pve02 drops off USB and returns a
# second later, and ZFS suspends every pool on it until `zpool clear`, failmode or not.
# A timer and a udev rule clear a suspended pool once every disk in it answers a read.
# Past this many clears in an hour, the script holds and tells you to reboot pve02.
media_storage_autoclear_max_per_hour: 3
# How long one run waits for the rest of a pool's disks after the first one returns.
media_storage_autoclear_wait_seconds: 45
media_storage_autoclear_interval: 1min
# node-exporter's textfile collector on pve02. metric-alerts reads the metrics from here,
# so the alert needs no credential on this host.
media_storage_autoclear_textfile_dir: /var/lib/prometheus/node-exporter
# The enclosure's USB bridge: JMicron JMS567. Its disks start the unit as they reappear.
media_storage_autoclear_usb_ids:
  - { vendor: "152d", product: "0567" }
