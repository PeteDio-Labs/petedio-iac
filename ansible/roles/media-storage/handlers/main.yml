---
- name: Reload systemd for zpool-autoclear
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload udev rules for zpool-autoclear
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Update GRUB for the enclosure quirk
  ansible.builtin.command: update-grub
  changed_when: true
