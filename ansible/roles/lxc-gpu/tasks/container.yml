---
- name: Start with no unapplied devices ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.set_fact:
    lxc_gpu_unapplied: []

- name: Read the container config, pending changes included ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.command: pct config {{ lxc_gpu_ct.vmid }}
  register: lxc_gpu_conf
  changed_when: false
  check_mode: false

- name: Read the container state ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.command: pct status {{ lxc_gpu_ct.vmid }}
  register: lxc_gpu_status
  changed_when: false
  check_mode: false

# Compare the path only. Proxmox stores the entry as "devN: <path>,mode=0666" and may
# reorder the options, so a whole-line match would rewrite a correct entry every run.
# `pct config` shows pending values, so this step only writes what nobody has set yet.
- name: Set each device entry ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.command: >-
    pct set {{ lxc_gpu_ct.vmid }} --dev{{ idx }} {{ item }},mode={{ lxc_gpu_device_mode }}
  loop: "{{ lxc_gpu_ct.devices }}"
  loop_control:
    index_var: idx
  when: >-
    (lxc_gpu_conf.stdout_lines
      | select('match', '^dev' ~ idx ~ ': ' ~ (item | regex_escape) ~ '(,|$)')
      | list | length) == 0
  changed_when: true

# ⚠ WHAT THE CONTAINER RUNS IS `--current`, NOT THE DEFAULT VIEW. A device set by an
# earlier run that could not restart stays pending, and the default view already shows
# it, so the step above writes nothing and a rerun would pass with the device never
# applied. Decide the restart from the running config instead.
- name: Read the running config ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.command: pct config {{ lxc_gpu_ct.vmid }} --current
  register: lxc_gpu_current
  changed_when: false
  check_mode: false

- name: Find devices not in the running config ({{ lxc_gpu_ct.vmid }})
  ansible.builtin.set_fact:
    lxc_gpu_unapplied: "{{ lxc_gpu_unapplied + [item] }}"
  loop: "{{ lxc_gpu_ct.devices }}"
  loop_control:
    index_var: idx
  when: >-
    (lxc_gpu_current.stdout_lines
      | select('match', '^dev' ~ idx ~ ': ' ~ (item | regex_escape) ~ '(,|$)')
      | list | length) == 0

- name: Restart the container to apply its devices ({{ lxc_gpu_ct.vmid }})
  when:
    - lxc_gpu_unapplied | length > 0
    - "'running' in lxc_gpu_status.stdout"
    - lxc_gpu_allow_restart | bool
    - not ansible_check_mode
  ansible.builtin.command: pct reboot {{ lxc_gpu_ct.vmid }}
  changed_when: true

- name: Refuse to leave a running container without its devices ({{ lxc_gpu_ct.vmid }})
  when:
    - lxc_gpu_unapplied | length > 0
    - "'running' in lxc_gpu_status.stdout"
    - not (lxc_gpu_allow_restart | bool)
  ansible.builtin.fail:
    msg: >-
      {{ lxc_gpu_ct.vmid }} is running without {{ lxc_gpu_unapplied | join(', ') }}: the
      entries are set but apply only on restart. Re-run with -e lxc_gpu_allow_restart=true,
      or run `pct reboot {{ lxc_gpu_ct.vmid }}`.
