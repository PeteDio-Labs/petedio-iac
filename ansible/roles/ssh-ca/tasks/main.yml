---
# See defaults/main.yml for why this exists.

# An entry without `state` is present, and without `create` is an account the role does not own.
# product + combine gives every entry the defaults and lets its own keys win.
- name: Split the users into present and absent
  ansible.builtin.set_fact:
    ssh_ca_present: "{{ ssh_ca_all | selectattr('state', 'eq', 'present') | list }}"
    ssh_ca_absent: "{{ ssh_ca_all | selectattr('state', 'eq', 'absent') | list }}"
  vars:
    ssh_ca_all: "{{ [{'state': 'present', 'create': false}] | product(ssh_ca_users) | map('combine') | list }}"

- name: Check every user's state is present or absent
  ansible.builtin.assert:
    that: (ssh_ca_present | length) + (ssh_ca_absent | length) == ssh_ca_users | length
    fail_msg: "ssh_ca_users holds a state other than present or absent: {{ ssh_ca_users }}"

- name: Read the CA public key from Vault
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/{{ ssh_ca_vault_mount }}/public_key"
    ca_path: "{{ ssh_ca_vault_ca_cert }}"
    return_content: true
    status_code: 200
  register: ssh_ca_public_key
  delegate_to: localhost
  become: false
  run_once: true

# A sealed Vault answers 503 and fails the task above. An empty or HTML body must fail too, or
# every host would trust nothing and the play would still read as a success.
- name: Check the CA public key is one SSH key
  ansible.builtin.assert:
    that:
      - ssh_ca_public_key.content | trim is match('^ssh-ed25519 [A-Za-z0-9+/=]+( [^ ]+)?$')
    fail_msg: "Vault returned no usable CA key: {{ ssh_ca_public_key.content | truncate(120) }}"
  run_once: true

- name: Land the CA public key on the host
  ansible.builtin.copy:
    content: "{{ ssh_ca_public_key.content | trim }}\n"
    dest: "{{ ssh_ca_trusted_keys_path }}"
    owner: root
    group: root
    mode: "0644"

# Revocation first, before any account check can stop the host: every principals file for a
# user that is not present in ssh_ca_users goes, whether its entry says `state: absent`, was
# deleted, or was dropped by a host_vars override. The list on this host is the whole truth.
# Only regular, non-hidden files with a user-name shape count, and names compare by basename,
# so a trailing slash in ssh_ca_principals_dir cannot turn a kept file into a removed one.
- name: Create the principals directory
  ansible.builtin.file:
    path: "{{ ssh_ca_principals_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: List the principals files on the host
  ansible.builtin.find:
    paths: "{{ ssh_ca_principals_dir }}"
    file_type: file
    hidden: false
    use_regex: true
    patterns: ['^[a-z_][a-z0-9_-]*$']
  register: ssh_ca_principal_files

- name: Remove every principals file for a user that is not present
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_ca_principal_files.files
            | rejectattr('path', 'search', '/(' ~ (ssh_ca_present | map(attribute='name') | map('regex_escape') | join('|')) ~ ')$')
            | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

# The role owns an account it created, and marks it in the GECOS field. A `create: true` entry
# that names an account someone else made, such as a real person's, fails the host instead of
# rewriting that account's shell and password, or deleting its home on `state: absent`.
- name: Read the accounts the role would create or remove
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
    fail_key: false
  loop: "{{ ssh_ca_all_created }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_ca_accounts
  vars:
    ssh_ca_all_created: "{{ (ssh_ca_present + ssh_ca_absent) | selectattr('create') | list }}"

- name: Refuse a present account the role did not create
  ansible.builtin.assert:
    that: >-
      item.ansible_facts.getent_passwd[item.item.name] is none
      or item.ansible_facts.getent_passwd[item.item.name][3] == ssh_ca_account_marker
    fail_msg: >-
      {{ inventory_hostname }}: {{ item.item.name }} exists and was not made by roles/ssh-ca
      (GECOS is not "{{ ssh_ca_account_marker }}"). Remove `create: true` from its entry.
  loop: "{{ ssh_ca_accounts.results | selectattr('item.state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create the role users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ ssh_ca_account_marker }}"
    shell: /bin/bash
    create_home: true
    # "*": no password works, and the account is not locked. sshd refuses a "!" (locked) account
    # when UsePAM is no, which would refuse its certificates too.
    password: "*"
    system: false
  loop: "{{ ssh_ca_present | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Land each present user's principals file
  ansible.builtin.copy:
    content: "{{ item.principals | join('\n') }}\n"
    dest: "{{ ssh_ca_principals_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ssh_ca_present }}"
  loop_control:
    label: "{{ item.name }}: {{ item.principals | join(',') }}"

# The principals file is already gone, so the account accepts no certificate either way. Only an
# account carrying the marker is removed; any other is left, and the next task says so.
- name: Remove each absent user the role created
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    state: absent
    remove: true
  loop: "{{ ssh_ca_accounts.results | selectattr('item.state', 'eq', 'absent')
            | selectattr('ansible_facts.getent_passwd', 'defined')
            | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.ansible_facts.getent_passwd[item.item.name] is not none
    - item.ansible_facts.getent_passwd[item.item.name][3] == ssh_ca_account_marker

- name: Warn about an absent account the role did not create
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ item.item.name }} is absent in ssh_ca_users but was not made by
      roles/ssh-ca, so the account stays. Its principals file is removed.
  loop: "{{ ssh_ca_accounts.results | selectattr('item.state', 'eq', 'absent') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.ansible_facts.getent_passwd[item.item.name] is not none
    - item.ansible_facts.getent_passwd[item.item.name][3] != ssh_ca_account_marker

- name: Read back each present user's principals file
  ansible.builtin.stat:
    path: "{{ ssh_ca_principals_dir }}/{{ item.name }}"
  loop: "{{ ssh_ca_present }}"
  loop_control:
    label: "{{ item.name }}"
  register: ssh_ca_present_files

- name: Assert every present user still has its principals file
  ansible.builtin.assert:
    that: ssh_ca_present_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: missing principals files for
      {{ ssh_ca_present_files.results | rejectattr('stat.exists') | map(attribute='item.name') | join(', ') }}.

# The drop-in goes live only with a config sshd accepts. A bad file left in place would stop the
# next sshd start, including the one after the nightly `mode: stop` backup.
- name: Land the sshd drop-in, and take it out again if sshd rejects the config
  block:
    - name: Land the sshd drop-in
      ansible.builtin.copy:
        content: |
          # Managed by petedio-iac roles/ssh-ca (PET-771).
          TrustedUserCAKeys {{ ssh_ca_trusted_keys_path }}
          AuthorizedPrincipalsFile {{ ssh_ca_principals_dir }}/%u
        dest: "{{ ssh_ca_dropin }}"
        owner: root
        group: root
        mode: "0644"

    - name: Test the sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
  rescue:
    - name: Remove the rejected drop-in
      ansible.builtin.file:
        path: "{{ ssh_ca_dropin }}"
        state: absent

    - name: Prove sshd accepts the config without it
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Fail the host
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }}: sshd -t rejected {{ ssh_ca_dropin }}; removed it, so sshd runs as before."

- name: Read the service states
  ansible.builtin.service_facts:

# Debian names the daemon ssh.service, socket-activated as ssh.socket. A host with neither runs
# an sshd this role cannot reload, so the files would be written and never loaded. Fail it.
# service_facts lists services, not sockets, so read the socket's state directly.
- name: Read whether sshd is socket-activated  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_ca_socket
  changed_when: false
  failed_when: false

- name: Find which sshd unit runs
  ansible.builtin.set_fact:
    ssh_ca_sshd_unit: >-
      {{ 'ssh.service'
         if (ansible_facts.services['ssh.service'] | default({})).state | default('') == 'running'
         else ('ssh.socket' if ssh_ca_socket.stdout | trim == 'active' else '') }}

- name: Fail a host with no sshd unit this role knows
  ansible.builtin.assert:
    that: ssh_ca_sshd_unit | length > 0
    fail_msg: "{{ inventory_hostname }}: neither ssh.service nor ssh.socket is active, so sshd cannot load the CA."

# Every run, not only on a change: a run that failed after writing the files would leave the
# next run with nothing changed and a daemon that never loaded them. A reload keeps open
# sessions. A socket-activated sshd reads the config per connection and needs none.
- name: Reload a running sshd
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
  when: ssh_ca_sshd_unit == 'ssh.service'
  changed_when: false

# The effective configuration, not the drop-in: this proves the drop-in is included and wins.
- name: Read back the effective sshd configuration
  ansible.builtin.shell: |
    set -o pipefail
    /usr/sbin/sshd -T | grep -E '^(trustedusercakeys|authorizedprincipalsfile) '
  args: { executable: /bin/bash }
  register: ssh_ca_effective
  changed_when: false

- name: Assert the CA and the principals file are the effective ones
  ansible.builtin.assert:
    that:
      - ('trustedusercakeys ' ~ ssh_ca_trusted_keys_path) in ssh_ca_effective.stdout_lines
      - ('authorizedprincipalsfile ' ~ ssh_ca_principals_dir ~ '/%u') in ssh_ca_effective.stdout_lines
    fail_msg: "{{ inventory_hostname }}: sshd -T reports {{ ssh_ca_effective.stdout_lines }}"

# This proves the files and the config sshd parses, not that the running daemon holds them: only
# a certificate login proves that (docs/runbooks/ssh-ca.md, phase 1 step 4).
- name: Report what was examined
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: CA files written and accepted by sshd -T;
      {{ 'ssh.service reloaded' if ssh_ca_sshd_unit == 'ssh.service'
         else 'ssh.socket reads the config at each connection' }};
      principals for {{ ssh_ca_present | map(attribute='name') | join(', ') }};
      removed principals files {{ ssh_ca_principal_files.files | map(attribute='path')
        | map('basename') | reject('in', ssh_ca_present | map(attribute='name') | list) | join(', ') or 'none' }}.
      Prove the daemon with a certificate login.
