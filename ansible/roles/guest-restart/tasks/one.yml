---
# Restart one guest and prove it came back. `guest` is the list entry.
- name: Read the guest's status
  ansible.builtin.command:
    argv: [pct, status, "{{ guest.vmid }}"]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_status
  changed_when: false
  failed_when: "'status: running' not in guest_restart_status.stdout"
  check_mode: false  # lab-action: read-only

- name: Count failed units and containers before
  ansible.builtin.command:
    argv: [pct, exec, "{{ guest.vmid }}", --, sh, -c, "{{ guest_restart_probe }}"]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_before
  changed_when: false
  failed_when: guest_restart_before.rc != 0 or '|notbooted' in guest_restart_before.stdout or '|docker-down' in guest_restart_before.stdout
  check_mode: false  # lab-action: read-only

# /run is a tmpfs, so a marker there survives only until the guest restarts.
- name: Leave a marker that a restart clears
  ansible.builtin.command:
    argv: [pct, exec, "{{ guest.vmid }}", --, touch, /run/guest-restart-marker]
  delegate_to: "{{ guest.node }}"
  changed_when: true
  when: not ansible_check_mode

- name: Restart the guest
  ansible.builtin.command:
    argv: [pct, reboot, "{{ guest.vmid }}"]
  delegate_to: "{{ guest.node }}"
  changed_when: true
  when: not ansible_check_mode

- name: Wait until the guest is back with the marker gone
  ansible.builtin.command:
    argv: [pct, exec, "{{ guest.vmid }}", --, test, "!", -e, /run/guest-restart-marker]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_back
  until: guest_restart_back.rc == 0
  retries: "{{ guest_restart_tries }}"
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Wait until the service answers
  ansible.builtin.command:
    argv: [curl, -fsS, -o, /dev/null, --max-time, "5", "{{ guest.check_url }}"]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_url
  until: guest_restart_url.rc == 0
  retries: "{{ guest_restart_tries }}"
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - guest.check_url | default('') | length > 0

- name: Wait until the unit is active
  ansible.builtin.command:
    argv: [pct, exec, "{{ guest.vmid }}", --, systemctl, is-active, "{{ guest.check_unit }}"]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_unit
  until: guest_restart_unit.rc == 0
  retries: "{{ guest_restart_tries }}"
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - guest.check_unit | default('') | length > 0

# systemd has finished booting, Docker answers, no container is starting or unhealthy, no unit
# failed that was not already failed before, and at least as many containers run as before.
- name: Wait until the guest is healthy
  ansible.builtin.command:
    argv: [pct, exec, "{{ guest.vmid }}", --, sh, -c, "{{ guest_restart_probe }}"]
  delegate_to: "{{ guest.node }}"
  register: guest_restart_after
  vars:
    gr_after: "{{ guest_restart_after.stdout | default('9 9 0|') }}"
    gr_before: "{{ guest_restart_before.stdout | default('0 0 0|') }}"
    gr_a_counts: "{{ (gr_after.split('|')[0].split() + ['9', '9', '0'])[:3] | map('int') | list }}"
    gr_b_counts: "{{ (gr_before.split('|')[0].split() + ['0', '0', '0'])[:3] | map('int') | list }}"
    gr_a_names: "{{ (gr_after.split('|') + [''])[1].split(',') | reject('equalto', '') | reject('in', guest_restart_ignore_units) | list }}"
    gr_b_names: "{{ (gr_before.split('|') + [''])[1].split(',') | reject('equalto', '') | list }}"
  until:
    - guest_restart_after.rc == 0
    - gr_a_counts[0] == 0
    - gr_a_counts[1] == 0
    - gr_a_counts[2] >= gr_b_counts[2]
    - gr_a_names | difference(gr_b_names) | length == 0
  retries: "{{ guest_restart_tries }}"
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Report the guest
  ansible.builtin.debug:
    msg: >-
      guest {{ guest.vmid }} on {{ guest.node }}:
      {{ 'restarted and healthy' if not ansible_check_mode else 'would restart (check mode)' }};
      before: unhealthy, starting, running | failed units = {{ guest_restart_before.stdout }}.
