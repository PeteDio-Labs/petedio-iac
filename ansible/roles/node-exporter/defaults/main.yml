---
# node-exporter (PET-708): the Prometheus host-metrics exporter on every Debian host.
#
# WHY. The PET-712 survey (claude-247, 2026-10-20) found no exporter on any of 26 hosts, so the
# lab has no CPU, memory or disk history. Disk-full on pve02 root (2026-09-14 to 09-28) was
# found by a backup check, not by a trend. The metrics host (roles/prometheus) scrapes :9100.
#
# Guests are reached through their node with `pct exec`, as the timezone and journald-cap roles
# do, because they sit in two repos' inventories and some are in neither.

node_exporter_include_guests: true

# Guests that take no exporter. 248 (codex-248) has no route to the LAN or the mesh by design,
# so the metrics host could not scrape it and the install could not reach apt.
node_exporter_skip_guests: ["248"]
