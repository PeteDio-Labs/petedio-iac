---
# mint-claude-247-pve.yml — a read-only Proxmox API token for claude-247 (PET-510).
#
#   ansible-playbook playbooks/mint-claude-247-pve.yml
#
# Run it from the Mac, in ansible/. It runs mint-pve-audit-token.yml for the client
# claude-247: the user claude-247@pve, the token claude-247@pve!audit, and the Vault entry
# kv/services/claude-247-pve. That play's header has the rest. PET-670 generalized it so
# lab-agent on 237 gets a token of its own; this name stays because claude-247's notes cite it.

- name: Mint claude-247's read-only Proxmox token
  ansible.builtin.import_playbook: mint-pve-audit-token.yml
  vars:
    pve_client: claude-247
