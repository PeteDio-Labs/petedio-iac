---
# configure-media-dash.yml — deploy mtrace on media-dash-237 as a systemd service.
#
# mtrace is the media stack's read-only control surface (PET-355, repo
# PeteDio-Labs/petedio-media-control). It answers "where is this stuck" by joining seerr
# requests to Sonarr/Radarr rows, qBittorrent infohashes and Plex rating keys.
#
# WHY A COMPILED BINARY (not Bun-from-source like water-fast/resume-builder): PET-355 chose
# Bun on the strength of `bun build --compile`, which produces one standalone file with no
# runtime to drift. This play COPIES that file; it never builds. roles/seerr in
# petedio-media-iac calls a build-from-source Node app "the single riskiest operation in
# this stack", and this deliberately does not repeat it.
#
# ⚠ HOW IT REACHES THE MEDIA STACK, AND THE COST OF THAT. mtrace does not hold the *arr API
# keys. It SSHes to each host and curls that host's own loopback, so a key is read from the
# host's config, used there, and only the RESPONSE crosses the LAN. That is a real security
# property — an *arr API key is equivalent to full control of that app — and it is also the
# only way to reach qBittorrent at all, whose WebUI is unreachable from off-box because
# Docker SNATs host-origin traffic outside its subnet allowlist.
#
# The cost is that 237 needs SSH to seven hosts. It is given a DEDICATED keypair for this,
# NOT the lab-wide `kv/iac/lxc-ssh` key: a read-only diagnostic must not carry root access
# to every container in the lab. The public half is installed below on exactly the seven
# hosts it reads, and nothing else.
#
# SECRETS (resolved by scripts/deploy-media-dash.sh, passed as no_log extra-vars):
#   media_dash_ssh_private_key  (Vault kv/services/media/dashboard, field ssh_private_key)
#   media_dash_ssh_public_key   (kv/services/media/dashboard, field ssh_public_key)
#   mtrace_caller_tokens        (kv/services/media/dashboard, one field token_<name> per
#                                caller; the legacy field api_token maps to caller
#                                "pete-bot" until scripts/mtrace-caller-token.sh revokes it)
# Run via:  ./scripts/deploy-media-dash.sh

- name: Authorise mtrace's dedicated key on the media hosts it reads
  hosts: media_read
  become: true
  gather_facts: false

  # ⚠ Scoped to ONE key on SEVEN hosts, and that is the whole play. petedio-media-iac owns
  # these containers; this group exists only to answer "who may mtrace log into", which is
  # a fact about mtrace rather than about the media stack. Keeping it declarative here beats
  # a distribution script nobody re-runs — workflow rule 6.
  tasks:
    - name: Assert the public key was provided (use scripts/deploy-media-dash.sh)
      ansible.builtin.assert:
        that:
          - media_dash_ssh_public_key is defined
          - media_dash_ssh_public_key | length > 0
        fail_msg: >-
          Missing media_dash_ssh_public_key. Run scripts/deploy-media-dash.sh, which
          resolves it from Vault (kv/services/media/dashboard).

    - name: Install mtrace's public key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ media_dash_ssh_public_key }}"
        # ⚠ SCOPE THE KEY. Without options this grants unrestricted interactive root on
        # six containers to a tool the header calls read-only. `restrict` disables port
        # and agent forwarding, pty allocation, X11 and user-rc, so the key cannot be
        # used to pivot or open a shell; `from=` means it works only when presented from
        # 237, so lifting it off that host buys nothing.
        #
        # It still permits command execution, because mtrace works by running
        # `ssh <host> curl 127.0.0.1:<port>` — that is deliberate, and it keeps each
        # *arr API key on its own host instead of centralising them. Narrowing further
        # needs a forced command wrapping that call, deployed to all six hosts, which is
        # its own change rather than a line here.
        key_options: 'restrict,from="192.168.50.237"'
        state: present
        # Never exclusive: these hosts are also reached by the ansible key and by the
        # operator, and pruning those would lock the lab out of its own media stack.
        exclusive: false

- name: Deploy mtrace on media-dash-237
  hosts: media_dash
  become: true

  vars:
    mtrace_dir: /opt/mtrace
    mtrace_bin: /opt/mtrace/mtrace
    mtrace_user: mtrace
    mtrace_group: mtrace
    mtrace_port: 8237
    # Controller path to the compiled binary. CI overrides this with the artifact it just
    # built on the runner; the operator's script points it at the local checkout.
    media_dash_binary_src: "{{ lookup('env', 'HOME') }}/petedio/media-control/dist/mtrace"

    # ⚠ THE LAN BIND, AND WHO IS ON THE OTHER END OF IT (PET-518). mtrace used to answer
    # only on 127.0.0.1; it now binds its own LAN address so pete-bot's replacement caller
    # and anything else on the allowlist can reach it directly. .4 is pete-pi-1, the
    # tailnet subnet router — `tailscale debug prefs` there shows NoSNAT=false, so a
    # tailnet client's request arrives at mtrace already SNAT'd to .4, and .4 is the one
    # address the allowlist needs to carry every tailnet caller. The nftables allowlist
    # below is what makes opening this bind safe; see mtrace.env.j2 for the rest of that
    # story.
    mtrace_bind: "192.168.50.237"
    mtrace_allow_sources: ["192.168.50.4"]

  pre_tasks:
    - name: Assert the LAN bind and allowlist are sane
      ansible.builtin.assert:
        that:
          - mtrace_bind not in ['0.0.0.0', '::', '127.0.0.1']
          - mtrace_allow_sources | length > 0
        fail_msg: >-
          mtrace_bind must be a real address, not 0.0.0.0, :: or 127.0.0.1 — this play
          pairs the LAN bind with an nftables allowlist, and a wildcard or loopback bind
          here defeats the point of both. mtrace_allow_sources must name at least one
          caller (PET-518).

    - name: Assert required secret extra-vars were provided (use scripts/deploy-media-dash.sh)
      ansible.builtin.assert:
        that:
          - media_dash_ssh_private_key is defined and media_dash_ssh_private_key | length > 0
          - mtrace_caller_tokens is defined and mtrace_caller_tokens is mapping
          - mtrace_caller_tokens | length > 0
          - mtrace_caller_tokens.keys() | reject('match', '^[a-z0-9-]+$') | list | length == 0
          - mtrace_caller_tokens.values() | select('equalto', '') | list | length == 0
          - mtrace_caller_tokens.values() | reject('match', '\\A[A-Za-z0-9_-]+\\Z') | list | length == 0
        fail_msg: >-
          Missing or malformed secret extra-vars. Run scripts/deploy-media-dash.sh, which
          resolves them from Vault (kv/services/media/dashboard) and passes them in.
          mtrace_caller_tokens must be a non-empty name -> token mapping, every name
          matching ^[a-z0-9-]+$, and every token matching \A[A-Za-z0-9_-]+\Z (no ',', ':',
          whitespace or newline — those would corrupt MEDIA_CONTROL_TOKENS's own field
          and pair separators). \A/\Z, not ^/$: Python's $ matches before a trailing
          newline too, which is exactly the byte this assert exists to catch.
      no_log: true

    # Without this the play would install a stale binary, or none, and the service would
    # keep answering with yesterday's code — which looks like a deploy that worked.
    - name: Assert the binary was compiled on the controller (bun run build)
      ansible.builtin.stat:
        path: "{{ media_dash_binary_src }}"
      delegate_to: localhost
      become: false
      register: mtrace_binary_stat

    - name: Fail when the binary is missing
      ansible.builtin.fail:
        msg: >-
          No binary at {{ media_dash_binary_src }}. Run `bun run build` in
          petedio-media-control first, or pass -e media_dash_binary_src=<path>.
      when: not mtrace_binary_stat.stat.exists

    # ⚠ 237 is an x86-64 Linux container, and `bun build --compile` targets the machine it
    # runs on. A build on the Mac yields a Mach-O arm64 file that installs cleanly, then
    # fails every start with "Exec format error" (PET-518). Bytes 0-3 are the ELF magic,
    # and bytes 18-19 are e_machine, 0x3e for x86-64.
    - name: Read the binary's ELF header
      ansible.builtin.command:
        argv: [od, -An, -tx1, -N20, "{{ media_dash_binary_src }}"]
      delegate_to: localhost
      become: false
      changed_when: false
      register: mtrace_binary_header

    - name: Fail when the binary is not an x86-64 Linux executable
      ansible.builtin.assert:
        that:
          - (mtrace_binary_header.stdout.split())[0:4] == ['7f', '45', '4c', '46']
          - (mtrace_binary_header.stdout.split())[18:20] == ['3e', '00']
        fail_msg: >-
          {{ media_dash_binary_src }} is not an x86-64 Linux executable. Build it with
          `bun run build --target=bun-linux-x64`.
        quiet: true

  tasks:
    - name: Create the service account
      ansible.builtin.user:
        name: "{{ mtrace_user }}"
        system: true
        create_home: false
        home: "{{ mtrace_dir }}"
        shell: /usr/sbin/nologin
        state: present

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ mtrace_dir }}"
        state: directory
        owner: "{{ mtrace_user }}"
        group: "{{ mtrace_group }}"
        mode: "0750"

    - name: Create the ssh directory for the service account
      ansible.builtin.file:
        path: "{{ mtrace_dir }}/.ssh"
        state: directory
        owner: "{{ mtrace_user }}"
        group: "{{ mtrace_group }}"
        mode: "0700"

    # The dedicated key, not kv/iac/lxc-ssh. See the header.
    - name: Install mtrace's private key
      ansible.builtin.copy:
        content: "{{ media_dash_ssh_private_key }}\n"
        dest: "{{ mtrace_dir }}/.ssh/id_ed25519_mtrace"
        owner: "{{ mtrace_user }}"
        group: "{{ mtrace_group }}"
        mode: "0600"
      no_log: true
      notify: Restart mtrace

    # ⚠ Pre-seeding the host keys matters: the transport runs with BatchMode=yes, so an
    # unknown host is a hard failure, and StrictHostKeyChecking=accept-new only helps the
    # first time if something is there to write to. Doing it here means the first real
    # question does not fail on seven unknown hosts.
    - name: Pre-seed the media hosts' ssh host keys
      ansible.builtin.shell:
        cmd: >-
          ssh-keyscan -T 5 -H
          192.168.50.33 192.168.50.15 192.168.50.16 192.168.50.20
          192.168.50.21 192.168.86.236
          > {{ mtrace_dir }}/.ssh/known_hosts.new
          && mv {{ mtrace_dir }}/.ssh/known_hosts.new {{ mtrace_dir }}/.ssh/known_hosts
      changed_when: true

    - name: Own the known_hosts file
      ansible.builtin.file:
        path: "{{ mtrace_dir }}/.ssh/known_hosts"
        owner: "{{ mtrace_user }}"
        group: "{{ mtrace_group }}"
        mode: "0600"

    - name: Install the mtrace binary
      ansible.builtin.copy:
        src: "{{ media_dash_binary_src }}"
        dest: "{{ mtrace_bin }}"
        owner: root
        group: "{{ mtrace_group }}"
        mode: "0750"
      notify: Restart mtrace

    # ⚠ THE ALLOWLIST, AND WHY IT LOADS BEFORE mtrace EVER BINDS THE LAN (PET-518). mtrace
    # used to bind loopback only; it now binds mtrace_bind, and the SSH key it holds is
    # root on six media hosts. This table is the thing making that bind safe: only lo and
    # mtrace_allow_sources may reach mtrace_port, everything else gets a TCP reset. It is
    # its own systemd unit and its own nftables table on purpose — see
    # templates/mtrace-allowlist.service.j2 and templates/mtrace-allowlist.nft.j2 for why
    # this does not touch /etc/nftables.conf or nftables.service.
    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the allowlist directory
      ansible.builtin.file:
        path: /etc/mtrace
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the LAN allowlist ruleset
      ansible.builtin.template:
        src: mtrace-allowlist.nft.j2
        dest: /etc/mtrace/allowlist.nft
        owner: root
        group: root
        mode: "0644"
        # nft parses the file at install time, so a syntax error fails HERE rather than at
        # the next boot on a node nobody is watching.
        validate: /usr/sbin/nft -c -f %s
      notify: Restart mtrace allowlist

    - name: Install the allowlist unit
      ansible.builtin.template:
        src: mtrace-allowlist.service.j2
        dest: /etc/systemd/system/mtrace-allowlist.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart mtrace allowlist

    - name: Enable and start the allowlist
      ansible.builtin.systemd:
        name: mtrace-allowlist
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so the allowlist is live before mtrace ever binds the LAN
      ansible.builtin.meta: flush_handlers

    - name: Read the live allowlist
      ansible.builtin.command:
        cmd: nft list table inet mtrace_allow
      register: mtrace_allow_live
      changed_when: false

    - name: Assert the allowlist is actually loaded, before mtrace binds the LAN
      ansible.builtin.assert:
        that:
          - (mtrace_port | string) in mtrace_allow_live.stdout
          - "'iif \"lo\" accept' in mtrace_allow_live.stdout"
          - mtrace_allow_sources | select('in', mtrace_allow_live.stdout) | list | length == mtrace_allow_sources | length
          - "'reject' in mtrace_allow_live.stdout"
        fail_msg: >-
          table inet mtrace_allow is not carrying the rules this deploy expects — port
          {{ mtrace_port }}, a loopback accept, every one of {{ mtrace_allow_sources }},
          and a reject. Fix the allowlist before mtrace starts on the LAN bind, not after.
        success_msg: >-
          mtrace_allow accepts lo and {{ mtrace_allow_sources | join(', ') }} on
          {{ mtrace_port }}/tcp, and rejects everything else.

    - name: Install the service environment
      ansible.builtin.template:
        src: mtrace.env.j2
        dest: /etc/mtrace.env
        owner: root
        group: "{{ mtrace_group }}"
        mode: "0640"
      no_log: true
      notify: Restart mtrace

    - name: Install the systemd unit
      ansible.builtin.template:
        src: mtrace.service.j2
        dest: /etc/systemd/system/mtrace.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart mtrace

    - name: Enable and start mtrace
      ansible.builtin.systemd:
        name: mtrace
        enabled: true
        state: started
        daemon_reload: true

  post_tasks:
    # ⚠ /health only proves the process is up. The second check proves it can still REACH
    # the stack, which is what a fresh key, a missing known_hosts entry or a moved container
    # all break — and all of which leave /health perfectly green.
    - name: Wait for the service to answer
      # Runs on the target, so this reaches mtrace_bind via lo — a connection to an
      # address the host owns is delivered locally regardless of bind, and the allowlist
      # accepts lo unconditionally (PET-518).
      ansible.builtin.uri:
        url: "http://{{ mtrace_bind }}:{{ mtrace_port }}/health"
        return_content: true
      register: mtrace_health
      retries: 10
      delay: 2
      until: mtrace_health.status is defined and mtrace_health.status == 200

    # ⚠ runuser, not become_user. become_user defaults to sudo, which this container
    # does not have — it is built from the minimal Debian template and the play installs
    # no packages. `su` is no help either: mtrace's shell is /usr/sbin/nologin by design.
    # runuser is in util-linux, is already present, and drops to a nologin account
    # without PAM, so the check still runs as the service user rather than as root.
    # Running it as root would prove nothing about the key's file mode.
    - name: Prove it can actually read the media stack, not just start
      ansible.builtin.command:
        cmd: "runuser -u {{ mtrace_user }} -- {{ mtrace_bin }} --tool stale_versions"
      environment:
        MEDIA_CONTROL_SSH_KEY: "{{ mtrace_dir }}/.ssh/id_ed25519_mtrace"
        HOME: "{{ mtrace_dir }}"
      register: mtrace_reach
      changed_when: false
      # ⚠ A SERVICE BEING DOWN IS NOT A FAILED DEPLOY. This previously also failed on
      # 'not answering' in stdout, but mtrace emits that string per service on any error
      # and the app documents it as an expected finding: planned downtime is normal in
      # this stack. Sonarr restarting for an update during a deploy turned a converged
      # run red, so the operator re-ran a deploy with nothing left to do.
      #
      # rc != 0 still fails, which is what a broken key, a missing known_hosts entry or
      # a moved container produce.
      failed_when: mtrace_reach.rc != 0

    - name: Warn when a service did not answer during the check
      ansible.builtin.debug:
        msg: >-
          At least one service did not answer during the reachability check. That is a
          finding rather than a deploy failure, but confirm it is planned downtime and
          not a key or known_hosts problem on that host.
      when: "'not answering' in mtrace_reach.stdout"

    - name: Report what it can see
      ansible.builtin.debug:
        msg: "{{ mtrace_reach.stdout_lines }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # ⚠ LISTED BEFORE "Restart mtrace", AND THAT ORDER IS THE POINT. Handlers run in the
    # order they are DEFINED here, not the order they are notified, so a run that changes
    # both the allowlist and mtrace's own files always reloads the allowlist first. The
    # nftables tasks above also flush handlers and verify the live table before mtrace's
    # tasks run at all, so this handler mainly covers a LATER run that only touches the
    # allowlist file or unit.
    - name: Restart mtrace allowlist
      ansible.builtin.systemd:
        name: mtrace-allowlist
        state: restarted

    - name: Restart mtrace
      ansible.builtin.systemd:
        name: mtrace
        state: restarted
