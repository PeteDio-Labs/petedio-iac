---
# configure-media-dash.yml — deploy tracerr on media-dash-237 as a systemd service.
#
# tracerr is the media stack's read-only control surface (PET-355, repo
# PeteDio-Labs/petedio-media-control). It answers "where is this stuck" by joining seerr
# requests to Sonarr/Radarr rows, qBittorrent infohashes and Plex rating keys.
#
# WHY A COMPILED BINARY (not Bun-from-source like water-fast/resume-builder): PET-355 chose
# Bun on the strength of `bun build --compile`, which produces one standalone file with no
# runtime to drift. This play COPIES that file; it never builds. roles/seerr in
# petedio-media-iac calls a build-from-source Node app "the single riskiest operation in
# this stack", and this deliberately does not repeat it.
#
# ⚠ HOW IT REACHES THE MEDIA STACK, AND THE COST OF THAT. tracerr does not hold the *arr API
# keys. It SSHes to each host and curls that host's own loopback, so a key is read from the
# host's config, used there, and only the RESPONSE crosses the LAN. That is a real security
# property — an *arr API key is equivalent to full control of that app — and it is also the
# only way to reach qBittorrent at all, whose WebUI is unreachable from off-box because
# Docker SNATs host-origin traffic outside its subnet allowlist.
#
# The cost is that 237 needs SSH to seven hosts. It is given a DEDICATED keypair for this,
# NOT the lab-wide `kv/iac/lxc-ssh` key: a read-only diagnostic must not carry root access
# to every container in the lab. The public half is installed below on exactly the seven
# hosts it reads, and nothing else.
#
# SECRETS (resolved by scripts/deploy-media-dash.sh, passed as no_log extra-vars):
#   media_dash_ssh_private_key  (Vault kv/services/media/dashboard, field ssh_private_key)
#   media_dash_ssh_public_key   (kv/services/media/dashboard, field ssh_public_key)
#   tracerr_caller_tokens       (kv/services/media/dashboard, one field token_<name> per
#                               caller; the legacy field api_token maps to caller
#                               "pete-bot" until scripts/mtrace-caller-token.sh revokes it).
#                               The play still reads the old name mtrace_caller_tokens when a
#                               caller passes that, so petedio-media-control's deploy.yml needs
#                               no change before this one.
# Run via:  ./scripts/deploy-media-dash.sh

- name: Authorise tracerr's dedicated key on the media hosts it reads
  hosts: media_read
  become: true
  gather_facts: false

  # ⚠ Scoped to ONE key on SEVEN hosts, and that is the whole play. petedio-media-iac owns
  # these containers; this group exists only to answer "who may tracerr log into", which is
  # a fact about tracerr rather than about the media stack. Keeping it declarative here beats
  # a distribution script nobody re-runs — workflow rule 6.
  # The public half of the media-dash-cd deploy key (PET-724), from kv/services/media/dashboard
  # field deploy_ssh_public_key (scripts/seed-media-dash-cd-key.sh). The GitHub deploy connects
  # with the private half, so it reaches these seven hosts and no other LXC. Empty skips it.
  vars:
    media_dash_cd_public_key: ""

  tasks:
    # ⚠ THE RENAME FROM mtrace (MED-12 follow-up). A host that still runs the pre-rename units
    # keeps its account, directory and state, so this block moves them in place rather than
    # starting empty: the schedule log and the SSH key directory travel with the account. The
    # old nftables table stays loaded until the new one is verified below, so the port is never
    # open. A host with no old files skips every task here.
    - name: Look for the pre-rename service unit
      ansible.builtin.stat:
        path: /etc/systemd/system/mtrace.service
      register: tracerr_legacy_unit

    # The unit file is removed last, so a run that stopped half way finds it again and resumes.
    - name: Set whether the rename must run
      ansible.builtin.set_fact:
        tracerr_migrate: "{{ tracerr_legacy_unit.stat.exists and not tracerr_legacy_unit.stat.islnk }}"

    - name: Look for the pre-rename group
      ansible.builtin.command:
        argv: [getent, group, mtrace]
      register: tracerr_legacy_group
      changed_when: false
      failed_when: tracerr_legacy_group.rc not in [0, 2]
      check_mode: false # read-only
      when: tracerr_migrate | bool

    - name: Look for the pre-rename account
      ansible.builtin.command:
        argv: [getent, passwd, mtrace]
      register: tracerr_legacy_account
      changed_when: false
      failed_when: tracerr_legacy_account.rc not in [0, 2]
      check_mode: false # read-only
      when: tracerr_migrate | bool

    - name: Stop and disable the pre-rename units
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [mtrace.service]
      when: tracerr_migrate | bool

    - name: Disable the pre-rename allowlist unit, leaving its table loaded
      ansible.builtin.systemd:
        name: mtrace-allowlist.service
        enabled: false
      when: tracerr_migrate | bool

    - name: Rename the group
      ansible.builtin.command:
        argv: [groupmod, --new-name, "{{ tracerr_group }}", mtrace]
      changed_when: true
      when:
        - tracerr_migrate | bool
        - tracerr_legacy_group.rc == 0

    - name: Rename the account and move its home
      ansible.builtin.command:
        argv: [usermod, --login, "{{ tracerr_user }}", --home, "{{ tracerr_dir }}", --move-home, mtrace]
      changed_when: true
      when:
        - tracerr_migrate | bool
        - tracerr_legacy_account.rc == 0

    - name: Look for the pre-rename state directory
      ansible.builtin.stat:
        path: /var/lib/mtrace
      register: tracerr_legacy_state
      when: tracerr_migrate | bool

    - name: Move the schedule state
      ansible.builtin.command:
        argv: [mv, /var/lib/mtrace, /var/lib/tracerr]
        creates: /var/lib/tracerr
      when:
        - tracerr_migrate | bool
        - tracerr_legacy_state.stat.exists

    - name: Remove the pre-rename files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/mtrace.service
        - /etc/systemd/system/mtrace-allowlist.service
        - /etc/mtrace.env
        - /etc/mtrace
        - "{{ tracerr_dir }}/mtrace"
        - "{{ tracerr_dir }}/.ssh/id_ed25519_mtrace"
      when: tracerr_migrate | bool

    - name: Authorize the media-dash-cd deploy key for root on this host only
      ansible.posix.authorized_key:
        user: root
        key: "{{ media_dash_cd_public_key }}"
        comment: media-dash-cd
        state: present
        exclusive: false
      when: media_dash_cd_public_key | length > 0

    # authorized_key with state: present adds a key and never removes another, so a rotated
    # key would stay authorized as root. Drop every other media-dash-cd line. tracerr's own key
    # carries no such comment, and neither do the ansible and operator keys.
    - name: Remove superseded media-dash-cd deploy keys
      ansible.builtin.replace:
        path: /root/.ssh/authorized_keys
        regexp: '(?m)^ssh-ed25519 (?!{{ media_dash_cd_public_key.split()[1] | regex_escape }}[ \t])\S+ media-dash-cd[ \t]*\n'
        replace: ""
      when: media_dash_cd_public_key | length > 0

    - name: Check that exactly one media-dash-cd key is authorized, and it is the current one
      ansible.builtin.shell:
        cmd: set -o pipefail; grep -E ' media-dash-cd[[:space:]]*$' /root/.ssh/authorized_keys | awk '{print $2}'
        executable: /bin/bash
      register: media_dash_cd_authorized
      changed_when: false
      check_mode: false # read-only; the `when` below still skips it under --check, so a --check run examines nothing here
      failed_when: media_dash_cd_authorized.stdout_lines != [media_dash_cd_public_key.split()[1]]
      when: media_dash_cd_public_key | length > 0 and not ansible_check_mode

    - name: Say that no media-dash-cd key is managed when the public key is empty
      ansible.builtin.debug:
        msg: >-
          media_dash_cd_public_key is empty, so this run neither authorizes nor revokes a
          media-dash-cd key on this host. Run scripts/seed-media-dash-cd-key.sh.
      when: media_dash_cd_public_key | length == 0

    - name: Assert the public key was provided (use scripts/deploy-media-dash.sh)
      ansible.builtin.assert:
        that:
          - media_dash_ssh_public_key is defined
          - media_dash_ssh_public_key | length > 0
        fail_msg: >-
          Missing media_dash_ssh_public_key. Run scripts/deploy-media-dash.sh, which
          resolves it from Vault (kv/services/media/dashboard).

    - name: Install tracerr's public key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ media_dash_ssh_public_key }}"
        # ⚠ SCOPE THE KEY. Without options this grants unrestricted interactive root on
        # six containers to a tool the header calls read-only. `restrict` disables port
        # and agent forwarding, pty allocation, X11 and user-rc, so the key cannot be
        # used to pivot or open a shell; `from=` means it works only when presented from
        # 237, so lifting it off that host buys nothing.
        #
        # It still permits command execution, because tracerr works by running
        # `ssh <host> curl 127.0.0.1:<port>` — that is deliberate, and it keeps each
        # *arr API key on its own host instead of centralising them. Narrowing further
        # needs a forced command wrapping that call, deployed to all six hosts, which is
        # its own change rather than a line here.
        # A host reached through NAT lists its NAT source in tracerr_key_sources, in the
        # inventory (plex-gpu, PET-522).
        key_options: 'restrict,from="{{ tracerr_key_sources | default(["192.168.50.237"]) | join(",") }}"'
        state: present
        # Never exclusive: these hosts are also reached by the ansible key and by the
        # operator, and pruning those would lock the lab out of its own media stack.
        exclusive: false

- name: Deploy tracerr on media-dash-237
  hosts: media_dash
  become: true

  vars:
    # See the first play: the media-dash-cd deploy key's public half. Empty skips it.
    media_dash_cd_public_key: ""
    # The old extra-var name, still accepted so a caller that has not moved to the new one works.
    tracerr_caller_tokens: "{{ mtrace_caller_tokens | default({}) }}"
    tracerr_dir: /opt/tracerr
    tracerr_bin: /opt/tracerr/tracerr
    tracerr_user: tracerr
    tracerr_group: tracerr
    tracerr_port: 8237
    # The scheduled search (MED-12, petedio-media-control#35). Daily it searches titles that
    # became available in the last 45 days; weekly it searches every available title with no
    # file, tracerr_search_gap_ms apart, at most tracerr_search_cap per pass. The log lives in
    # the unit's StateDirectory. Set tracerr_schedule to "off" to stop it.
    tracerr_schedule: "on"
    tracerr_search_gap_ms: 30000
    tracerr_search_cap: 60
    tracerr_schedule_log: /var/lib/tracerr/schedule.jsonl
    # Controller path to the compiled binary. CI overrides this with the artifact it just
    # built on the runner; the operator's script points it at the local checkout.
    media_dash_binary_src: "{{ lookup('env', 'HOME') }}/petedio/media-control/dist/tracerr"

    # ⚠ THE LAN BIND, AND WHO IS ON THE OTHER END OF IT (PET-518). tracerr used to answer
    # only on 127.0.0.1; it now binds its own LAN address so pete-bot's replacement caller
    # and anything else on the allowlist can reach it directly. .4 is pete-pi-1, the
    # tailnet subnet router — `tailscale debug prefs` there shows NoSNAT=false, so a
    # tailnet client's request arrives at tracerr already SNAT'd to .4, and .4 is the one
    # address the allowlist needs to carry every tailnet caller. The nftables allowlist
    # below is what makes opening this bind safe; see tracerr.env.j2 for the rest of that
    # story.
    tracerr_bind: "192.168.50.237"
    tracerr_allow_sources: ["192.168.50.4"]
    # The MCP door listens on its own port, so the tunnel host (LXC 112, which carries
    # mcp-media.pdlab.dev) reaches only that port and never the bearer-gated API on tracerr_port.
    # The nftables allowlist admits one named host there, never a subnet. The door also checks
    # the source and an Access JWT.
    tracerr_mcp_port: 8238
    tracerr_mcp_sources: ["192.168.50.112"]
    # The media MCP door (media-control src/mcp.ts). The audience tag is
    # `terraform output -raw media_mcp_subdomain_access_aud` in environments/homelab, read from
    # the apply log of 2026-11-10. Not a secret. Empty turns the door off.
    tracerr_mcp_peer: 192.168.50.112
    tracerr_mcp_access_team_domain: petedillo-labs.cloudflareaccess.com
    tracerr_mcp_access_emails: [pedelgadillo@gmail.com]
    tracerr_mcp_access_aud: "ec3ad851e140e255de2f9f7433f82091d135087e44483c2c80c36ae7da14f7a7"
    # Agents on the MCP door (PET-904): name -> Cloudflare service-token client id. A client id is
    # not secret. keys.yml action=list prints it, and a reissue changes it, so update it here then.
    # The route's `agents` list in environments/homelab/cloudflare-routes.tf names the same agents.
    tracerr_mcp_access_agents:
      bobbert: ca14c1dd4db82530a133724cd7945be4.access
      batsy: d620c3ddbedd7cde30577aeb2f11feb6.access
    # Callers that may use tracerr's write tools (search_missing, blocklist_release,
    # refresh_plex). Every caller not listed stays read-only. Each name must also be a
    # token_<name> field in kv/services/media/dashboard: tracerr stops at startup on one
    # that is not. lab-agent is deliberately absent. batsy joined on Pedro's word
    # (2026-11-09, PET-904).
    tracerr_write_callers: ["bobbert", "batsy"]

  pre_tasks:
    - name: Assert the LAN bind and allowlist are sane
      ansible.builtin.assert:
        that:
          - tracerr_bind not in ['0.0.0.0', '::', '127.0.0.1']
          - tracerr_allow_sources | length > 0
        fail_msg: >-
          tracerr_bind must be a real address, not 0.0.0.0, :: or 127.0.0.1 — this play
          pairs the LAN bind with an nftables allowlist, and a wildcard or loopback bind
          here defeats the point of both. tracerr_allow_sources must name at least one
          caller (PET-518).

    - name: Assert required secret extra-vars were provided (use scripts/deploy-media-dash.sh)
      ansible.builtin.assert:
        that:
          - media_dash_ssh_private_key is defined and media_dash_ssh_private_key | length > 0
          - tracerr_caller_tokens is defined and tracerr_caller_tokens is mapping
          - tracerr_caller_tokens | length > 0
          - tracerr_caller_tokens.keys() | reject('match', '^[a-z0-9-]+$') | list | length == 0
          - tracerr_caller_tokens.values() | select('equalto', '') | list | length == 0
          - tracerr_caller_tokens.values() | reject('match', '\\A[A-Za-z0-9_-]+\\Z') | list | length == 0
        fail_msg: >-
          Missing or malformed secret extra-vars. Run scripts/deploy-media-dash.sh, which
          resolves them from Vault (kv/services/media/dashboard) and passes them in.
          tracerr_caller_tokens must be a non-empty name -> token mapping, every name
          matching ^[a-z0-9-]+$, and every token matching \A[A-Za-z0-9_-]+\Z (no ',', ':',
          whitespace or newline — those would corrupt MEDIA_CONTROL_TOKENS's own field
          and pair separators). \A/\Z, not ^/$: Python's $ matches before a trailing
          newline too, which is exactly the byte this assert exists to catch.
      no_log: true

    - name: Assert the scheduled search settings are well formed
      ansible.builtin.assert:
        that:
          - tracerr_schedule in ['on', 'off']
          - tracerr_search_gap_ms | string is match('\\A[0-9]+\\Z')
          - tracerr_search_cap | string is match('\\A[1-9][0-9]*\\Z')
          - tracerr_schedule_log is match('\\A/var/lib/tracerr/[A-Za-z0-9._-]+\\Z')
        fail_msg: >-
          tracerr_schedule must be on or off, tracerr_search_gap_ms a number of milliseconds,
          tracerr_search_cap a positive count, and tracerr_schedule_log a file under
          /var/lib/tracerr, the only path the unit's StateDirectory makes writable.

    - name: Assert the MCP door's audience tag is empty or well formed
      ansible.builtin.assert:
        that:
          - tracerr_mcp_access_aud | length == 0 or tracerr_mcp_access_aud is match('\\A[0-9a-f]{64}\\Z')
        fail_msg: >-
          tracerr_mcp_access_aud must be empty (MCP door off) or the 64-hex audience tag from
          `terraform output -raw media_mcp_subdomain_access_aud`.

    - name: Assert each MCP door agent is a name and a service-token client id
      ansible.builtin.assert:
        that:
          - tracerr_mcp_access_agents is mapping
          - tracerr_mcp_access_agents.keys() | reject('match', '\\A[a-z][a-z0-9-]{1,30}\\Z') | list | length == 0
          - tracerr_mcp_access_agents.values() | reject('match', '\\A[0-9a-f]{32}\\.access\\Z') | list | length == 0
          - tracerr_mcp_access_agents.values() | unique | list | length == tracerr_mcp_access_agents | length
        fail_msg: >-
          tracerr_mcp_access_agents maps an agent name from secrets/callers.yml to its client id,
          `<32 hex>.access`, from keys.yml action=list. tracerr refuses to start on a malformed list.

    - name: Assert the MCP door has its peer on its allowlist and an email
      ansible.builtin.assert:
        that:
          - tracerr_mcp_peer in tracerr_mcp_sources
          - tracerr_mcp_access_emails | length > 0
        fail_msg: >-
          With tracerr_mcp_access_aud set, tracerr_mcp_peer must be in tracerr_mcp_sources and
          tracerr_mcp_access_emails must not be empty, or the MCP door is dead or refuses everyone.
      when: tracerr_mcp_access_aud | length > 0

    - name: Assert every write caller holds a token
      ansible.builtin.assert:
        that:
          - tracerr_write_callers | difference(tracerr_caller_tokens.keys() | list) | length == 0
        fail_msg: >-
          tracerr_write_callers names a caller with no token_<name> field in
          kv/services/media/dashboard. tracerr would stop at startup. Create the token
          with scripts/mtrace-caller-token.sh, or remove the name.
      no_log: true

    # Without this the play would install a stale binary, or none, and the service would
    # keep answering with yesterday's code — which looks like a deploy that worked.
    - name: Assert the binary was compiled on the controller (bun run build)
      ansible.builtin.stat:
        path: "{{ media_dash_binary_src }}"
      delegate_to: localhost
      become: false
      register: tracerr_binary_stat

    - name: Fail when the binary is missing
      ansible.builtin.fail:
        msg: >-
          No binary at {{ media_dash_binary_src }}. Run `bun run build` in
          petedio-media-control first, or pass -e media_dash_binary_src=<path>.
      when: not tracerr_binary_stat.stat.exists

    # ⚠ 237 is an x86-64 Linux container, and `bun build --compile` targets the machine it
    # runs on. A build on the Mac yields a Mach-O arm64 file that installs cleanly, then
    # fails every start with "Exec format error" (PET-518). Bytes 0-3 are the ELF magic,
    # and bytes 18-19 are e_machine, 0x3e for x86-64.
    - name: Read the binary's ELF header
      ansible.builtin.command:
        argv: [od, -An, -tx1, -N20, "{{ media_dash_binary_src }}"]
      delegate_to: localhost
      become: false
      changed_when: false
      register: tracerr_binary_header

    - name: Fail when the binary is not an x86-64 Linux executable
      ansible.builtin.assert:
        that:
          - (tracerr_binary_header.stdout.split())[0:4] == ['7f', '45', '4c', '46']
          - (tracerr_binary_header.stdout.split())[18:20] == ['3e', '00']
        fail_msg: >-
          {{ media_dash_binary_src }} is not an x86-64 Linux executable. Build it with
          `bun run build --target=bun-linux-x64`.
        quiet: true

  tasks:
    - name: Authorize the media-dash-cd deploy key for root on this host only
      ansible.posix.authorized_key:
        user: root
        key: "{{ media_dash_cd_public_key }}"
        comment: media-dash-cd
        state: present
        exclusive: false
      when: media_dash_cd_public_key | length > 0

    # authorized_key with state: present adds a key and never removes another, so a rotated
    # key would stay authorized as root. Drop every other media-dash-cd line. tracerr's own key
    # carries no such comment, and neither do the ansible and operator keys.
    - name: Remove superseded media-dash-cd deploy keys
      ansible.builtin.replace:
        path: /root/.ssh/authorized_keys
        regexp: '(?m)^ssh-ed25519 (?!{{ media_dash_cd_public_key.split()[1] | regex_escape }}[ \t])\S+ media-dash-cd[ \t]*\n'
        replace: ""
      when: media_dash_cd_public_key | length > 0

    - name: Check that exactly one media-dash-cd key is authorized, and it is the current one
      ansible.builtin.shell:
        cmd: set -o pipefail; grep -E ' media-dash-cd[[:space:]]*$' /root/.ssh/authorized_keys | awk '{print $2}'
        executable: /bin/bash
      register: media_dash_cd_authorized
      changed_when: false
      check_mode: false # read-only; the `when` below still skips it under --check, so a --check run examines nothing here
      failed_when: media_dash_cd_authorized.stdout_lines != [media_dash_cd_public_key.split()[1]]
      when: media_dash_cd_public_key | length > 0 and not ansible_check_mode

    - name: Say that no media-dash-cd key is managed when the public key is empty
      ansible.builtin.debug:
        msg: >-
          media_dash_cd_public_key is empty, so this run neither authorizes nor revokes a
          media-dash-cd key on this host. Run scripts/seed-media-dash-cd-key.sh.
      when: media_dash_cd_public_key | length == 0

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ tracerr_user }}"
        system: true
        create_home: false
        home: "{{ tracerr_dir }}"
        shell: /usr/sbin/nologin
        state: present

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ tracerr_dir }}"
        state: directory
        owner: "{{ tracerr_user }}"
        group: "{{ tracerr_group }}"
        mode: "0750"

    - name: Create the ssh directory for the service account
      ansible.builtin.file:
        path: "{{ tracerr_dir }}/.ssh"
        state: directory
        owner: "{{ tracerr_user }}"
        group: "{{ tracerr_group }}"
        mode: "0700"

    # The dedicated key, not kv/iac/lxc-ssh. See the header.
    - name: Install tracerr's private key
      ansible.builtin.copy:
        content: "{{ media_dash_ssh_private_key }}\n"
        dest: "{{ tracerr_dir }}/.ssh/id_ed25519_tracerr"
        owner: "{{ tracerr_user }}"
        group: "{{ tracerr_group }}"
        mode: "0600"
      no_log: true
      notify: Restart tracerr

    # ⚠ Pre-seeding the host keys matters: the transport runs with BatchMode=yes, so an
    # unknown host is a hard failure, and StrictHostKeyChecking=accept-new only helps the
    # first time if something is there to write to. Doing it here means the first real
    # question does not fail on seven unknown hosts.
    - name: Pre-seed the media hosts' ssh host keys
      ansible.builtin.shell:
        cmd: >-
          ssh-keyscan -T 5 -H
          192.168.50.33 192.168.50.15 192.168.50.16 192.168.50.20
          192.168.50.21 192.168.86.236
          > {{ tracerr_dir }}/.ssh/known_hosts.new
          && mv {{ tracerr_dir }}/.ssh/known_hosts.new {{ tracerr_dir }}/.ssh/known_hosts
      changed_when: true

    - name: Own the known_hosts file
      ansible.builtin.file:
        path: "{{ tracerr_dir }}/.ssh/known_hosts"
        owner: "{{ tracerr_user }}"
        group: "{{ tracerr_group }}"
        mode: "0600"

    - name: Install the tracerr binary
      ansible.builtin.copy:
        src: "{{ media_dash_binary_src }}"
        dest: "{{ tracerr_bin }}"
        owner: root
        group: "{{ tracerr_group }}"
        mode: "0750"
      notify: Restart tracerr

    # ⚠ THE ALLOWLIST, AND WHY IT LOADS BEFORE tracerr EVER BINDS THE LAN (PET-518). tracerr
    # used to bind loopback only; it now binds tracerr_bind, and the SSH key it holds is
    # root on six media hosts. This table is the thing making that bind safe: only lo and
    # tracerr_allow_sources may reach tracerr_port, everything else gets a TCP reset. It is
    # its own systemd unit and its own nftables table on purpose — see
    # templates/tracerr-allowlist.service.j2 and templates/tracerr-allowlist.nft.j2 for why
    # this does not touch /etc/nftables.conf or nftables.service.
    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the allowlist directory
      ansible.builtin.file:
        path: /etc/tracerr
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the LAN allowlist ruleset
      ansible.builtin.template:
        src: tracerr-allowlist.nft.j2
        dest: /etc/tracerr/allowlist.nft
        owner: root
        group: root
        mode: "0644"
        # nft parses the file at install time, so a syntax error fails HERE rather than at
        # the next boot on a node nobody is watching.
        validate: /usr/sbin/nft -c -f %s
      notify: Restart tracerr allowlist

    - name: Install the allowlist unit
      ansible.builtin.template:
        src: tracerr-allowlist.service.j2
        dest: /etc/systemd/system/tracerr-allowlist.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart tracerr allowlist

    - name: Enable and start the allowlist
      ansible.builtin.systemd:
        name: tracerr-allowlist
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so the allowlist is live before tracerr ever binds the LAN
      ansible.builtin.meta: flush_handlers

    - name: Read the live allowlist
      ansible.builtin.command:
        cmd: nft list table inet tracerr_allow
      register: tracerr_allow_live
      changed_when: false

    - name: Assert the allowlist is actually loaded, before tracerr binds the LAN
      ansible.builtin.assert:
        that:
          - (tracerr_port | string) in tracerr_allow_live.stdout
          - "'iif \"lo\" accept' in tracerr_allow_live.stdout"
          - tracerr_allow_sources | select('in', tracerr_allow_live.stdout) | list | length == tracerr_allow_sources | length
          - (tracerr_mcp_port | string) in tracerr_allow_live.stdout
          - tracerr_mcp_sources | select('in', tracerr_allow_live.stdout) | list | length == tracerr_mcp_sources | length
          - "'reject' in tracerr_allow_live.stdout"
        fail_msg: >-
          table inet tracerr_allow is not carrying the rules this deploy expects — port
          {{ tracerr_port }}, a loopback accept, every one of {{ tracerr_allow_sources }},
          and a reject. Fix the allowlist before tracerr starts on the LAN bind, not after.
        success_msg: >-
          tracerr_allow accepts lo and {{ tracerr_allow_sources | join(', ') }} on
          {{ tracerr_port }}/tcp, and rejects everything else.

    # The pre-rename table carries the same rules, so both rejected the same sources until now.
    - name: List the loaded nftables tables
      ansible.builtin.command:
        cmd: nft list tables
      register: tracerr_tables
      changed_when: false

    - name: Delete the pre-rename allowlist table
      ansible.builtin.command:
        argv: [nft, delete, table, inet, mtrace_allow]
      changed_when: true
      when: "'mtrace_allow' in tracerr_tables.stdout"

    - name: Install the service environment
      ansible.builtin.template:
        src: tracerr.env.j2
        dest: /etc/tracerr.env
        owner: root
        group: "{{ tracerr_group }}"
        mode: "0640"
      no_log: true
      notify: Restart tracerr

    - name: Install the systemd unit
      ansible.builtin.template:
        src: tracerr.service.j2
        dest: /etc/systemd/system/tracerr.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart tracerr

    - name: Enable and start tracerr
      ansible.builtin.systemd:
        name: tracerr
        enabled: true
        state: started
        daemon_reload: true

  post_tasks:
    # ⚠ /health only proves the process is up. The second check proves it can still REACH
    # the stack, which is what a fresh key, a missing known_hosts entry or a moved container
    # all break — and all of which leave /health perfectly green.
    - name: Wait for the service to answer
      # Runs on the target, so this reaches tracerr_bind via lo — a connection to an
      # address the host owns is delivered locally regardless of bind, and the allowlist
      # accepts lo unconditionally (PET-518).
      ansible.builtin.uri:
        url: "http://{{ tracerr_bind }}:{{ tracerr_port }}/health"
        return_content: true
      register: tracerr_health
      retries: 10
      delay: 2
      until: tracerr_health.status is defined and tracerr_health.status == 200

    # ⚠ runuser, not become_user. become_user defaults to sudo, which this container
    # does not have — it is built from the minimal Debian template and the play installs
    # no packages. `su` is no help either: tracerr's shell is /usr/sbin/nologin by design.
    # runuser is in util-linux, is already present, and drops to a nologin account
    # without PAM, so the check still runs as the service user rather than as root.
    # Running it as root would prove nothing about the key's file mode.
    - name: Prove it can actually read the media stack, not just start
      ansible.builtin.command:
        cmd: "runuser -u {{ tracerr_user }} -- {{ tracerr_bin }} --tool stale_versions"
      environment:
        MEDIA_CONTROL_SSH_KEY: "{{ tracerr_dir }}/.ssh/id_ed25519_tracerr"
        HOME: "{{ tracerr_dir }}"
      register: tracerr_reach
      changed_when: false
      # ⚠ A SERVICE BEING DOWN IS NOT A FAILED DEPLOY. This previously also failed on
      # 'not answering' in stdout, but tracerr emits that string per service on any error
      # and the app documents it as an expected finding: planned downtime is normal in
      # this stack. Sonarr restarting for an update during a deploy turned a converged
      # run red, so the operator re-ran a deploy with nothing left to do.
      #
      # rc != 0 still fails, which is what a broken key, a missing known_hosts entry or
      # a moved container produce.
      failed_when: tracerr_reach.rc != 0

    - name: Warn when a service did not answer during the check
      ansible.builtin.debug:
        msg: >-
          At least one service did not answer during the reachability check. That is a
          finding rather than a deploy failure, but confirm it is planned downtime and
          not a key or known_hosts problem on that host.
      when: "'not answering' in tracerr_reach.stdout"

    - name: Report what it can see
      ansible.builtin.debug:
        msg: "{{ tracerr_reach.stdout_lines }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # ⚠ LISTED BEFORE "Restart tracerr", AND THAT ORDER IS THE POINT. Handlers run in the
    # order they are DEFINED here, not the order they are notified, so a run that changes
    # both the allowlist and tracerr's own files always reloads the allowlist first. The
    # nftables tasks above also flush handlers and verify the live table before tracerr's
    # tasks run at all, so this handler mainly covers a LATER run that only touches the
    # allowlist file or unit.
    - name: Restart tracerr allowlist
      ansible.builtin.systemd:
        name: tracerr-allowlist
        state: restarted

    - name: Restart tracerr
      ansible.builtin.systemd:
        name: tracerr
        state: restarted
