---
# configure-forgejo-mirror.yml — Forgejo and its GitHub sync on forgejo-249 (PET-756).
#
# Terraform creates the container (environments/homelab/forgejo.tf). This play installs Forgejo,
# the sync script and its timer. Run it with scripts/deploy-forgejo-mirror.sh, which resolves the
# read-only GitHub App from Vault (kv/services/forgejo-mirror) and passes it as no_log extra-vars:
#
#   forgejo_mirror_app_id, forgejo_mirror_installation_id, forgejo_mirror_app_pem
#
# There is no default for any of them: a committed placeholder would become the live credential on
# a bare re-run. Nothing in .github/workflows runs this play (PET-266).

- name: Configure the Forgejo mirror
  hosts: forgejo
  become: true
  pre_tasks:
    - name: Assert the App credentials were provided (use scripts/deploy-forgejo-mirror.sh)
      ansible.builtin.assert:
        that:
          - forgejo_mirror_app_id is defined and forgejo_mirror_app_id | string is match('\\A[0-9]+\\Z')
          - forgejo_mirror_installation_id is defined and forgejo_mirror_installation_id | string is match('\\A[0-9]+\\Z')
          - forgejo_mirror_app_pem is defined and forgejo_mirror_app_pem is search('-----BEGIN')
          - forgejo_mirror_app_pem.splitlines() | length >= 3
        fail_msg: >-
          Missing or malformed App credentials. Run scripts/deploy-forgejo-mirror.sh, which reads
          kv/services/forgejo-mirror. The key must keep its newlines.
        quiet: true
      no_log: true
  roles:
    - forgejo-mirror
