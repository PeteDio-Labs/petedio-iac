---
# configure-claude-code.yml — Claude Code on LXC 247 (claude.tf).
#
# The host runs `claude remote-control`, so a session lives on hardware that stays up and
# is drivable from claude.ai/code or the Claude phone app. Everything the box needs —
# Node.js, Claude Code, gh, the mirrored workspace repos, the per-project units — is in
# roles/claude-code.
#
# NO NODE-SIDE PRECONDITION. Unlike configure-plane.yml there is no
# scripts/lxc-features-247.sh to run first: nothing here runs Docker.
#
# THE LOGIN STILL CANNOT BE INJECTED. Remote Control refuses API keys and
# `claude setup-token` tokens alike, so the claude.ai login is an operator step over SSH.
#
# ⚠ THERE IS NOW A VAULT SECRET TO PASS IN (PET-399), and this header used to say there was
# not. The ticket-driven work loop needs a GitHub App key and the Plane PAT, so run the play
# through its wrapper when you mean to land or rotate them:
#
#   ./scripts/deploy-claude-247.sh
#
# Run bare, the play still converges everything else and leaves the secrets alone — see the
# "Decide whether this run carries the loop identity" task in roles/claude-code, and its
# counterpart for the workspace mirror's GitHub App (PET-493).
#
# TWO-PHASE BY DESIGN, DECLARED ONCE. claude-247 declares `claude_remote_enable: true` in
# inventory/host_vars/claude-247.yml, and the role starts the units only once the operator
# has signed in and answered the one-time consent. Until then a run converges everything
# else and FAILS at the end with the step to take, because a unit started without the
# consent hangs at its prompt while systemd reports it active (PET-431). The same holds for a
# directory nobody has trusted, whose unit exits at once and lands in `failed` (PET-499).
# After the operator steps, run the same command again:
#
#   ansible-playbook playbooks/configure-claude-code.yml
#
# ⚠ Do not pass `-e claude_remote_enable=true` instead of declaring it. That was the old
# bootstrap, and the next run without the flag, a loop deploy, stopped the server.
#
# Full sequence, including what to click: ansible/roles/claude-code/README.md.
#
# Manual-validation-first (standing convention, PET-266): run this by hand and get it green
# before any CD-on-merge workflow is wired to it. Nothing in .github/workflows watches this
# play today, and the inventory group it uses is unwatched too.

- name: Configure the Claude Code host (LXC 247)
  hosts: claude
  become: true

  roles:
    - claude-code

  post_tasks:
    # Remote Control is off for this host, so the units are stopped. Say how to turn it on
    # rather than leave you to discover the stopped units later.
    - name: Report how to turn Remote Control on
      ansible.builtin.debug:
        msg:
          - "Claude Code is installed, and the remote-control units are stopped."
          - "1. ssh claude@{{ ansible_host | default('192.168.50.247') }}"
          - "2. cd ~/work/petedio/iac && claude   # accept workspace trust, then /login"
          - "3. claude remote-control             # answer y once, confirm a session URL, Ctrl+C"
          - "4. declare claude_remote_enable: true in inventory/host_vars/{{ inventory_hostname }}.yml, then re-run this play"
      when: not claude_remote_enable | bool

    # ⚠ DO NOT FINISH GREEN OVER A SESSION THAT GOT NO UNIT (PET-466). Until PET-466 the
    # role asserted this in the middle of itself, so one entry whose directory was missing
    # stopped the play before ANY unit was rendered — every other session stayed on
    # whatever the last successful run left behind, while the running units kept answering
    # and the host showed nothing wrong. Failing here instead keeps the report and drops
    # the blocking, which is the same trade the consent check below already makes.
    #
    # msg as a LIST, like the task below. A folded scalar keeps the newline under any line
    # indented further than its first, so a multi-line {{ }} expression lands a literal \n
    # in the middle of the sentence — which only an operator reading a real failure would
    # ever see.
    - name: Fail on a declared session this host cannot serve
      ansible.builtin.fail:
        msg: "{{ ['These declared claude_remote_sessions entries got no unit, because their directories are missing:']
                 + (claude_sessions_unservable | default([])
                    | map(attribute='dir')
                    | map('regex_replace', '^', claude_workspace ~ '/') | list)
                 + ['Everything else in this play converged. To finish:',
                    '1. For petedio-workspace, the mirror did not deliver. What stopped it: '
                    ~ claude_workspace_mirror_blocked_at | default('claude_workspace_mirror_enable is not true on this host'),
                    '   It arrives over a GitHub App, Contents and Metadata read-only, installed on that',
                    '   one repository (PET-493). To seed or rotate its credentials, run',
                    '   ./scripts/seed-workspace-mirror-vault.sh and then ./scripts/deploy-claude-247.sh.',
                    '   One run clones; there is no second pass.',
                    '   Then trust it once, as the session user, or Remote Control still refuses to serve it:',
                    '     cd ~/work/petedio/workspace && claude   # accept the dialog, then /exit',
                    '   ⚠ A DEPLOY KEY CANNOT REPLACE IT, and this message told you to paste one until PET-493.',
                    '   PeteDio-Labs disallows deploy keys for every repository it owns:',
                    '   `gh api orgs/PeteDio-Labs --jq .deploy_keys_enabled_for_repositories` is false.',
                    '2. For petedio-vault, the clone did not converge. What stopped it: '
                    ~ claude_vault_blocked_at | default('claude_vault_enable is not true on this host'),
                    '   It arrives over a THIRD GitHub App, contents:write and metadata:read on that one',
                    '   repository, because a session here pushes notes to its main (PET-498). To seed or',
                    '   rotate it, run ./scripts/seed-claude-vault-app.sh and then ./scripts/deploy-claude-247.sh.',
                    '   Then trust it once, as the session user, in its own directory:',
                    '     cd ~/work/petedio/vault && claude   # accept the dialog, then /exit',
                    '   ⚠ Do NOT reuse the loop App or the mirror App here to make a red run green. The',
                    '   loop App can push to petedio-iac and open PRs, and this key is readable by every',
                    '   session on this host. deploy-claude-247.sh refuses that swap by App id, and a',
                    '   hand-run play cannot, which is why the credentials come from the script.',
                    '3. For any other private repo, it needs the same treatment: roles/claude-code/tasks/workspace-mirror.yml.',
                    'To stop serving one instead, drop its entry from claude_remote_sessions.',
                    '⚠ DO NOT run `gh auth login` on this host to make this go away. This message said to, until PET-480.',
                    '   vault/Claude/claude-247.md forbids it by name. The token it writes belongs to Pedro,',
                    '   and every session on this box can read it. A red run is cheaper.'] }}"
      when: claude_sessions_unservable | default([]) | length > 0

    # ⚠ DO NOT FINISH GREEN OVER A SERVER THAT WAS NOT STARTED (PET-431). The host declares
    # Remote Control on, but the role found no consent and left the units alone, because a
    # unit started without it waits at the prompt forever while systemd reports it active.
    # Everything else in the play converged; this is the one thing the run could not do, and
    # an exit code of 0 would say it had.
    - name: Fail while Remote Control is declared on but the consent is missing
      ansible.builtin.fail:
        msg:
          - "claude_remote_enable is true, but the one-time Remote Control consent is not on disk, so the remote-control units were NOT started."
          - "Everything else in this play converged. To finish:"
          - "1. ssh claude@{{ ansible_host | default('192.168.50.247') }}"
          - "2. cd ~/work/petedio/iac && claude   # only if never done: accept workspace trust, then /login"
          - "3. claude remote-control             # answer y once, confirm a session URL, Ctrl+C"
          - "4. re-run this play"
          - "jq rc={{ claude_remote_consent.rc | default('none') }} (1: remoteDialogSeen is absent or false) {{ claude_remote_consent.stderr | default('') }}"
      when:
        - claude_remote_enable | bool
        - claude_remote_consent.rc | default(1) != 0

    # ⚠ DO NOT FINISH GREEN OVER A DIRECTORY NOBODY HAS TRUSTED (PET-499). The consent above
    # waits at a prompt while systemd reports the unit active. An untrusted directory does the
    # opposite: the server exits at once, and five starts in 5 minutes land the unit in
    # `failed`. The role left these units unstarted instead, so say which, and how to finish.
    - name: Fail while a served directory has no workspace trust
      ansible.builtin.fail:
        msg: "{{ ['These remote-control units were NOT started, because nobody has accepted the workspace trust dialog in their directories:']
                 + (claude_sessions_untrusted | default([])
                    | map(attribute='dir')
                    | map('regex_replace', '^', '  ' ~ claude_workspace ~ '/') | list)
                 + ['Everything else in this play converged, and every trusted unit was started. To finish, for each directory above:',
                    '1. ssh ' ~ claude_user ~ '@' ~ (ansible_host | default('192.168.50.247')),
                    '2. cd <dir> && claude   # accept the trust dialog, then /exit',
                    '3. re-run ./scripts/deploy-claude-247.sh, which starts the unit.',
                    '   Or, as root: systemctl reset-failed claude-remote-<name> && systemctl start claude-remote-<name>',
                    'The play does not seed the trust key in ~/.claude.json on purpose. The dialog is where a person reads what the directory can run.'] }}"
      when:
        - claude_remote_enable | bool
        - claude_sessions_untrusted | default([]) | length > 0
