---
# authorize-claude-ops-media.yml — let claude-ops on claude-247 SSH to the media hosts as root
# (PET-662).
#
# Before this, every SSH probe from 247 to the media stack answered `Permission denied`
# (workspace media-triage skill, measured 2026-10-12), so each per-host media step ran from
# the Mac. Pedro chose root on all seven hosts, with the key pinned to 247 by `from=`, the
# same shape as the Proxmox grant in scripts/seed-claude-ops-ssh.sh.
#
# ⚠ THE KEY IS GENERATED ON 247 AND NEVER LEAVES IT. roles/claude-code/tasks/claude-ops.yml
# runs ssh-keygen as claude-ops and writes claude_ops_media_ssh_key. This play reads back the
# PUBLIC half only. It is a separate key from the Proxmox one, so removing this grant never
# touches the node grant, and the Proxmox key stays refused here.
#
# Run it after configure-claude-code.yml has generated the key, from a machine that holds
# id_ed25519_ansible (the Mac, or the homelab runner):
#
#   cd ansible && ansible-playbook playbooks/authorize-claude-ops-media.yml
#
# To revoke, set claude_ops_media_key_state=absent:
#
#   ansible-playbook playbooks/authorize-claude-ops-media.yml -e claude_ops_media_key_state=absent

- name: Read claude-ops's media public key from claude-247
  hosts: claude-247
  become: true
  gather_facts: false

  vars:
    claude_ops_media_pubkey_path: /home/claude-ops/.ssh/id_ed25519_media.pub

  tasks:
    - name: Read the public key
      ansible.builtin.slurp:
        src: "{{ claude_ops_media_pubkey_path }}"
      register: claude_ops_media_pubkey_raw

    # Exactly one ssh-ed25519 line. Anything else is not the file tasks/claude-ops.yml wrote,
    # so do not authorize it blind.
    - name: Assert the file holds exactly one ssh-ed25519 public key
      vars:
        claude_ops_media_pubkey_lines: "{{ claude_ops_media_pubkey_raw.content | b64decode | trim | split('\n') }}"
      ansible.builtin.assert:
        that:
          - claude_ops_media_pubkey_lines | length == 1
          - claude_ops_media_pubkey_lines[0] is match('^ssh-ed25519 [A-Za-z0-9+/=]+( |$)')
        fail_msg: >-
          {{ claude_ops_media_pubkey_path }} on claude-247 does not hold exactly one
          ssh-ed25519 key. Run configure-claude-code.yml with claude_ops_enable true first,
          which generates it.

    - name: Keep the key for the next play
      ansible.builtin.set_fact:
        claude_ops_media_pubkey: "{{ (claude_ops_media_pubkey_raw.content | b64decode | trim).split(' ')[:2] | join(' ') }} claude-ops-media@claude-247"

- name: Authorize claude-ops's media key for root on the media hosts
  hosts: media_read:media_dash
  become: true
  gather_facts: false

  vars:
    claude_ops_media_key_state: present

  tasks:
    # ⚠ A play that matches zero hosts exits 0. Count them, so a renamed group fails here
    # instead of reporting a grant that never happened.
    - name: Assert all seven media hosts are in this play
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 7
          - claude_ops_media_key_state in ['present', 'absent']
        fail_msg: >-
          Expected 7 hosts (101, 104, 105, 109, 110, 236, 237) and got
          {{ ansible_play_hosts_all | length }}: {{ ansible_play_hosts_all | join(', ') }}.
          claude_ops_media_key_state must be present or absent.

    - name: Install or remove the key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ hostvars['claude-247'].claude_ops_media_pubkey }}"
        # from= pins the key to 247, so a copy lifted elsewhere buys nothing. A host reached
        # through NAT lists its NAT source in claude_ops_media_key_sources (plex-gpu).
        key_options: 'from="{{ claude_ops_media_key_sources | default(["192.168.50.247"]) | join(",") }}"'
        state: "{{ claude_ops_media_key_state }}"
        # Never exclusive: the ansible key, mtrace's key and the operator's keys live here too.
        exclusive: false
