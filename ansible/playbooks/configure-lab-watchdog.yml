---
# configure-lab-watchdog.yml — the second alert path (PET-707). Probes the Pi's Kuma, pete-bot
# and Vault from claude-247 and posts to a Discord channel webhook, so an outage of pete-bot
# or of the Pi still reaches Pedro. See roles/lab-watchdog/defaults/main.yml for what it
# cannot see: it shares fate with pve03.
#
# Run it through scripts/deploy-lab-watchdog.sh, which passes the webhook from Vault
# (kv/services/lab-watchdog). A plain run installs the probe and leaves the timer off until
# the webhook file exists.
#
#   ./scripts/deploy-lab-watchdog.sh
#
# Manual-validation-first (PET-266): nothing in .github/workflows runs this play.

- name: Install the lab watchdog
  hosts: claude
  become: true
  roles:
    - lab-watchdog
