---
# configure-pete-bot.yml — install pete-bot on media-dash-237, beside mtrace (PET-375).
#
# WHAT IT IS. A Discord surface and nothing else. POST /v1/alert takes an Uptime Kuma
# webhook and DMs the owner, editing the original message when the service recovers, and
# /update starts the media-updates workflow. It holds no tools of its own.
#
# THE ANTHROPIC API GATEWAY (PET-617). POST /v1/llm/v1/messages forwards a caller's
# request with the homelab's one Anthropic key, and refuses a caller past its monthly cap.
# The key and each caller's bearer come from Vault; the caps and models are set below. With
# no key the gateway is off and the rest of the bot runs as before.
#
# ⚠ IT NO LONGER TALKS TO MTRACE (PET-518). /ask, DM forwarding and the /status mtrace
# line are gone, so this play passes no mtrace token or URL. Don't add one back: mtrace
# gives each caller its own token, and Pete Bot isn't a caller.
#
# WHY IT LIVES HERE. A Discord bot needs only an OUTBOUND websocket, so co-locating it
# on 237 exposes nothing new.
#
# LAB-AGENT (PET-669, PET-670). A second binary from the pete-bot repo, under its own user
# and unit. It answers pete-bot's /lab with read-only lab tools on 127.0.0.1:3016, and calls
# the gateway above as the lab-map caller. It holds lab-map's bearer, its own ask bearer, a
# metadata-only Vault token, a read-only Proxmox token and the read-only
# petedio-workspace-mirror App's key, which mints petedio-vault read tokens. It holds no
# Discord token, no desk key and no Anthropic key. It also holds pete-bot's notify
# bearer, which its nightly drift check (PET-671) DMs with. It is off until
# kv/services/lab-agent and kv/services/lab-agent-pve are both seeded: run
# scripts/seed-lab-agent.sh, whose header gives the order.
#
# ⚠ THE BINARY IS BUILT ON THE CONTROLLER. `bun build --compile` produces a standalone
# linux-x64 executable, so 237 needs neither node nor bun and no npm install runs on a
# container with 512 MB. The play only ever COPIES it, and fails if it is missing rather
# than leaving yesterday's binary in place. Same shape as configure-media-dash.yml.
#
# ⚠ OPERATOR-RUN OR CD, NEVER ON MERGE TO THIS REPO. No workflow here watches it: the
# binary comes from the pete-bot repo, so that repo's deploy.yml drives it.
#
# Usage:
#   scripts/deploy-pete-bot.sh
#   scripts/deploy-pete-bot.sh --check

- name: Install pete-bot on media-dash-237
  hosts: media_dash
  become: true
  gather_facts: false

  vars:
    pete_bot_user: pete-bot
    pete_bot_dir: /opt/pete-bot
    pete_bot_bin: /opt/pete-bot/pete-bot
    pete_bot_env_file: /etc/pete-bot.env
    pete_bot_port: 3015
    # Required, passed by scripts/deploy-pete-bot.sh. Never defaulted here.
    #   pete_bot_binary_src, pete_bot_discord_token, pete_bot_discord_client_id,
    #   pete_bot_owner_user_id, pete_bot_alert_bearer, pete_bot_notify_bearer (PET-584)
    # Optional (PET-395): pete_bot_github_updates_token, for /update. Empty leaves
    # /update answering that it is not configured.
    # Optional (PET-617), set together or not at all: pete_bot_anthropic_api_key and
    # pete_bot_gateway_token_lab_map. scripts/seed-llm-gateway.sh writes both.
    #
    # The merge desk (PET-645). Optional: pete_bot_desk_app_id,
    # pete_bot_desk_installation_id and pete_bot_desk_app_pem, from kv/services/pete-bot
    # (scripts/seed-pete-bot-desk-app.sh). Without all three the desk stays off, whatever
    # pete_bot_desk_mode says, so a deploy before the seed changes nothing.
    pete_bot_conf_dir: /etc/pete-bot
    # dry-run approves and merges nothing, and DMs each merge it would make (Pedro,
    # 2026-10-16). Moving to `on` is a decision, so it is a reviewed change to this line.
    # Pedro moved it to `on` on 2026-10-19, after the desk queued Codex with its own key
    # and Codex reviewed petedio-workspace#153 and petedio-vault#91 (PET-645).
    pete_bot_desk_mode: "on"
    # petedio-iac joined on 2026-10-19 (Pedro, PET-645). It runs PR CI, so it stays off the
    # no-CI list below, and its tier-2 paths (Terraform, workflows, guards) wait for a tap.
    pete_bot_desk_repos: petedio-workspace,petedio-vault,petedio-pm,petedio-iac
    # Repos that run no PR validation, by decision. Only there may a head with no check merge
    # without a tap; anywhere else an empty check list may be CI that never started.
    pete_bot_desk_no_ci_repos: petedio-workspace,petedio-vault,petedio-pm
    # petedio-cloud-threads[bot] authors every cloud thread's PR (PET-644). Without it here,
    # the desk skips them all and each one waits for Pedro (Pedro, 2026-10-19).
    pete_bot_desk_authors: petedillo,petedio-cloud-threads[bot]
    pete_bot_codex_host: 192.168.50.248
    pete_bot_desk_ready: >-
      {{ (pete_bot_desk_app_id | default('') | string | length > 0)
         and (pete_bot_desk_installation_id | default('') | string | length > 0)
         and (pete_bot_desk_app_pem | default('') | length > 0) }}

    # Each gateway caller: its bearer, its monthly cap in whole dollars, and the models it
    # may ask for. A model outside pete-bot's price table puts the gateway in the
    # misconfigured state, which the check below fails.
    #
    # The one caller is the lab-map agent. Pedro gave it the API budget on 2026-10-15, in
    # place of pm-agent (PET-617). Its cap is plan v3's two lab-map lines: $30 for questions
    # through pete-bot and $10 for the nightly drift batch.
    pete_bot_llm_callers:
      lab-map:
        token: "{{ pete_bot_gateway_token_lab_map | default('') }}"
        monthlyCapUsd: 40
        models: [claude-haiku-4-5]
    # The spend ledger the caps read. It must survive a restart, so it lives in the unit's
    # StateDirectory beside the alert state.
    pete_bot_llm_ledger_path: /var/lib/pete-bot/llm-ledger.sqlite

    # ── lab-agent (PET-670) ──
    # Optional, all together or not at all, from scripts/deploy-pete-bot.sh or deploy.yml:
    #   lab_agent_binary_src, and from kv/services/lab-agent: lab_agent_ask_token,
    #   lab_agent_vault_token; from kv/services/lab-agent-pve: lab_agent_pve_token_id,
    #   lab_agent_pve_token_secret, lab_agent_pve_endpoint, lab_agent_pve_ca_pem; from
    #   kv/services/claude-workspace-mirror: lab_agent_github_app_id,
    #   lab_agent_github_installation_id, lab_agent_github_app_pem.
    #   lab-map's bearer is pete_bot_gateway_token_lab_map above.
    lab_agent_user: lab-agent
    lab_agent_dir: /opt/lab-agent
    lab_agent_bin: /opt/lab-agent/lab-agent
    lab_agent_conf_dir: /etc/lab-agent
    lab_agent_env_file: /etc/lab-agent/lab-agent.env
    # The unit's StateDirectory. The three read-only clones live here.
    lab_agent_state_dir: /var/lib/lab-agent
    lab_agent_port: 3016
    # ⚠ NO DEPLOY KEY. PeteDio-Labs disables deploy keys for every repository, so lab-agent
    # reaches the private vault over https with a token it mints from the read-only
    # petedio-workspace-mirror App, scoped to petedio-vault with contents:read (PET-542).
    lab_agent_github_key_file: /etc/lab-agent/github-app.pem
    lab_agent_repos:
      vault: https://github.com/PeteDio-Labs/petedio-vault.git
      iac: https://github.com/PeteDio-Labs/petedio-iac.git
      media-iac: https://github.com/PeteDio-Labs/petedio-media-iac.git
    # One entry per lab-agent secret. A value is set or it is empty; the play counts the set
    # ones. The mirror App's three are apart: that path is seeded for 247 and petedio-search
    # too, so its values arrive whether or not lab-agent is seeded.
    lab_agent_app_values:
      - "{{ lab_agent_github_app_id | default('') }}"
      - "{{ lab_agent_github_installation_id | default('') }}"
      - "{{ lab_agent_github_app_pem | default('') }}"
    lab_agent_values:
      - "{{ lab_agent_ask_token | default('') }}"
      - "{{ lab_agent_vault_token | default('') }}"
      - "{{ lab_agent_pve_token_id | default('') }}"
      - "{{ lab_agent_pve_token_secret | default('') }}"
      - "{{ lab_agent_pve_endpoint | default('') }}"
      - "{{ lab_agent_pve_ca_pem | default('') }}"
    lab_agent_set_count: "{{ lab_agent_values | map('trim') | reject('equalto', '') | list | length }}"
    lab_agent_ready: "{{ (lab_agent_set_count | int) == (lab_agent_values | length) }}"

  pre_tasks:
    - name: Assert the secrets were provided
      ansible.builtin.assert:
        that:
          - pete_bot_discord_token is defined and pete_bot_discord_token | length > 0
          - pete_bot_discord_client_id is defined and pete_bot_discord_client_id | length > 0
          - pete_bot_owner_user_id is defined and pete_bot_owner_user_id | length > 0
          - pete_bot_alert_bearer is defined and pete_bot_alert_bearer | length > 0
          - pete_bot_notify_bearer is defined and pete_bot_notify_bearer | length > 0
          # The point of a second token (PET-584): a session host must not hold the alert one.
          - pete_bot_notify_bearer != pete_bot_alert_bearer
        fail_msg: >-
          Missing secret extra-vars, or the notify bearer equals the alert bearer. Run
          scripts/deploy-pete-bot.sh, which resolves them from kv/services/pete-bot and
          passes them in. To mint the notify bearer, run scripts/seed-pete-bot-notify-token.sh.
      # no_log deliberately absent: assert never echoes a value, and censoring the result
      # would hide the fail_msg that names the script to run.

    # ⚠ BOTH OR NEITHER. A key without a caller leaves the gateway misconfigured, and a
    # caller without a key leaves it off while lab-map holds a bearer nothing accepts.
    - name: Assert the gateway's key and bearer are set together
      ansible.builtin.assert:
        that:
          - (pete_bot_anthropic_api_key | default('') | length > 0)
            == (pete_bot_gateway_token_lab_map | default('') | length > 0)
          - pete_bot_gateway_token_lab_map | default('') | length == 0
            or pete_bot_gateway_token_lab_map not in
               [pete_bot_alert_bearer, pete_bot_notify_bearer, pete_bot_github_updates_token | default('')]
        fail_msg: >-
          kv/services/pete-bot holds only one of anthropic_api_key and gateway_token_lab_map,
          or the gateway bearer repeats another route's. Run scripts/seed-llm-gateway.sh.

    # ⚠ ALL OR NONE. Some lab-agent values without the rest is a seed that stopped halfway,
    # and a lab-agent started from it fails its health check on every deploy.
    - name: Assert lab-agent's values arrive together
      ansible.builtin.assert:
        that:
          - (lab_agent_set_count | int) in [0, lab_agent_values | length]
          - not (lab_agent_ready | bool) or (pete_bot_gateway_token_lab_map | default('') | length > 0)
          - not (lab_agent_ready | bool) or (lab_agent_app_values | map('trim') | reject('equalto', '') | list | length == 3)
          - not (lab_agent_ready | bool) or lab_agent_ask_token not in
              [pete_bot_alert_bearer, pete_bot_notify_bearer, pete_bot_gateway_token_lab_map | default('')]
        fail_msg: >-
          lab-agent got {{ lab_agent_set_count }} of {{ lab_agent_values | length }} values, or it
          has no gateway bearer or no mirror App, or its ask bearer repeats another route's. Seed
          kv/services/lab-agent-pve with playbooks/mint-pve-audit-token.yml -e pve_client=lab-agent
          and kv/services/lab-agent with scripts/seed-lab-agent.sh, then deploy again.
          kv/services/claude-workspace-mirror comes from scripts/seed-workspace-mirror-vault.sh.

    - name: Look for the lab-agent binary on the controller
      ansible.builtin.stat:
        path: "{{ lab_agent_binary_src | default('') }}"
      register: lab_agent_artifact
      delegate_to: localhost
      become: false
      when: lab_agent_ready | bool

    - name: Fail when lab-agent is seeded but its binary is missing
      ansible.builtin.fail:
        msg: >-
          lab-agent is seeded, but no binary is at {{ lab_agent_binary_src | default('(lab_agent_binary_src unset)') }}.
          Run `bun run build:lab-binary` in the pete-bot repo first; deploy-pete-bot.sh does it for you.
      when:
        - lab_agent_ready | bool
        - not lab_agent_artifact.stat.exists

    - name: Assert the binary was compiled on the controller
      ansible.builtin.stat:
        path: "{{ pete_bot_binary_src }}"
      register: pete_bot_artifact
      delegate_to: localhost
      become: false

    - name: Fail when the binary is missing
      ansible.builtin.fail:
        msg: >-
          No binary at {{ pete_bot_binary_src }}. Run `bun run build:binary` in the
          pete-bot repo first; deploy-pete-bot.sh does it for you.
      when: not pete_bot_artifact.stat.exists

    # ⚠ ONCE INSTALLED, A DEPLOY WITHOUT ITS VALUES IS A FAULT. A Vault refusal or an
    # outage on the lab-agent paths reads the same as "not seeded": every value empty. On a
    # 237 that already runs lab-agent, that would blank pete-bot's LAB_ASK_TOKEN and turn
    # /lab off under a green deploy. Before the first seed the unit does not exist, so a
    # deploy then still passes.
    - name: Look for an installed lab-agent unit
      ansible.builtin.stat:
        path: /etc/systemd/system/lab-agent.service
      register: lab_agent_unit_file

    - name: Fail when lab-agent is installed but its values did not arrive
      ansible.builtin.fail:
        msg: >-
          lab-agent is installed on this host, but the deploy passed none of its values. Vault
          refused or could not answer the read of kv/services/lab-agent or
          kv/services/lab-agent-pve. Run scripts/pet-secrets doctor, then deploy again.
      when:
        - lab_agent_unit_file.stat.exists
        - not (lab_agent_ready | bool)

  tasks:
    - name: Create the service account
      ansible.builtin.user:
        name: "{{ pete_bot_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ pete_bot_dir }}"
        state: directory
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0750"
      # ⚠ owner root, not the service account. mtrace's directory is owned by its own
      # service user, which lets that process replace the root-owned binary it runs.
      # Nothing here needs to write, so nothing here can.

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ pete_bot_binary_src }}"
        dest: "{{ pete_bot_bin }}"
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0750"
      notify: Restart pete-bot

    # ── The merge desk (PET-645) ─────────────────────────────────────────────────────
    # python3-yaml: the desk runs petedio-iac's pr-blast-radius.py, which parses workflows.
    # openssh-client: the desk queues Codex reviews over ssh to codex-248.
    # git: lab-agent reads its three clones with git (PET-670).
    - name: Install what the merge desk runs
      ansible.builtin.apt:
        name: [python3, python3-yaml, openssh-client, git]
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Create the configuration directory
      ansible.builtin.file:
        path: "{{ pete_bot_conf_dir }}"
        state: directory
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0750"
      # ⚠ Owned by root, readable by the service: the process can read its keys and can
      # replace none of them. The unit's ProtectSystem=strict makes /etc read-only anyway.

    # ⚠ THE KEY IS MADE HERE AND NEVER LEAVES 237. codex-248 authorizes its public half in
    # roles/codex's codex_review_gate_keys, under a forced command that runs only
    # `codex-review <repo> <n> <effort>` (PET-591). The play prints the public half below.
    - name: Generate the Codex queue key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -q -t ed25519 -N '' -C pete-bot-desk@media-dash-237
          -f {{ pete_bot_conf_dir }}/codex_ed25519
        creates: "{{ pete_bot_conf_dir }}/codex_ed25519"

    # In check mode the key above is predicted, not made. The tasks that read it skip a key
    # that doesn't exist yet in check mode, and fail on one that is missing in a real run.
    - name: Look for the Codex queue key
      ansible.builtin.stat:
        path: "{{ pete_bot_conf_dir }}/codex_ed25519"
      register: pete_bot_codex_key

    - name: Let the service read the Codex queue key
      ansible.builtin.file:
        path: "{{ pete_bot_conf_dir }}/codex_ed25519"
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0640"
      when: pete_bot_codex_key.stat.exists or not ansible_check_mode
      # ssh refuses a group-readable key only when the caller owns it. root owns this one.

    # ⚠ PINNED ON FIRST DEPLOY, NEVER RE-SCANNED. ssh runs with StrictHostKeyChecking=yes
    # against this file alone, so a changed host key on 248 stops the queue rather than
    # trusting the new one. After a planned rebuild of 248, delete the file and redeploy.
    # It runs only once the desk App is seeded, so an unseeded deploy never needs 248.
    - name: Pin codex-248's host key
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ssh-keyscan -T 5 -t ed25519 {{ pete_bot_codex_host }} 2>/dev/null
          > {{ pete_bot_conf_dir }}/codex_known_hosts.new
          && grep -q ssh-ed25519 {{ pete_bot_conf_dir }}/codex_known_hosts.new
          && chmod 0644 {{ pete_bot_conf_dir }}/codex_known_hosts.new
          && mv {{ pete_bot_conf_dir }}/codex_known_hosts.new {{ pete_bot_conf_dir }}/codex_known_hosts
        executable: /bin/bash
        creates: "{{ pete_bot_conf_dir }}/codex_known_hosts"
      when: pete_bot_desk_ready | bool

    - name: Install the desk's GitHub App key
      ansible.builtin.copy:
        content: "{{ pete_bot_desk_app_pem | trim }}\n"
        dest: "{{ pete_bot_conf_dir }}/desk-app.pem"
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0640"
      no_log: true
      when: pete_bot_desk_ready | bool
      notify: Restart pete-bot

    # ── lab-agent (PET-670) ──────────────────────────────────────────────────────────
    # Skipped as a whole until both lab-agent paths are seeded, so a deploy before the seed
    # changes nothing. Once it ran, a deploy without the values leaves lab-agent as it was.
    - name: Install lab-agent
      when: lab_agent_ready | bool
      # git run through runuser keeps root's HOME, which lab-agent cannot read. The unit sets
      # the same HOME, so the play's git and the service's git read the same config.
      environment:
        HOME: "{{ lab_agent_state_dir }}"
      block:
        - name: Create lab-agent's service account
          ansible.builtin.user:
            name: "{{ lab_agent_user }}"
            system: true
            # ssh takes ~ from the passwd entry, not from HOME, so both name the state dir.
            home: "{{ lab_agent_state_dir }}"
            create_home: false
            shell: /usr/sbin/nologin
            state: present

        # Owned by root and readable by the service, as pete-bot's are: the process can read
        # its keys and binary and replace none of them.
        - name: Create lab-agent's application and configuration directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: "{{ lab_agent_user }}"
            mode: "0750"
          loop:
            - "{{ lab_agent_dir }}"
            - "{{ lab_agent_conf_dir }}"

        # The unit's StateDirectory= makes the same directory at start. Making it here first
        # lets the clones below exist before lab-agent's first start.
        - name: Create lab-agent's state directory
          ansible.builtin.file:
            path: "{{ lab_agent_state_dir }}"
            state: directory
            owner: "{{ lab_agent_user }}"
            group: "{{ lab_agent_user }}"
            mode: "0700"

        - name: Install the lab-agent binary
          ansible.builtin.copy:
            src: "{{ lab_agent_binary_src }}"
            dest: "{{ lab_agent_bin }}"
            owner: root
            group: "{{ lab_agent_user }}"
            mode: "0750"
          notify: Restart lab-agent

        - name: Install the CAs lab-agent pins for Proxmox and Vault
          ansible.builtin.copy:
            content: "{{ item.pem | trim }}\n"
            dest: "{{ lab_agent_conf_dir }}/{{ item.name }}"
            owner: root
            group: "{{ lab_agent_user }}"
            mode: "0640"
          loop:
            - { name: pve-root-ca.pem, pem: "{{ lab_agent_pve_ca_pem }}" }
            - { name: vault-ca.pem, pem: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../environments/homelab/vault-ca.crt') }}" }
          loop_control:
            label: "{{ item.name }}"
          notify: Restart lab-agent

        # ⚠ root OWNS THE KEY, AND THE SERVICE ONLY READS IT. lab-agent signs a JWT with it
        # and asks GitHub for a one-hour token that reads petedio-vault and nothing else.
        - name: Install the mirror App's key
          ansible.builtin.copy:
            content: "{{ lab_agent_github_app_pem | trim }}\n"
            dest: "{{ lab_agent_github_key_file }}"
            owner: root
            group: "{{ lab_agent_user }}"
            mode: "0640"
          no_log: true
          notify: Restart lab-agent

        # ⚠ AN EMPTY REPOSITORY, NOT A CLONE. Only lab-agent can mint the vault's token, so
        # the play makes each repository and names its remote, and lab-agent's first fetch
        # fills it. It reads refs/remotes/origin/main only, so no checkout is ever needed.
        # As lab-agent, through runuser: `become_user` needs ACL tooling this LXC lacks. The
        # health check below fails the deploy when the vault's first fetch fails.
        - name: Create the three repositories lab-agent reads
          ansible.builtin.command:
            argv: [runuser, -u, "{{ lab_agent_user }}", --, git, init, --quiet, "{{ lab_agent_state_dir }}/{{ item.key }}"]
            creates: "{{ lab_agent_state_dir }}/{{ item.key }}/.git"
          loop: "{{ lab_agent_repos | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Point each repository at its GitHub remote
          ansible.builtin.command:
            argv:
              - runuser
              - -u
              - "{{ lab_agent_user }}"
              - --
              - git
              - -C
              - "{{ lab_agent_state_dir }}/{{ item.key }}"
              - config
              - remote.origin.url
              - "{{ item.value }}"
          loop: "{{ lab_agent_repos | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          changed_when: false

        # Read by systemd, as root, before it drops to the service account. So 0600 root.
        - name: Install lab-agent's environment file
          ansible.builtin.template:
            src: lab-agent.env.j2
            dest: "{{ lab_agent_env_file }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          notify: Restart lab-agent

        - name: Install lab-agent's systemd unit
          ansible.builtin.template:
            src: lab-agent.service.j2
            dest: /etc/systemd/system/lab-agent.service
            owner: root
            group: root
            mode: "0644"
          notify: Restart lab-agent

        - name: Enable and start lab-agent
          ansible.builtin.systemd_service:
            name: lab-agent
            enabled: true
            state: started
            daemon_reload: true

    - name: Install the environment file
      ansible.builtin.template:
        src: pete-bot.env.j2
        dest: "{{ pete_bot_env_file }}"
        owner: root
        group: "{{ pete_bot_user }}"
        mode: "0640"
      no_log: true
      notify: Restart pete-bot

    - name: Install the systemd unit
      ansible.builtin.template:
        src: pete-bot.service.j2
        dest: /etc/systemd/system/pete-bot.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart pete-bot

    - name: Enable and start pete-bot
      ansible.builtin.systemd_service:
        name: pete-bot
        enabled: true
        state: started
        daemon_reload: true

  post_tasks:
    - name: Flush handlers so the check below sees the new binary
      ansible.builtin.meta: flush_handlers

    - name: Wait for the HTTP surface to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ pete_bot_port }}/health"
        return_content: true
      register: pete_bot_health
      retries: 10
      delay: 2
      until: pete_bot_health.status is defined and pete_bot_health.status == 200

    # /health reports the gateway as off, misconfigured or on. With a key set, anything but
    # on means a bad setting or a binary older than the gateway, and the deploy fails here.
    - name: Prove the gateway is on when a key is set
      ansible.builtin.assert:
        that:
          - pete_bot_health.json is defined
          - pete_bot_health.json.llm | default('absent') == 'on'
        fail_msg: >-
          A key is set, but /health reports llm as
          {{ (pete_bot_health.json | default({})).llm | default('absent') }}. Absent means the
          binary predates the gateway. Misconfigured means a bad setting, and the journal
          names it: journalctl -u pete-bot | grep -i gateway.
      # Check mode skips the /health read, so its result has no json. Without the guard,
      # every `--check` run with a seeded key fails here, as the desk's check did (PET-645).
      when:
        - not ansible_check_mode
        - pete_bot_anthropic_api_key | default('') | length > 0

    # ⚠ /health only proves the process is up. This proves it reached DISCORD, which is
    # what a bad token, a revoked app or a network egress problem all break while /health
    # stays perfectly green.
    # ⚠ RETRY. /health answers the moment Express binds, which is milliseconds; the
    # Discord websocket handshake takes several seconds longer. Checking once right
    # after the health probe fails a deploy that is about to succeed — it did, by four
    # seconds, the first time this ran.
    #
    # ⚠ THIS PROCESS'S JOURNAL, NOT THE LAST THREE MINUTES. A `--since -3min` window also
    # holds the previous process's login line, so this passed the instant after a restart
    # and the desk read below ran before the new process had logged in (PET-617's first
    # gateway deploy, 2026-10-19). The invocation id names this start of the unit only.
    - name: Read the invocation id of the running pete-bot
      ansible.builtin.systemd_service:
        name: pete-bot
      register: pete_bot_unit
      failed_when: (pete_bot_unit.status.InvocationID | default('')) | length == 0
      when: not ansible_check_mode

    - name: Prove it is logged in to Discord, not merely running
      ansible.builtin.command:
        cmd: >-
          journalctl -u pete-bot _SYSTEMD_INVOCATION_ID={{ pete_bot_unit.status.InvocationID }}
          --no-pager -o cat
      when: not ansible_check_mode
      register: pete_bot_journal
      changed_when: false
      retries: 15
      delay: 2
      until: "'logged in as' in pete_bot_journal.stdout"
      failed_when: "'logged in as' not in pete_bot_journal.stdout"

    - name: Report what it logged in as
      ansible.builtin.debug:
        msg: "{{ pete_bot_journal.stdout_lines | select('search', 'logged in as') | list }}"

    # The desk starts after the Discord login, and /health says whether it came up. A
    # misconfigured desk leaves alerts working, so this fails the deploy, where someone
    # reads it, rather than leaving the reason only in /health.
    - name: Read the merge desk's state
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ pete_bot_port }}/health"
        return_content: true
      register: pete_bot_desk_health
      retries: 10
      delay: 2
      # A binary from before PET-645 reports no `desk`, and a deploy of one must still pass.
      # With the App seeded, `off` is also what the desk reports before startDesk runs, so
      # only `running` or `misconfigured` ends the wait.
      until: >-
        pete_bot_desk_health.json is defined
        and (pete_bot_desk_health.json.desk is not defined
             or pete_bot_desk_health.json.desk.state in
                (['misconfigured', 'running'] if (pete_bot_desk_ready | bool)
                 else ['off', 'misconfigured', 'running']))

    - name: Fail when the merge desk is misconfigured
      ansible.builtin.fail:
        msg: "The merge desk is misconfigured: {{ pete_bot_desk_health.json.desk.reason }}"
      when: (pete_bot_desk_health.json.desk.state | default('')) == 'misconfigured'

    # Check mode skips the /health read and restarts nothing, so the desk's state is
    # unknown there. Without the guard, every `--check` run with a seeded App fails here.
    - name: Fail when the desk App is seeded but the desk did not start
      ansible.builtin.fail:
        msg: >-
          The desk App is seeded, but the desk reports
          {{ pete_bot_desk_health.json.desk.state | default('nothing: this binary predates the desk') }}.
      when:
        - not ansible_check_mode
        - pete_bot_desk_ready | bool
        - (pete_bot_desk_health.json.desk.state | default('')) != 'running'

    # ⚠ EVERY DEPENDENCY, NOT ONLY THE PROCESS. lab-agent's /health answers 503 unless the
    # gateway, Proxmox, the vault clone, Kuma and Vault all answer, and names each one down.
    # A lab-agent that runs but cannot read the lab fails the deploy here.
    - name: Read lab-agent's health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lab_agent_port }}/health"
        return_content: true
        status_code: [200, 503]
      register: lab_agent_health
      retries: 15
      delay: 4
      until: lab_agent_health.status is defined and lab_agent_health.status == 200
      failed_when: false
      when:
        - not ansible_check_mode
        - lab_agent_ready | bool

    - name: Fail when a lab-agent dependency is down
      ansible.builtin.fail:
        msg: >-
          lab-agent's /health answered HTTP {{ lab_agent_health.status | default('nothing') }}:
          {{ (lab_agent_health.json | default({})).checks | default('no checks; read journalctl -u lab-agent') }}
      when:
        - not ansible_check_mode
        - lab_agent_ready | bool
        - (lab_agent_health.status | default(0)) != 200

    - name: Report lab-agent
      ansible.builtin.debug:
        msg: >-
          lab-agent:
          {{ ('every check up: ' ~ (lab_agent_health.json.checks | dict2items | map(attribute='key') | join(', ')))
             if (lab_agent_health.status | default(0)) == 200
             else ('off: kv/services/lab-agent and kv/services/lab-agent-pve are not both seeded'
                   if not (lab_agent_ready | bool) else 'not checked in check mode') }}

    - name: Read the Codex queue key's public half
      ansible.builtin.slurp:
        src: "{{ pete_bot_conf_dir }}/codex_ed25519.pub"
      register: pete_bot_codex_pub
      when: pete_bot_codex_key.stat.exists or not ansible_check_mode

    - name: Report the desk, and the key codex-248 must authorize
      ansible.builtin.debug:
        msg:
          - "merge desk: {{ pete_bot_desk_health.json.desk.state | default('not in this binary') }}"
          - >-
            codex_review_gate_keys entry:
            {{ (pete_bot_codex_pub.content | b64decode | trim) if pete_bot_codex_pub.content is defined
               else 'none yet: check mode predicted the key' }}

  handlers:
    - name: Restart pete-bot
      ansible.builtin.systemd_service:
        name: pete-bot
        state: restarted
        daemon_reload: true

    - name: Restart lab-agent
      ansible.builtin.systemd_service:
        name: lab-agent
        state: restarted
        daemon_reload: true
