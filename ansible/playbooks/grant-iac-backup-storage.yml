---
# grant-iac-backup-storage.yml — let the CI token manage the pve01 backup job (PET-884).
#
# WHY. With MANAGE_BACKUP_JOB on, every apply failed at proxmox_backup_job.pve01 with
# 403 "Permission check failed (/storage/ollama-backups, Datastore.Allocate)". The CI token
# `petedio@pam!iac` needs Datastore.Allocate on that one storage to create a job that writes there.
#
# SCOPE. One custom role, `IaCBackupStorage`, holding exactly Datastore.Allocate,
# Datastore.AllocateSpace and Datastore.Audit, granted to the token on `/storage/ollama-backups`
# and nowhere else. It adds no User.Modify, Permissions.Modify or Sys.Modify, so the token still
# cannot grant itself anything (see mint-pve-audit-token.yml for why that matters).
#
# HOW IT RUNS. Through lab-action.yml `playbook_apply`, which waits for Pedro's tap on the
# `lab-write` environment. The ACL is a node-side change, so Terraform cannot declare it.
#
# IDEMPOTENT. A re-run with the role and ACL present changes nothing. A check reports what it
# would add, because the two reads below run in check mode and the writes are skipped.
#
# After it applies, set manage_backup_job = true in environments/homelab/flags.auto.tfvars.

- name: Give the IaC token the backup-storage grant
  hosts: pve01
  become: true
  gather_facts: false
  vars:
    iac_token: "petedio@pam!iac"
    iac_role: IaCBackupStorage
    iac_privs: "Datastore.Allocate,Datastore.AllocateSpace,Datastore.Audit"
    iac_path: /storage/ollama-backups
  tasks:
    - name: Read the roles
      ansible.builtin.command: pveum role list --output-format json
      register: pve_roles
      changed_when: false
      check_mode: false  # lab-action: read-only
    - name: Read the ACLs
      ansible.builtin.command: pveum acl list --output-format json
      register: pve_acls
      changed_when: false
      check_mode: false  # lab-action: read-only

    - name: Work out what is missing
      ansible.builtin.set_fact:
        role_missing: "{{ (pve_roles.stdout | from_json | selectattr('roleid', 'equalto', iac_role) | list | length) == 0 }}"
        acl_missing: >-
          {{ (pve_acls.stdout | from_json
              | selectattr('path', 'equalto', iac_path)
              | selectattr('roleid', 'equalto', iac_role)
              | selectattr('ugid', 'equalto', iac_token) | list | length) == 0 }}

    - name: Create the role with exactly three privileges
      ansible.builtin.command: pveum role add {{ iac_role }} --privs "{{ iac_privs }}"
      when: role_missing | bool
      changed_when: true

    - name: Grant the role to the token on the one storage
      ansible.builtin.command: pveum acl modify {{ iac_path }} --roles {{ iac_role }} --tokens '{{ iac_token }}'
      when: acl_missing | bool
      changed_when: true

    - name: Say what was examined
      ansible.builtin.debug:
        msg: "role {{ 'added' if role_missing | bool else 'present' }}, ACL on {{ iac_path }} {{ 'added' if acl_missing | bool else 'present' }}"
