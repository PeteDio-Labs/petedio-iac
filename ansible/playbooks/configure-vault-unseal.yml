---
# configure-vault-unseal.yml — retire the Vault unseal watcher on pete-pi-1 (PET-373 undone by KMS).
#
# Vault on 223 unseals itself through AWS KMS (docs/runbooks/vault-kms-seal.md), so the Pi's
# five-minute timer has nothing to do. A Vault on an auto-seal cannot take a Shamir key as an
# unseal key; the key is a recovery key now. This play stops the timer and removes its unit,
# script and log. It leaves /etc/vault-unseal/unseal-key where it is: that file and the Mac
# Keychain item `vault-unseal-key` are the two copies of the recovery key, and the recovery key is
# what makes a new root token. Delete the Pi copy only after Pedro confirms a second copy exists
# somewhere that does not depend on the Mac.
#
# The play keeps its old file name so a runbook that names it still finds it. It is operator-run:
# the runner does not reach pete-pi-1 (PET-849).
#
#   cd ansible && ansible-playbook playbooks/configure-vault-unseal.yml --check --diff
#   cd ansible && ansible-playbook playbooks/configure-vault-unseal.yml

- name: Retire the Vault unseal watcher (pete-pi-1)
  hosts: pete_pi
  become: true
  tasks:
    - name: Stop and disable the unseal timer
      ansible.builtin.systemd_service:
        name: vault-unseal.timer
        enabled: false
        state: stopped
      register: vault_unseal_timer_off
      # A host that never had the timer reports "Could not find"; that is already the goal.
      failed_when: >-
        vault_unseal_timer_off.failed | default(false)
        and 'Could not find' not in (vault_unseal_timer_off.msg | default(''))

    - name: Remove the unseal units, script and log (the key copy stays)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/vault-unseal.timer
        - /etc/systemd/system/vault-unseal.service
        - /usr/local/bin/vault-unseal
        - /var/log/vault-unseal.log
      notify: Reload systemd

    - name: Reload systemd before the read-back
      ansible.builtin.meta: flush_handlers

    - name: Read the services systemd knows
      ansible.builtin.service_facts:

    - name: Require that the unseal timer is gone
      ansible.builtin.assert:
        that:
          - "'vault-unseal.timer' not in ansible_facts.services"
        fail_msg: "vault-unseal.timer is still known to systemd on {{ inventory_hostname }}."
        success_msg: "vault-unseal.timer is gone ({{ ansible_facts.services | length }} services read)."

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
