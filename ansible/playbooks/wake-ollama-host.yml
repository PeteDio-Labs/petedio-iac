---
# wake-ollama-host.yml — wake pve01 (192.168.50.12) with a Wake-on-LAN magic packet. (PET-528)
#
# The machine at .12 was the ollama-host and is now the Proxmox node pve01, which holds both
# GPUs and CT 246. The file keeps its old name so a runbook that cites it still finds it.
# Run it from the Mac-local control node when the node is powered off.
#
# Requirements:
#   - WoL enabled in BIOS (Power Management -> Wake on LAN)
#   - Control node on the same LAN segment (192.168.50.0/24)
#   - wakeonlan tool installed on the control node
#
# Usage:
#   ansible-playbook playbooks/wake-ollama-host.yml
#   ansible-playbook playbooks/wake-ollama-host.yml --tags wait   # also wait until SSH is up

- name: Wake pve01 (.12) via WoL magic packet
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_mac: "2c:f0:5d:a2:7f:4f"
    target_ip: "192.168.50.12"
    broadcast_ip: "192.168.50.255"
    ssh_timeout_seconds: 120

  tasks:
    - name: Ensure wakeonlan is installed
      ansible.builtin.apt:
        name: wakeonlan
        state: present
      become: true

    - name: Send magic packet to {{ target_mac }}
      ansible.builtin.command: wakeonlan -i {{ broadcast_ip }} {{ target_mac }}
      changed_when: true

    - name: Magic packet sent
      ansible.builtin.debug:
        msg: "Magic packet sent to {{ target_mac }} (broadcast {{ broadcast_ip }}). Give the machine ~30s to POST."

    - name: Wait for pve01 SSH to become available
      ansible.builtin.wait_for:
        host: "{{ target_ip }}"
        port: 22
        timeout: "{{ ssh_timeout_seconds }}"
        delay: 10
        state: started
      tags: wait

    - name: Confirm pve01 is up
      ansible.builtin.debug:
        msg: "pve01 ({{ target_ip }}) is online."
      tags: wait
