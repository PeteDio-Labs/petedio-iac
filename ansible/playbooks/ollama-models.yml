---
# Pull the base Ollama models onto ollama-246 and keep the resident ones loaded.
# The declared list is ollama_base_models in inventory/host_vars/ollama-246.yml.
# configure-ollama-246.yml imports this play after ollama-service.yml.
#
# Usage:
#   ansible-playbook playbooks/ollama-models.yml

- name: Deploy Ollama base models
  hosts: ollama
  become: true
  roles:
    - ollama-models
