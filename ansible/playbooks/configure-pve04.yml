---
# configure-pve04.yml — make the former ollama-host a working GPU node. (PET-528)
#
# Run it after Pedro has installed Proxmox VE 9 on the 128 GB drive and joined pve04 to
# the cluster. docs/runbooks/pve04-cutover.md is the whole sequence; this is its node
# step. No workflow applies it on merge. Run from ansible/:
#
#   ansible-playbook playbooks/configure-pve04.yml --check
#   ansible-playbook playbooks/configure-pve04.yml -e nvidia_driver_sha256=<sha> -e nvidia_driver_allow_reboot=true
#
# WHAT IT DOES, in order. Each step fails the run rather than skipping silently.
#   1. Asserts pve04 is a quorate member of the cluster. A node that never joined would
#      otherwise take a template and a driver and look finished.
#   2. Swaps the ISO's enterprise repositories for no-subscription, as roles/pve-node does
#      on pve03, so apt works without a subscription key.
#   3. Puts the LXC template Terraform pins onto pve04's own `local` store. Templates are
#      per node, and a create against a missing one fails after the merge (usaa.tf).
#   4. Installs the pinned NVIDIA driver with DKMS (roles/nvidia-driver, host mode) and
#      asserts both cards answer with the UUIDs the Ollama lanes pin.
#   5. When CT 246 exists, passes the device nodes into it (roles/lxc-gpu). Before the
#      Terraform PR applies, it reports that 246 is missing and stops there.
#
# The backup store and the WD disk have their own plays: configure-backup-store.yml and
# configure-wd-disk.yml, both retargeted to pve04.

- name: Configure pve04
  hosts: pve04
  become: true

  vars:
    pve04_template: debian-13-standard_13.6-1_amd64.tar.zst
    pve04_template_source_node: 192.168.50.10   # pve03 carries it (usaa.tf)

  pre_tasks:
    - name: Read the cluster membership
      ansible.builtin.command: pvecm status
      register: pve04_pvecm
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert pve04 joined a quorate cluster of three nodes
      ansible.builtin.assert:
        that:
          - pve04_pvecm.rc == 0
          - pve04_pvecm.stdout is search('Quorate:\s+Yes')
          - pve04_pvecm.stdout is search('Nodes:\s+3')
        fail_msg: >-
          pve04 is not a quorate member of a three-node cluster. Finish the join first
          (docs/runbooks/pve04-cutover.md, step C). pvecm status said:
          {{ pve04_pvecm.stdout_lines | default([]) | select('search', 'Quorate|Nodes|Expected') | list }}

  tasks:
    - name: Disable the enterprise repositories
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: "^Enabled:"
        line: "Enabled: false"
        insertafter: EOF
        create: false
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources
      failed_when: false

    - name: Add the no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: "0644"
        content: |
          # Managed by ansible playbook configure-pve04.yml (PET-528).
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Refresh apt
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Check for the LXC template
      ansible.builtin.stat:
        path: "/var/lib/vz/template/cache/{{ pve04_template }}"
      register: pve04_template_stat

    # pveam's index carries only the newest build of each template, so a pinned older
    # name may no longer download. Cluster members trust each other's root key, so the
    # copy from pve03 always works once pve04 has joined.
    - name: Copy the template from pve03
      when: not pve04_template_stat.stat.exists
      ansible.builtin.command: >-
        scp -o BatchMode=yes
        root@{{ pve04_template_source_node }}:/var/lib/vz/template/cache/{{ pve04_template }}
        /var/lib/vz/template/cache/{{ pve04_template }}
      changed_when: true

    - name: Install the NVIDIA driver on the node
      ansible.builtin.include_role:
        name: nvidia-driver
      vars:
        nvidia_driver_mode: host
        nvidia_driver_expected_uuids:
          - "{{ hostvars['ollama-246']['ollama_coder_gpu'] }}"
          - "{{ hostvars['ollama-246']['ollama_gemma_gpu'] }}"

    - name: Check whether CT 246 exists yet
      ansible.builtin.command: pct status 246
      register: pve04_ct246
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Pass both GPUs into CT 246
      when: pve04_ct246.rc == 0
      ansible.builtin.include_role:
        name: lxc-gpu
      vars:
        lxc_gpu_containers:
          - vmid: 246
            devices: "{{ lxc_gpu_nvidia_devices }}"

    - name: Report a missing CT 246
      when: pve04_ct246.rc != 0
      ansible.builtin.fail:
        msg: >-
          The node is ready, but CT 246 does not exist yet, so no GPU was passed through.
          Merge the Terraform PR that declares ollama-246, let apply-on-merge create it,
          then run this play again.
