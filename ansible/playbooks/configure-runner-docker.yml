---
# configure-runner-docker.yml — install Docker CE on the self-hosted GitHub Actions
# runner (LXC 232) so app CI can build images + use service containers. (PET-79)
#
# The runner (runner-232, configured out-of-band from the ported github-runner.yml)
# runs terraform/ansible fine, but the Co-latro backend CI needs Docker on the runner:
# a `services: postgres` container for tests + `docker build/push` for the image. The
# runner landed jobs with `docker: command not found` until this ran.
#
# ⚠ THIS PLAY USED TO ASSERT nesting=1,keyctl=1 IN THIS COMMENT, AND THE COMMENT WENT
# STALE. It read "LXC 232 already has nesting=1,keyctl=1 (verified)". The container was
# rebuilt in PET-335, the flags did not come back, and the sentence kept saying they had.
# Docker installed fine and every image pull failed with
# `mount source: "overlay" ... permission denied` (PET-364).
#
# Terraform cannot own those flags — Proxmox enforces a hardcoded root@pam check on the
# features{} mutation, so bpg/proxmox creates the container without them and keeps them
# in ignore_changes. That is deliberate and permanent, which means NOTHING declarative
# will ever notice they are missing. The play therefore CHECKS, and fails loudly with
# the fix, rather than restating an assumption in prose. A comment is not a check.
#
# The `runner` user is added to the docker group so workflow steps (which run as that
# user) can talk to the daemon without sudo.
#
# Inventory: the `runner` group → 192.168.50.232, root over the TF-installed key.

- name: Install Docker on the GitHub Actions runner (LXC 232)
  hosts: runner
  become: true

  vars:
    runner_user: runner

  tasks:
    - name: Install prerequisites for the Docker apt repo
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Add the Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /usr/share/keyrings/docker-archive-keyring.asc
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/docker-archive-keyring.asc]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker CE + buildx (the app CI uses buildx for cross-arch builds)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # Workflow steps run as the runner user; group membership lets them use the daemon
    # socket without sudo. Requires the runner service to restart to pick up the new
    # group — handled below so a fresh job sees docker immediately.
    - name: Add the runner user to the docker group
      ansible.builtin.user:
        name: "{{ runner_user }}"
        groups: docker
        append: true
      notify: Restart the actions runner

  post_tasks:
    # ⚠ THE CHECK THIS PLAY WAS MISSING, AND WHY IT IS A RUN AND NOT A GREP.
    #
    # Installing Docker proves nothing. On an unprivileged LXC without
    # `features: nesting=1,keyctl=1` the daemon installs cleanly, starts cleanly, reports
    # healthy — and cannot mount overlayfs, so every image pull dies with
    # `mount source: "overlay" ... permission denied`. runner-232 sat exactly like that
    # after its PET-335 rebuild, while Terraform planned clean, the org runner API said
    # "online", and this file asserted the flags in a comment (PET-364).
    #
    # Running a container exercises the real path — the extract on pull and the rootfs
    # mount on start — which is the only thing that distinguishes "Docker is installed"
    # from "Docker works". hello-world is a few kilobytes.
    - name: Prove Docker can actually run a container, not just that it installed
      ansible.builtin.command:
        cmd: docker run --rm hello-world
      register: runner_docker_probe
      changed_when: false
      failed_when: false

    - name: Fail with the remedy when the container could not run
      ansible.builtin.fail:
        msg: >-
          Docker is installed on {{ inventory_hostname }} but cannot run a container.
          Almost always this LXC is missing 'features: nesting=1,keyctl=1' — an
          unprivileged container cannot mount overlayfs without them, and Terraform
          cannot set them because Proxmox rejects the features{} mutation for API
          tokens (it is kept in ignore_changes on purpose, so no plan will ever show
          this). Fix: run scripts/lxc-features-232.sh from the repo root, which sets
          the flags on the node as root@pam and reboots the container. See PET-364.
          Docker said: {{ (runner_docker_probe.stderr | default(''))[:400] }}
      when: runner_docker_probe.rc != 0

    - name: Report that the runner can build
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: docker can pull and run containers."

  handlers:
    # The runner service caches the process group set at start; restart so jobs pick up
    # docker-group membership. The unit name follows the actions/runner svc.sh convention.
    - name: Restart the actions runner
      ansible.builtin.shell: |
        set -o pipefail
        set -e
        svc=$(systemctl list-units --type=service --all --no-legend 'actions.runner.*' \
              | awk '{print $1}' | head -1)
        if [ -n "$svc" ]; then systemctl restart "$svc"; else echo "no runner svc found"; fi
      args:
        # `set -o pipefail` is a bashism. Ansible's shell module runs /bin/sh, which on
        # Debian is dash -> "Illegal option -o pipefail" (hit for real on runner-233's
        # first provision). Same fix already carried by configure-palworld-panel.yml,
        # configure-resume-builder.yml and configure-plane.yml.
        executable: /bin/bash
      changed_when: true
