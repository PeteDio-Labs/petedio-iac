# pve-media — the media NAS node (MED-6), STAGED OUTSIDE ansible/inventory/ on purpose.
#
# ⚠ ansible.cfg loads the whole inventory/ directory, and a host in any file there joins
# `all`. Plays that target `all` then try the unbuilt node: collect-cve-inventory.yml
# refuses to replace the live snapshot when any host is unreadable, and
# configure-ssh-ca.yml targets `all`. So this file lives here, where nothing loads it.
# Phase 1 of docs/runbooks/three-machine-split.md moves it to ansible/inventory/ once the
# node answers SSH. Until then, load it by hand:
#   ansible-playbook -i inventory/ -i planned/pve-media.yml <playbook> --limit pve-media
#
# WHAT THIS MACHINE IS. A Jonsbo N5 tower NAS at 192.168.50.13 that takes all of media
# (docs/runbooks/three-machine-split.md, phase 1). It does not exist until build day, so
# nothing here has been checked against hardware.
#
# ⚠ ITS OWN GROUP, pve_media, AND NO PLAYBOOK NAMES IT, except the mesh bridge play via -e. Many plays target `pve_new` or
# `pve_gpu` (configure-pve-node.yml, configure-media-split.yml, configure-lxc-features.yml
# and others). Putting this host in either group would point those plays at a machine
# that has no Proxmox yet. On build day, add `pve_media` to one play at a time, in the
# order the runbook gives, and read each `--list-hosts` first. `--limit pve-media` also
# works for a play whose `hosts:` pattern already matches.
#
# ⚠ THE MESH NIC IS UNSET ON PURPOSE. mesh_usb_interface must name the PCIe i226 port
# once the card is fitted (`ip -br link` on the node). The mesh-usb-bridge role fails
# with the list of interfaces it found if the name does not exist, so a stale
# placeholder cannot produce a bridge on nothing.
#
# Reachability on first boot depends on the cluster's shared authorized_keys, as for
# pve01: `pvecm add` copies /etc/pve/priv/authorized_keys onto the node.
---
all:
  children:
    pve_media:
      hosts:
        pve-media:
          ansible_host: 192.168.50.13
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
          # Phase 1 sets this to the real LAN port. The N5 board is not a laptop.
          pve_node_lan_interface: ""
          pve_node_address: 192.168.50.13/24
          pve_node_gateway: 192.168.50.1
          pve_node_is_laptop: false
          # Plex's only address rides this bridge (plex-gpu 236 on the .86 mesh).
          mesh_usb_bridge: vmbr2
          mesh_usb_interface: ""
