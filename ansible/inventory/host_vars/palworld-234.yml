---
# palworld-234 — the Palworld game host, back in an LXC on pve03 (PET-381).
#
# It replaces palworld-mc, which was not decommissioned so much as CONSUMED: that host was
# the ex-mission-control HP Spectre at 192.168.86.234, and it was wiped and rebuilt as
# pve03 itself on 2026-09-04 after pve01 died. The game lost its machine to the rack
# rebuild. Terraform owns this container (environments/homelab/palworld.tf).
#
# ⚠ PLAYERS DO NOT USE THIS ADDRESS. Clients connect to pve03's mesh address,
# 192.168.86.244, and pve03 translates to 192.168.50.234 here. roles/palworld-mesh-nat
# carries the whole explanation, including why the old .234 was not chased.

# A container, not bare metal: no lid to close, so no sleep targets to mask and no logind
# drop-in to write. (palworld-mc needed both — it was a laptop.)
palworld_baremetal: false

# Play traffic arrives NATted, so from the container's side every player is on .50. This
# rule is what admits them; it is not merely the admin path.
palworld_lan_ingress_enabled: true

# ⚠ The world is restored from MinIO, not generated. DedicatedServerName is pinned in
# group_vars/palworld.yml to 0BA20FE97DF7472AADFD2237B5B4EFFC, and that pin is the whole
# defence against the failure the machine note calls out: a host that ever generated a
# world of its own boots THAT one, ignores the restore, and comes up fully green on an
# empty map. After any restore or restart the check that counts is worldguid from
# /v1/api/info — days:0 / basecampnum:0 means a fresh world, so stop before it writes.

# ⚠ CLOUDFLARE PUBLISHES NO `trixie` DIST, AND THIS CONTAINER IS DEBIAN 13.
# roles/cloudflared defaults cloudflared_apt_release to ansible_distribution_release, which
# is correct almost everywhere and wrong here: the old game host was Pop!_OS 24.04 and
# resolved to `noble`, which exists. Debian 13 resolves to `trixie`, which does not, and
# apt fails with "does not have a Release file" — an error that reads like a broken mirror
# rather than an unpublished suite.
#
# Checked against the repo on 2026-09-10:
#     trixie 404 · bookworm 200 · bullseye 200 · noble 200 · jammy 200
#
# bookworm is the newest published Debian suite. cloudflared ships as a static Go binary,
# so the suite gates which repo index apt reads rather than what gets linked.
#
# The role's own comment asks for exactly this: "pin it here so a distro that reports
# something Cloudflare doesn't publish is an obvious one-line override rather than a
# confusing 404 from apt."
cloudflared_apt_release: bookworm
