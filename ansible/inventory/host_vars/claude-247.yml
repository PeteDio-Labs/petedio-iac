---
# claude-247 — Claude Code, Remote Control and the ticket-driven work loop (PET-396, PET-399).
# Terraform owns the container (environments/homelab/claude.tf); roles/claude-code owns
# everything inside it.

# ⚠ REMOTE CONTROL IS DECLARED HERE, NEVER PASSED WITH -e (PET-431). The role's default is
# `false`, and `false` stops AND disables the servers. The bootstrap used to pass
# `-e claude_remote_enable=true` once, so the next run without the flag — a
# deploy-claude-247.sh run on 2026-09-12 — stopped this host's server.
#
# Declaring it does not start a server before one can serve. The role first checks for the
# one-time consent that `claude remote-control` asks for; without it, the play leaves the
# units alone and fails at the end with the step to take. roles/claude-code/README.md has
# the full bootstrap.
claude_remote_enable: true

# petedio-workspace is private. The play delivers it through a root-owned bare mirror that
# fetches over a GitHub App token, Contents and Metadata read-only, installed on that one
# repository (PET-480, PET-481, re-routed by PET-493).
#
# ⚠ THIS WAS A DEPLOY KEY AND THE KEY COULD NEVER HAVE WORKED. PeteDio-Labs disallows deploy
# keys for every repository it owns — `gh api orgs/PeteDio-Labs --jq
# .deploy_keys_enabled_for_repositories` is false — so the key PET-481's run generated on this
# host is one GitHub would have refused. Do not go back to a key to make a red run green.
#
# ONE RUN, NOT TWO. The App is authorized before Ansible starts, so the run that carries the
# identity mirrors the repo and clones the session's copy. Run scripts/deploy-claude-247.sh,
# which reads kv/services/claude-workspace-mirror from Vault; a bare play run leaves the
# credentials alone and delivers from what is already on disk. roles/claude-code/README.md
# has the design, the trust step and the rotation.
claude_workspace_mirror_enable: true

# petedio-vault is private, and a session here CLONES it and PUSHES notes to its `main`
# (PET-498). Pedro approved the direct push: vault `main` carries no branch protection, and
# the Obsidian Git plugin already auto-pushes to it every 10 minutes from the Mac.
#
# ⚠ DECLARED HERE FOR THE SAME REASON claude_remote_enable IS. The role's default is `false`,
# so a deploy run without this line would stop delivering the clone.
#
# ⚠ A SESSION CAN READ THIS WRITE CREDENTIAL, AND THE CODE-PUSH ONE BELOW, AND ITS SHAPE IS
# INVERTED FROM THE MIRROR ABOVE ON PURPOSE. The mirror's key is 0400 root behind a 0500
# root broker because ROOT fetches. Here the SESSION pushes, so the key is 0400 claude in the
# session user's home — and every process running as `claude` on this host can therefore push
# to petedio-vault, the work loop's `claude -p` included if claude_loop_enable is ever set.
# File modes cannot narrow that; they would be keeping out the user the design hands the key
# to. What bounds it is the App: one installed repository, contents:write and metadata:read,
# no pull-request rights, so it cannot reach petedio-iac and cannot act as Pedro.
#
# Run scripts/deploy-claude-247.sh, which reads kv/services/claude-vault-push from Vault; a
# bare play run leaves the clone as it found it. roles/claude-code/README.md has the design,
# the trust step and the rotation.
claude_vault_enable: true

# A session here pushes branches to petedio-iac, petedio-media-iac and petedio-workspace and
# opens pull requests on them (PET-507), so 247 implements instead of handing work to the Mac.
#
# ⚠ DECLARED HERE FOR THE SAME REASON claude_vault_enable IS. The role's default is `false`.
#
# ⚠ THE SHAPE IS THE VAULT'S, WIDENED TO THREE REPOSITORIES. The key is 0400 claude, so every
# process running as `claude` can push to those three and open pull requests on them. What
# bounds it is the App: contents:write, pull_requests:write and metadata:read, no `workflows`
# permission, and a `main` on each that requires a review the App cannot give. So a session
# pushes and opens pull requests, and Pedro still decides every merge.
#
# Run scripts/deploy-claude-247.sh, which reads kv/services/claude-code-push from Vault; a
# bare play run lands no key, and configures the clones only once one is on disk. roles/claude-code/README.md has
# the design and the rotation.
claude_code_push_enable: true

# terraform, ansible-core, ansible-lint and shellcheck at the CI pins (PET-508), so a session
# here verifies the IaC it writes instead of handing it to the Mac. The role's default is
# `false`; declared here so every deploy run keeps the toolchain converged.
claude_iac_tools_enable: true

# A session here reads the Proxmox API as claude-247@pve!audit, PVEAuditor on / (PET-510), so
# it checks the cluster's state itself instead of asking the Mac. The role's default is
# `false`; declared here so every deploy run keeps the token converged.
#
# Run scripts/deploy-claude-247.sh, which reads kv/services/claude-247-pve from Vault; a bare
# play run lands no token. playbooks/mint-claude-247-pve.yml mints it, once, from the Mac.
claude_pve_audit_enable: true
