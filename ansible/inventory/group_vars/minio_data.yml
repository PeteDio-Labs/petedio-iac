---
# group_vars for minio_data (LXC 245 / 192.168.50.245) — the app-data MinIO.
#
# THIS FILE IS THE BUCKET REGISTRY for app data. Adding a bucket to the homelab means
# adding an entry below and re-running configure-minio-data.yml — not touching .221 (the
# Terraform state backend), and not touching roles/minio/defaults/main.yml (whose default
# is .221's single `tfstate` bucket and must stay that way).
#
# No secrets here. Root credentials come from Vault kv/iac/minio-data-root and are passed
# as a no_log extra-var at runtime by scripts/deploy-minio-data.sh.

minio_service_description: "MinIO (app data, LXC 245)"

minio_buckets:
  # obsidian-fs-mcs — backs Obsidian vault sync for the FS MCS coursework vault across
  # Pedro's Mac / iPhone / iPad / PC, via the Remotely Save plugin speaking S3 to
  # http://192.168.50.245:9000 over the tailnet. Setup: docs/runbooks/obsidian-vault-sync.md.
  #
  # Versioning (enabled by the role for every bucket) is the ONLY recovery net here — the
  # vault is deliberately not git-backed, so a bad sync that deletes notes is undone from
  # object versions. Do not suspend it.
  #
  # The quota is a guardrail, not a capacity plan: the vault is ~240 KB today, and 5 GiB
  # is far more headroom than course notes plus attachments need, while still bounding a
  # runaway sync loop well inside the host's 16 GiB root disk.
  - name: obsidian-fs-mcs
    quota_bytes: 5368709120 # 5 GiB

  # plane — attachments for the Plane tracker on LXC 235 (plane.tf). Reached over the
  # LAN from 235 itself and over the tailnet from browsers; NEVER publicly, which is
  # what lets this stay a plain http:// endpoint with no CORS policy and no Cloudflare
  # route. Versioning (enabled by the role for every bucket) is the recovery net for a
  # deleted attachment; it is not a backup, and it does not survive losing 245.
  #
  # 20 GiB: an issue tracker's attachments are screenshots and logs, not media. The
  # quota bounds a runaway upload well inside the host's 16 GiB root disk plus headroom.
  - name: plane
    quota_bytes: 21474836480 # 20 GiB

  # usaa-statements — six years of bank statements (2020-06 to 2026-07) and the SQLite
  # database built from them, for the pipeline in the usaa project (PET-392/393).
  #
  # ⚠ THIS BUCKET IS THE ONLY COPY BUT ONE. The source lives in a single directory, and
  # git is deliberately not its safety net: usaa/.gitignore excludes *.pdf, *.db and
  # data/ because petedio-iac is public and financial data never gets committed. That
  # rule is right and stays, so the whole recovery story is this bucket plus the disk it
  # was uploaded from. Versioning (enabled by the role for every bucket) is what makes a
  # bad re-ingest or an accidental `mc rm` recoverable.
  #
  # NEVER publicly reachable, and no Cloudflare route — 245 is LAN and tailnet only.
  # A statement carries an account number and an address; treat a public endpoint here
  # as a data-loss event of a different kind.
  #
  # 2 GiB against ~50 MiB today: statements arrive about a dozen a year and are a few
  # hundred KiB each, so this is decades of headroom while still bounding a runaway
  # ingest well inside the host's root disk.
  - name: usaa-statements
    quota_bytes: 2147483648 # 2 GiB
