# Ported from homelab-infra for the greenfield petedio-iac.
# Dual-GPU (GTX 1660 SUPER + RTX 3060 Ti), .12.
# Trimmed to what the ollama plays need. pve01/pve02 double as an optional
# recovery jump path (see ansible.cfg) AND, since PET-311, as managed hosts for
# configure-media-share.yml.
---
all:
  children:
    ollama:
      hosts:
        ollama-host:
          ansible_host: 192.168.50.12  # Ollama native host (renumbered .59 -> .12)

    # The cluster nodes themselves. These were long kept here only as a recovery
    # jump path, but configure-media-share.yml (PET-311) now manages the NFS
    # export of /mnt/media from pve01 to pve02, so they are managed hosts.
    # ORDER IS LOAD-BEARING for that play (serial: 1): pve01 exports, then pve02
    # mounts. Do not reorder.
    proxmox:
      vars:
        ansible_user: root
      hosts:
        # ⚠ pve01 IS GONE, and its address was REASSIGNED.
        #
        # Its RAID controller failed on 2026-09-03 and the node was removed from
        # the cluster. 192.168.50.10 now belongs to pve03. An entry named pve01
        # pointing there does not fail — it silently applies pve01's role to the
        # arr node. configure-media-share.yml would have installed pve01's NFS
        # exports onto it.
        #
        # Removed rather than repointed: nothing should target a host by that
        # name again. pve03 has its own inventory file on purpose, so editing it
        # does not re-trigger the playbooks watching this one.
        pve02:
          ansible_host: 192.168.50.11  # Secondary Proxmox server — Quick Sync iGPU

    # vault (LXC 223) + postgres (LXC 231) — TF-created LXCs that Ansible
    # configures post-create (configure-vault.yml / configure-postgres.yml).
    # Connection vars are scoped per-group (not all.vars) so the ollama/proxmox
    # hosts keep their own settings. root over the SSH key Terraform installs
    # (var.ssh_public_key) — the ansible-automation key (= LXC_SSH_PUBLIC_KEY).
    vault:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        vault-223:
          ansible_host: 192.168.50.223

    postgres:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        postgres-rds-231:
          ansible_host: 192.168.50.231

    # poker-api (LXC 230) — Co-latro Docker host, configured by configure-poker-api.yml
    # (PET-44). TF-created LXC; Ansible installs Docker + nginx + the systemd unit.
    poker-api:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        poker-api-230:
          ansible_host: 192.168.50.230

    # runner — self-hosted GitHub Actions runners (org-scoped to PeteDio-Labs). TF owns the
    # LXCs; Docker is installed by configure-runner-docker.yml (PET-79) so app CI can build
    # images + use service containers. (Runner registration itself is out-of-band.)
    #   ONE RUNNER PER HOST (PET-335): runner-233 → pve02, runner-232 → pve03, plus the
    #   arm64 runner on pete-pi-1. Losing any one node leaves x64 CI running. Both x64
    #   runners briefly shared pve03 after PET-334 and that is the state to avoid — pve03
    #   also holds Vault and the Terraform state, so CI would go down with the thing it is
    #   needed to repair. lab-verify asserts the spread.
    #   `configure-runner.yml` provisions and registers; use `--limit <host>` for one box.
    runner:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        runner-232:
          ansible_host: 192.168.50.232
        runner-233:
          ansible_host: 192.168.50.233

    # plane (LXC 235) — self-hosted Plane CE, the tracker replacing Linear (plane.tf).
    # A Docker Compose host: TF creates the LXC, scripts/lxc-features-235.sh sets
    # nesting=1,keyctl=1 out-of-band on the node (root@pam), then configure-plane.yml
    # installs Docker + the compose stack. Its database is the `plane` database on
    # postgres-231 and its attachments live in the `plane` bucket on minio-data-245, so
    # this host holds no durable state of its own beyond the compose files.
    # TAILNET-ONLY by design — there is deliberately no cloudflare-routes.tf entry.
    plane:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        plane-235:
          ansible_host: 192.168.50.235

    # tailscale (LXC 244) — Tailscale subnet router advertising the whole LAN
    # (192.168.50.0/24) into the tailnet, configured by configure-tailscale.yml (PET-188).
    # TF-created LXC; scripts/lxc-tun-244.sh adds /dev/net/tun out-of-band on the node
    # (root@pam), then Ansible installs tailscale + enables forwarding + `tailscale up`.
    # No secrets in inventory: the auth key is Vault kv/services/tailscale, passed as an
    # -e extra-var at runtime. See roles/tailscale-router/README.md.
    tailscale:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        tailscale-244:
          ansible_host: 192.168.50.244

    # registry (LXC 106 / .111) — the OCI registry behind docker.pdlab.dev, running
    # zot v2.1.3 on :443. NOT Nexus: that was removed on 2026-08-11, and
    # registry.pdlab.dev retired with its web UI. Captured into TF as module.registry
    # (PET-122, renamed PET-301). It is a community-scripts Docker LXC; the blob store
    # is an NFS-backed bind mount (mp0 /mnt/pete/nexus-data -> /nexus-data) — load-bearing,
    # never disrupt. Those paths and the host key below still say nexus because renaming
    # them takes the registry offline; that is paired with the pve02 storage reshape.
    # The host-level config (features/idmap/mount) is out-of-band on the node, not
    # Ansible-managed. Configured by configure-registry.yml.
    # See PET-122 / docs/runbooks/registry-import.md.
    registry:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        nexus-registry:
          ansible_host: 192.168.50.111

    # minio (LXC 221) — the Terraform S3 STATE BACKEND. HAND-MANAGED by design: NO TF
    # resource ever (TF can't create the host that stores TF state — see
    # environments/homelab/minio-state-backend.tf). Config-as-code only, via
    # configure-minio.yml (PET-124); rebuild runbook: docs/runbooks/minio-221-rebuild.md.
    # No secrets in inventory — MinIO root creds come from Vault kv/iac/minio-root,
    # passed as a no_log extra-var (see the playbook header).
    minio:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        minio-221:
          ansible_host: 192.168.50.221

    # minio_data (LXC 245) — the APP-DATA MinIO, and the opposite of .221 above: it is
    # TF-created (environments/homelab/minio-data.tf), because nothing in its own
    # lifecycle depends on it, so the bootstrap circularity that keeps .221 hand-managed
    # simply doesn't apply. Same `minio` role, different bucket list.
    # First tenant: the `obsidian-fs-mcs` bucket backing Obsidian vault sync over the
    # tailnet (docs/runbooks/obsidian-vault-sync.md). Buckets are declared in
    # group_vars/minio_data.yml — new app buckets go THERE, never on .221.
    # No secrets in inventory — root creds come from Vault kv/iac/minio-data-root,
    # passed as a no_log extra-var by scripts/deploy-minio-data.sh.
    minio_data:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        minio-data-245:
          ansible_host: 192.168.50.245

    # authentik (LXC 119 / .119) — live SSO/LDAP behind auth.pdlab.dev. Brownfield-captured
    # into TF as module.authentik (PET-123) before the legacy state retires (PET-50). An
    # Ubuntu Docker LXC; features (nesting/keyctl) are out-of-band on the node, not
    # Ansible-managed. MAXIMALLY SENSITIVE: an SSO/LDAP outage breaks every downstream
    # login — config-match only, never disrupt. NOTE: the in-guest "match the running
    # Authentik service" play is NOT authored yet — it needs in-container truth the loop
    # can't obtain (SSH-into-guest is forbidden) and the app secrets live in Vault .223;
    # see PET-123 / docs/runbooks/authentik-import.md. This entry is the home for that
    # capture once an operator supplies that truth.
    authentik:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        authentik-119:
          ansible_host: 192.168.50.119

    # ⚠ palworld and openfaas are NOT here on purpose. They live in
    # inventory/palworld.yml and inventory/openfaas.yml, loaded by ansible.cfg
    # alongside this file. Their workflows watch their own inventory under
    # push.paths, so keeping them out of this shared file stops an unrelated edit
    # here from redeploying a live game server or faasd (PET-302). pete_pi is
    # split the same way, for the same reason. Add a new group here only if no
    # apply-on-merge workflow watches it.
