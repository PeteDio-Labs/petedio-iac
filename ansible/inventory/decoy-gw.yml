---
# decoy-gw-214 — the gateway for the Lab Villains decoys (PET-954). Its own file, like staging.yml,
# so an unrelated edit to hosts.yml cannot reapply it. ansible.cfg loads the whole inventory/ directory.
# The decoys themselves are not here: Ansible never reaches them, and the villain plays act through `pct`.
all:
  children:
    decoy_gw:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        decoy-gw-214:
          ansible_host: 192.168.50.214
