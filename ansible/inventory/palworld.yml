# palworld — a SEPARATE inventory source, deliberately not part of hosts.yml.
#
# WHY ITS OWN FILE. ansible-palworld.yml watches its inventory under push.paths,
# so every edit to the file holding this group re-applies configure-palworld.yml
# on merge. While that file was hosts.yml, a one-line comment fix anywhere in the
# shared inventory revalidated 12-15 GB of SteamCMD binaries on the live game
# host the family plays on. Splitting the group out means only a real change to
# THIS group can trigger that apply (PET-302).
#
# palworld — the Palworld 1.0 dedicated game server + co-located control panel, fully
# provisioned by configure-palworld.yml (PET-157) and configure-palworld-panel.yml
# (PET-266): SteamCMD + steam user + server binaries (app 2394010) + a systemd unit
# enabled & started. Applied on merge by the ansible-palworld.yml workflow. Ran on LXC
# 234 until the PET-266 cutover moved it to baremetal; root over the fleet ansible key.
# See docs/runbooks/palworld-baremetal-cutover.md.
---
all:
  children:
    palworld:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
        # ⚠ FALSE SINCE PET-381, AND THAT IS NOT A REGRESSION. PET-168 opened 8211/udp
        # from 192.168.86.0/24 because the host had a real leg on that segment. The
        # container does not and cannot — pve03 reaches the mesh over WiFi, and a WiFi
        # station cannot bridge another MAC (roles/plex-bridge has the detail). Play
        # traffic now arrives NATted, so it reaches the container FROM .50 and the
        # .50 ingress rule is what admits it. A .86 rule here would be dead config.
        palworld_mesh_enabled: false
      hosts:
        # ⚠ palworld-mc WAS REMOVED HERE, AND LEAVING IT WOULD HAVE BEEN DANGEROUS.
        # It pointed at 192.168.86.234 — the ex-mission-control laptop, which was WIPED
        # AND REBUILT AS pve03 on 2026-09-04 after pve01 died. Once the .86 DHCP
        # reservation lands, that address IS pve03, so this play would have installed
        # SteamCMD and a game server onto the hypervisor running the whole platform.
        #
        # The game is back in a container (PET-381). Players still reach 192.168.86.234;
        # pve03 NATs it here. See roles/palworld-mesh-nat.
        palworld-234:
          ansible_host: 192.168.50.234
