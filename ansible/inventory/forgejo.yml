# forgejo — the read-only Forgejo mirror (PET-756).
#
# ⚠ SPLIT OUT OF hosts.yml ON PURPOSE, like usaa.yml and metrics.yml. ansible.cfg loads the whole
# inventory/ DIRECTORY, so this file needs no registration. `ansible-playbook` exits 0 when a play
# matches zero hosts, which is why the group name below must match `hosts: forgejo` in
# configure-forgejo-mirror.yml.
---
all:
  children:
    # LXC 249 on pve03, declared in environments/homelab/forgejo.tf. root over the
    # ansible-automation key Terraform installs (var.ssh_public_key).
    forgejo:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        forgejo-249:
          ansible_host: 192.168.50.249
