# codex (LXC 248) — the Codex worker for the PET-549 proof of concept (codex.tf).
# TF creates the LXC and its guest firewall; Ansible installs the Codex CLI, the session
# user and the config — configure-codex.yml + roles/codex. The OpenAI sign-in is an
# operator step on first SSH, in roles/codex/README.md.
#
# Its own file, like pve03.yml and pete-pi.yml, so adding it does not re-trigger the
# workflows that watch hosts.yml. ansible.cfg loads the whole directory.
all:
  children:
    codex:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        codex-248:
          ansible_host: 192.168.50.248
