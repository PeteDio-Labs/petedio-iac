# The secrets register (PET-685). It holds no values: only who owns each Vault path, how it
# rotates and when it expires. scripts/secrets-register.py checks it against the code and, in
# the nightly job, against Vault KV metadata. docs/runbooks/secrets-register.md explains each field.
version: 1
secrets:
  - path: kv/iac/proxmox
    owner: pedro
    rotation: "scripts/vault-seed.sh (Proxmox API token, minted in the Proxmox UI)"
    expiry: {rule: none}

  - path: kv/iac/minio
    owner: pedro
    rotation: "scripts/reseed-minio-vault.sh"
    expiry: {rule: none}

  - path: kv/iac/minio-root
    owner: pedro
    rotation: "unrecorded: seed-minio-data-root.sh rotates kv/iac/minio-data-root, a different credential; no script rotates the state backend's root"
    expiry: {rule: none}

  - path: kv/iac/minio-data-root
    owner: pedro
    rotation: "scripts/seed-minio-data-root.sh"
    expiry: {rule: none}

  - path: kv/iac/lxc-ssh
    owner: pedro
    rotation: "scripts/vault-seed.sh (the key pair every LXC trusts)"
    expiry: {rule: none}

  - path: kv/iac/cloudflare
    owner: pedro
    rotation: "scripts/seed-palworld-tunnel-vault.sh (palworld_tunnel_id); the API token is set by hand"
    expiry: {rule: none}

  - path: kv/iac/authentik
    owner: pedro
    rotation: "scripts/reseed-authentik-oidc-vault.sh"
    expiry: {rule: none}

  - path: kv/iac/github-runner-pat
    owner: pedro
    rotation: "unrecorded: no seed script names it"
    expiry: {rule: none}
    note: "Read by configure-runner.yml. Find who mints it and record it."

  - path: kv/db/plane
    owner: pedro
    rotation: "unrecorded: no seed script names it"
    expiry: {rule: none}
    note: "Plane's database owner password. Read by deploy-plane.sh and the gated apply."

  - path: kv/db/usaa
    owner: pedro
    rotation: "scripts/seed-usaa-db.sh"
    expiry: {rule: none}

  - path: kv/poker/db
    owner: pedro
    rotation: "scripts/seed-postgres-admin-vault.sh copies admin_password to kv/admin/postgres (PET-691)"
    expiry: {rule: none}
    note: "Server-wide Postgres admin credential under a historical name. Retire after the PET-691 follow-up."

  - path: kv/admin/postgres
    owner: pedro
    rotation: "scripts/seed-postgres-admin-vault.sh (PET-691)"
    expiry: {rule: none}
    optional: true
    consumers_external: "environments/homelab/postgres.tf, once PET-691 merges"
    note: "Absent until PET-691 is applied and seeded."

  - path: kv/services/authentik
    owner: pedro
    rotation: "scripts/vault-seed.sh"
    expiry: {rule: none}

  - path: kv/services/backup-health
    owner: pedro
    rotation: "scripts/seed-backup-health-vault.sh"
    expiry: {rule: none}

  - path: kv/services/claude-247-pve
    owner: pedro
    rotation: "ansible/playbooks/mint-claude-247-pve.yml"
    expiry: {rule: none}

  - path: kv/services/claude-code-push
    owner: pedro
    rotation: "scripts/seed-claude-code-app.sh"
    expiry: {rule: none}
    note: "GitHub App key. Retiring with PET-594."

  - path: kv/services/claude-ops-github
    owner: pedro
    rotation: "scripts/seed-claude-ops-app.sh"
    expiry: {rule: none}
    note: "GitHub App key (petedio-ops-247)."

  - path: kv/services/claude-vault-push
    owner: pedro
    rotation: "scripts/seed-claude-vault-app.sh"
    expiry: {rule: none}
    note: "GitHub App key. Retiring with PET-594."

  - path: kv/services/claude-workspace-mirror
    owner: pedro
    rotation: "scripts/seed-workspace-mirror-vault.sh"
    expiry: {rule: none}
    note: "GitHub App key (petedio-workspace-mirror)."

  - path: kv/services/cloudflare
    owner: pedro
    rotation: "scripts/vault-seed.sh (cloudflared tunnel_token)"
    expiry: {rule: none}

  - path: kv/services/codex-plane
    owner: pedro
    rotation: "scripts/seed-codex-plane-token.sh"
    expiry: {rule: none}

  - path: kv/services/codex-review-app
    owner: pedro
    rotation: "scripts/seed-codex-review-app.sh"
    expiry: {rule: none}
    note: "GitHub App key (petedio-codex-review)."

  - path: kv/services/media/dashboard
    owner: pedro
    rotation: "scripts/reseed-media-dash-vault.sh"
    expiry: {rule: none}

  - path: kv/services/media/qbittorrent
    owner: pedro
    rotation: "scripts/seed-qbittorrent-vault.sh"
    expiry: {rule: none}
    note: "WireGuard key for the VPN sidecar."

  - path: kv/services/minio-obsidian
    owner: pedro
    rotation: "scripts/reseed-minio-obsidian-vault.sh"
    expiry: {rule: none}

  - path: kv/services/palworld-panel
    owner: pedro
    rotation: "scripts/seed-palworld-tunnel-vault.sh"
    expiry: {rule: none}

  - path: kv/services/pete-bot
    owner: pedro
    rotation: "scripts/seed-pete-bot-vault.sh; scripts/seed-pete-bot-notify-token.sh; scripts/seed-pete-bot-desk-app.sh"
    expiry: {rule: none}
    note: "Discord token, bearers and the merge desk App key (desk_app_pem)."

  - path: kv/services/secrets-register
    owner: pedro
    rotation: "scripts/seed-secrets-register.sh --refresh, after pete-bot's notify token changes"
    expiry: {rule: none}
    optional: true
    note: "A copy of pete-bot's notify_bearer_token for the nightly job's DM."

  - path: kv/services/plane
    owner: pedro
    rotation: "scripts/seed-plane-member-pat.sh"
    expiry: {rule: none}

  # One path per Plane member in MCP_MEMBERS (scripts/deploy-plane.sh). A member's PAT acts as
  # that member. Add an entry here when a member is added there.
  - path: kv/services/plane-tom
    owner: pedro
    rotation: "scripts/seed-plane-member-pat.sh --name tom"
    expiry: {rule: none}

  - path: kv/services/plane-sonia
    owner: pedro
    rotation: "scripts/seed-plane-member-pat.sh --name sonia"
    expiry: {rule: none}

  - path: kv/services/registry
    owner: pedro
    rotation: "scripts/vault-seed.sh"
    expiry: {rule: none}

  - path: kv/services/resume-builder
    owner: pedro
    rotation: "unrecorded: the host went with PET-307"
    expiry: {rule: none}
    status: retired
    note: "Drop it once no consumer remains (PET-691)."

  - path: kv/services/search
    owner: pedro
    rotation: "unrecorded: no seed script names it"
    expiry: {rule: none}
    note: "Read by deploy-search.sh and configure-search.yml."

  - path: kv/services/tailscale
    owner: pedro
    rotation: "unrecorded: no seed script names it"
    expiry: {rule: none}

  - path: kv/services/uptime-kuma
    owner: pedro
    rotation: "unrecorded: no seed script names it"
    expiry: {rule: none}

  - path: kv/services/usaa
    owner: pedro
    rotation: "scripts/seed-usaa-batsy-token.sh; scripts/seed-usaa-calendar-url.sh; scripts/seed-usaa-minio.sh"
    expiry: {rule: none}

  - path: kv/services/usaa-minio
    owner: pedro
    rotation: "scripts/seed-usaa-minio.sh"
    expiry: {rule: none}

  - path: kv/services/vault-snapshots
    owner: pedro
    rotation: "set out of band when the vault-snapshot role was first deployed (PET-109)"
    expiry: {rule: none}

  - path: kv/services/water-fast
    owner: pedro
    rotation: "scripts/reseed-water-fast-vault.sh"
    expiry: {rule: none}
    note: "Still holds the waterfast database password (databases.tf). Move it to kv/db/waterfast before dropping it."

  - path: kv/services/agent-loop
    owner: pedro
    rotation: "retired with the agent fleet (PET-265)"
    expiry: {rule: none}
    status: retired

  - path: kv/services/claude-loop
    owner: pedro
    rotation: "scripts/retire-claude-loop-vault.sh deleted it (PET-547)"
    expiry: {rule: none}
    status: retired

  - path: kv/services/qbittorrent
    owner: pedro
    rotation: "scripts/seed-qbittorrent-vault.sh retires it"
    expiry: {rule: none}
    status: retired

  - path: kv/services/lab-agent
    owner: pedro
    rotation: "unrecorded: seeded for the lab-agent rollout (PET-670)"
    expiry: {rule: none}
    optional: true
    consumers_external: "scripts/deploy-pete-bot.sh, once petedio-iac#460 merges"

  - path: kv/services/lab-agent-pve
    owner: pedro
    rotation: "unrecorded: seeded for the lab-agent rollout (PET-670)"
    expiry: {rule: none}
    optional: true
    consumers_external: "scripts/deploy-pete-bot.sh, once petedio-iac#460 merges"

  - path: kv/services/lab-agent-plane
    owner: pedro
    rotation: "scripts/seed-lab-agent-plane.sh (PET-672)"
    expiry: {rule: none}
    optional: true
    consumers_external: "scripts/deploy-pete-bot.sh, once petedio-iac#470 merges"

  # Not a KV path: the Vault token claude-ops holds on claude-247. Its role caps the token at
  # 90 days (token_explicit_max_ttl=2160h), and nothing renews past the cap. Edit `date` when
  # scripts/seed-claude-ops-vault-token.sh re-issues it. The date comes from the seed on
  # 2026-10-02; confirm it with `vault token lookup -accessor` on the Mac.
  - path: "token:claude-ops (claude-247)"
    kind: external
    owner: pedro
    rotation: "scripts/seed-claude-ops-vault-token.sh"
    expiry: {rule: date, date: 2026-12-31}
