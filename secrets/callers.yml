# The callers list. It holds no values: only which agent holds a Cloudflare Access service
# token, and which person owns that agent. scripts/keys.py checks it on every pull request, and
# .github/workflows/keys.yml makes Cloudflare and Vault match it after Pedro's lab-write tap.
# docs/runbooks/keys.md explains each field and the lifecycle.
#
# To give an agent a token, add it here and run keys.yml with action=sync. To revoke it, delete
# its entry and run sync again. To let it call a service, add its name to that route's `agents`
# list in environments/homelab/cloudflare-routes.tf.
#
# `mtrace` records the agent's scope on mtrace's LAN API: read (the default) or write. The
# source is mtrace_write_callers in ansible/playbooks/configure-media-dash.yml, and keys.py
# check fails when the two disagree. Change both in the same PR.
version: 1

# Each owner is a person with an Authentik login at auth.pdlab.dev. The owner takes the agent's
# token from Vault and enters it in the agent's own credential store.
people:
  - name: pedro
  - name: sonia

agents:
  - name: bobbert
    owner: pedro
    note: "Pedro's Muse agent"
    # Live since petedio-iac#650 (2026-11-07): bobbert is in mtrace_write_callers. Over the MCP
    # door every agent reads only, because the door offers no write tools.
    mtrace: write
  - name: batsy
    owner: sonia
    note: "Sonia's Muse agent"
    # Write on Pedro's word (2026-11-09, PET-904), in mtrace_write_callers with bobbert.
    mtrace: write
