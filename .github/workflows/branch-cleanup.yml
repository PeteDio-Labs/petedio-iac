# branch-cleanup — delete branches whose tip equals a merged pull request's head.
#
# WHY. A project thread can't delete a ref: its GitHub proxy refuses the write. A thread
# dispatches this workflow instead and reads the log.
#
#   mode=plan     lists the safe branches and deletes nothing; no approval.
#   mode=delete   lists them, waits for Pedro's tap on the `lab-write` environment, re-checks each
#                 branch against fresh reads, then deletes it.
#
# LIMIT. The job uses the repository's own `github.token`, so it reaches petedio-iac only. A run
# with another repo name fails at the first API read and exits non-zero. Other repos need a
# credential that this repo does not hold; nothing here places one.
#
# SECURITY. Only `main` runs it. Starting a dispatch needs write access. The log is public and
# prints branch names, counts and short SHAs only.
name: branch-cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan lists, delete removes after the lab-write tap"
        required: true
        type: choice
        options:
          - plan
          - delete
      repo:
        description: "Repository name under PeteDio-Labs. Only petedio-iac works with this token."
        required: false
        type: string
        default: petedio-iac

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: List the safe branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
        run: python3 scripts/branch-cleanup.py plan "$REPO"

  delete:
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.mode == 'delete'
    environment: lab-write
    concurrency:
      group: branch-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Re-check and delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
        run: python3 scripts/branch-cleanup.py delete "$REPO"
