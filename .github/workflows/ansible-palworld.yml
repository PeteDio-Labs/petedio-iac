# Workflow B (IaC) for the Palworld dedicated-server LXC (234) — thin caller of the reusable
# ansible-stack.yml (PET-250; the job logic used to be duplicated per stack). This file owns
# only the triggers + the per-host serialization; see ansible-stack.yml for the jobs.
# NB: the apply installs ~12-15 GB of server binaries via SteamCMD on 234 (the first run is
# long); community.general is needed for the role's ufw tasks. (PET-157)
name: ansible-palworld

on:
  # ⚠ NO pull_request TRIGGER (PET-407). The only thing it ran was ansible-stack.yml's
  # self-hosted syntax-check, which has been deleted — it executed PR-controlled code on the
  # LAN runner. A trigger with no job left to run is worse than none: it looks like PR
  # coverage and is not. The real PR coverage is ansible-validate.yml, which syntax-checks
  # and lints every playbook on a hosted runner and is required on every pull request.
  push:
    branches: [main]
    paths:
      - ansible/playbooks/configure-palworld.yml
      - ansible/roles/palworld/**
      - ansible/inventory/palworld.yml
      - ansible/inventory/group_vars/palworld.yml
      - ansible/inventory/host_vars/palworld-234.yml
      # pve03 carries the mesh NAT this playbook now installs, so a change to
      # that role must re-apply. inventory/pve03.yml is deliberately NOT here:
      # editing the node inventory should not redeploy a game server.
      - ansible/roles/palworld-mesh-nat/**
      - .github/workflows/ansible-palworld.yml

# Serialize runs of this workflow so two fast merges can't race two ansible applies
# against host 234. Separate group from terraform.yml's tf-homelab and ansible-openfaas —
# a different host, and this workflow never touches Terraform state.
concurrency:
  group: ansible-palworld
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

jobs:
  stack:
    uses: ./.github/workflows/ansible-stack.yml
    with:
      playbook: playbooks/configure-palworld.yml
      stack: palworld
      # community.general -> the role's ufw tasks; ansible.posix -> authorized_key, which
      # pins the panel's start-hook key to the palctl-remote forced command (PET-266).
      collections: community.general ansible.posix
      # host-key-checking stays the default "False" (mirrors the pre-dedup behavior)
