# Workflow E — Ansible static checks (PET-397): validate-on-PR for the half of this repo
# that had no check at all.
#
# WHY IT EXISTS. `terraform.yml`'s `validate` job covers Terraform only. Of the other
# workflows, `ansible-openfaas`, `ansible-palworld` and `ansible-stack` APPLY a named
# playbook against live hosts — they are deploys, not checks, and `ansible-stack` is a
# `workflow_call` with no caller for most plays. So until this job, a role could be added,
# edited or broken and nothing would look at it. PET-396 merged ~600 lines of Ansible with
# two defects behind a green tick that only ever examined `.tf` files.
#
# SAME POSTURE AS `validate`: GitHub-hosted, ephemeral, NO Vault, NO LAN, NO state, and no
# secrets. Every check here is static — nothing connects to a host — so this is safe to run
# against PR-controlled code. It must stay that way: if a check here ever needs a
# credential, it belongs in an apply workflow, not this one.
#
# ⚠ THE FAILURE THIS JOB IS BUILT AGAINST IS ITS OWN. A check that examined nothing and a
# check that found nothing print the same thing, and this repo has shipped that bug six
# times (PET-298, PET-317, PET-360, PET-363, PET-372, PET-374). It is not hypothetical
# here: `ansible-lint .` run in `ansible/` reports
#     Passed: 0 failure(s), 0 warning(s) in 0 files processed of 1 encountered
# and exits 0. A green tick over an empty glob. So every step below counts what it is about
# to look at, refuses to continue on zero, and prints the count next to the result.
#
# THERE IS NO BACKLOG AND NO IGNORE FILE. The tree lints clean at ansible-lint's `production`
# profile: 0 failures, 0 warnings over 186 files. The findings that existed when this job was
# written were fixed, except for eleven that were deliberate — those carry `# noqa: <rule>`
# at their own site with the reason written above them, which is arguable in review in a way
# that a path in an ignore file is not. Keep it that way: if you need to suppress a rule,
# suppress it where the code is and say why.
name: ansible-validate

# ⚠ NO paths FILTER ON pull_request, DELIBERATELY — this job is a REQUIRED status check.
# A required check that is path-filtered never reports on a PR outside those paths, and
# GitHub waits for it forever: every Terraform-only or docs-only PR would be unmergeable
# with "Expected — waiting for status to be reported". terraform.yml avoids this the same
# way, with a bare `pull_request: {}`, which is why `validate` and `gate` are safe as
# required checks and this one was not.
#
# The cost is ~2 minutes of hosted runner on a PR that changed no Ansible. That is the
# right trade: the job examines the whole tree and reports real counts either way, so
# there is never a question of whether it ran. `push` stays filtered — those runs gate
# nothing.
on:
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-validate.yml"

permissions:
  contents: read

defaults:
  run:
    # ansible.cfg lives here and sets inventory/roles_path; --syntax-check needs it.
    working-directory: ansible

jobs:
  ansible-validate:
    runs-on: ubuntu-latest
    # GNU grep calls a file binary when it hits bytes it cannot decode in the current
    # locale, and prints "binary file matches" INSTEAD of the match. Task names in this repo
    # are full of em-dashes, so a C locale turns the count-extraction below into an empty
    # string and the floor guard fires on a clean tree. Found on this job's first CI run.
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to what the checks were verified against locally. A minor bump can add rules
      # and turn this red on untouched files — when you raise these, run `ansible-lint` over
      # `roles/ playbooks/` first and regenerate the ignore file if the new rules are ones
      # you accept for now.
      - name: Install ansible-lint
        run: pip install "ansible-lint==26.4.0" "ansible-core==2.20.4"

      # Without these, `community.general.ufw`, `community.docker.docker_compose_v2`,
      # `community.postgresql.postgresql_user` and `community.general.timezone` resolve to
      # nothing and ansible-lint reports nine `syntax-check[unknown-module]` errors that are
      # not real. They are NOT in the ignore file, deliberately: if this step ever silently
      # fails, the lint step goes red rather than quietly skipping those files.
      - name: Install the collections this repo declares
        run: ansible-galaxy collection install -r requirements.yml

      - name: Count what is about to be examined
        id: scope
        run: |
          set -euo pipefail
          find playbooks -name '*.yml' -type f | sort > /tmp/playbooks.txt
          # Only the top level is a suite to RUN; tests/cases/* are includes, and counting
          # them here would make the run step's own count guard unsatisfiable.
          find tests -maxdepth 1 -name '*.yml' -type f | sort > /tmp/tests.txt
          ROLES=$(find roles -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          PLAYS=$(wc -l < /tmp/playbooks.txt | tr -d ' ')
          SUITES=$(wc -l < /tmp/tests.txt | tr -d ' ')
          TESTFILES=$(find tests -name '*.yml' -type f | wc -l | tr -d ' ')
          echo "roles=$ROLES" >> "$GITHUB_OUTPUT"
          echo "plays=$PLAYS" >> "$GITHUB_OUTPUT"
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
          echo "testfiles=$TESTFILES" >> "$GITHUB_OUTPUT"
          if [ "$ROLES" -eq 0 ] || [ "$PLAYS" -eq 0 ] || [ "$SUITES" -eq 0 ]; then
            echo "::error title=nothing to examine::Found $ROLES roles, $PLAYS playbooks and $SUITES test suites. The layout moved or this job is looking in the wrong place. Refusing to report success over an empty set."
            exit 1
          fi
          echo "Will examine $ROLES roles, $PLAYS playbooks and run $SUITES test suites."

      # A hard gate with no backlog: all 40 playbooks passed when this landed, so any
      # failure here is something this PR broke. NB `ansible-playbook` exits 0 when a play
      # matches zero hosts (see ansible.cfg), which is why this is --syntax-check and not a
      # dry run — a check-mode run against no inventory would be another green nothing.
      - name: Syntax-check every playbook
        run: |
          set -uo pipefail
          CHECKED=0; FAILED=0
          while IFS= read -r pb; do
            if ansible-playbook --syntax-check "$pb" > /tmp/sc.log 2>&1; then
              CHECKED=$((CHECKED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "::error file=ansible/${pb}::ansible-playbook --syntax-check failed"
              sed 's/^/    /' /tmp/sc.log
            fi
          done < /tmp/playbooks.txt
          SEEN=$((CHECKED + FAILED))
          echo "syntax-check: ${CHECKED} passed, ${FAILED} failed, of ${{ steps.scope.outputs.plays }} playbooks found"
          if [ "$SEEN" -ne "${{ steps.scope.outputs.plays }}" ]; then
            echo "::error title=loop skipped playbooks::Counted ${{ steps.scope.outputs.plays }} playbooks but only ran $SEEN. Not reporting on a partial sweep."
            exit 1
          fi
          [ "$FAILED" -eq 0 ]

      # Syntax-checking a play proves it parses, not that its logic is right. These suites
      # run for real: localhost plays over recorded data, no inventory, no credential, no
      # host touched. PET-466 added the first one because the bug it fixes — a role that
      # stops converging while its host keeps answering — has no symptom a syntax check
      # could ever see.
      - name: Run the localhost test suites
        run: |
          set -uo pipefail
          RAN=0; FAILED=0
          while IFS= read -r t; do
            if ansible-playbook "$t" > /tmp/test.log 2>&1; then
              RAN=$((RAN + 1))
            else
              FAILED=$((FAILED + 1))
              echo "::error file=ansible/${t}::test suite failed"
              sed 's/^/    /' /tmp/test.log
            fi
          done < /tmp/tests.txt
          SEEN=$((RAN + FAILED))
          echo "tests: ${RAN} passed, ${FAILED} failed, of ${{ steps.scope.outputs.suites }} suites found"
          if [ "$SEEN" -ne "${{ steps.scope.outputs.suites }}" ]; then
            echo "::error title=loop skipped suites::Counted ${{ steps.scope.outputs.suites }} suites but only ran $SEEN. Not reporting on a partial sweep."
            exit 1
          fi
          [ "$FAILED" -eq 0 ]

      - name: Lint the roles, playbooks and tests
        run: |
          set -uo pipefail
          # --nocolor: ANSI escapes in the tee'd log are the other half of the binary-file
          # problem above. Belt and braces — this parses a number out of a log, and the
          # guard below treats "could not parse" as failure, so both must be reliable.
          ansible-lint --nocolor roles/ playbooks/ tests/ 2>&1 | tee /tmp/lint.log
          RC=${PIPESTATUS[0]}
          # ⚠ The count is the point, and ZERO IS THE WRONG THRESHOLD. ansible-lint prints
          # "N files processed of M encountered" on both the pass and the fail path, and N
          # can collapse without reaching 0: `ansible-lint .` in this directory reports
          # "0 files processed" bare, and "1 files processed" once a config file exists —
          # both green, both examining nothing that matters. Measured while writing this.
          #
          # So assert a FLOOR derived from what the scope step actually counted. Every
          # playbook is one file lint must see, and every role contributes at least one, so
          # roles+playbooks is a lower bound that rises as the repo grows and cannot be
          # satisfied by a collapsed glob.
          PROCESSED=$(grep -aoE '[0-9]+ files processed' /tmp/lint.log | head -1 | grep -aoE '^[0-9]+' || true)
          # Every test file counts toward the floor as well, including tests/cases/*, so a
          # suite that vanishes from the glob takes the floor with it instead of passing.
          FLOOR=$(( ${{ steps.scope.outputs.roles }} + ${{ steps.scope.outputs.plays }} + ${{ steps.scope.outputs.testfiles }} ))
          echo "ansible-lint examined ${PROCESSED:-0} files across ${{ steps.scope.outputs.roles }} roles, ${{ steps.scope.outputs.plays }} playbooks and ${{ steps.scope.outputs.testfiles }} test files (floor ${FLOOR})"
          if [ "${PROCESSED:-0}" -lt "$FLOOR" ]; then
            echo "::error title=lint examined too little::ansible-lint processed ${PROCESSED:-0} files, below the floor of ${FLOOR} implied by ${{ steps.scope.outputs.roles }} roles + ${{ steps.scope.outputs.plays }} playbooks + ${{ steps.scope.outputs.testfiles }} test files. That is a green check over a collapsed glob, not a clean repo. Refusing."
            exit 1
          fi
          # ⚠ A RULE THAT CRASHES IS A RULE THAT DID NOT RUN. ansible-lint logs the crash as
          # "WARNING Ignored exception from <rule> while processing <file>", counts the file
          # as processed, and prints a summary that is indistinguishable from a pass. That
          # is how one line in roles/pi-health lint-passed for as long as it existed
          # (PET-472): on one Python the rule crashed and the summary read 'production';
          # on another it ran, reported a warning, and the summary read 'min'. Neither
          # number this step used to read moved. So refuse on the crash line, and refuse
          # unless the summary names the profile the repo claims.
          if grep -aq 'Ignored exception' /tmp/lint.log; then
            echo "::error title=a lint rule crashed::ansible-lint skipped a rule on at least one file (grep 'Ignored exception' in the log above). A skipped rule is a rule that did not run, and nothing else in this step can tell that from a pass. Refusing."
            exit 1
          fi
          [ "$RC" -eq 0 ] || exit "$RC"
          PROFILE=$(grep -aoE "Last profile that met the validation criteria was '[a-z]+'" /tmp/lint.log | grep -aoE "'[a-z]+'" | tr -d "'" || true)
          echo "ansible-lint met profile '${PROFILE:-none}'"
          if [ "${PROFILE:-none}" != "production" ]; then
            echo "::error title=lint below production::ansible-lint met profile '${PROFILE:-none}', not 'production'. A warning is enough to drop the profile, and this repo carries no backlog: fix the finding or suppress it at its own site with a reason (see the header of this file)."
            exit 1
          fi
          exit "$RC"
