# deploy-uptime-kuma — services/configure-pete-pi.yml against pete-pi (Uptime Kuma, the digest, the QDevice
# daemon and the tailnet routes), without the Mac (PET-849).
#
# Replaces scripts/deploy-uptime-kuma.sh as the way to run it. The script stays as the fallback and
# still seeds kv/services/uptime-kuma on a first run. This workflow stages the same Vault records
# through scripts/ci-deploy.py, signs a 30-minute SSH certificate for the deploy-uptime-kuma
# principal, logs in to pete-pi as pedro, and fails unless Ansible reports exactly pete-pi with
# failed=0 and unreachable=0.
#
#   gh workflow run deploy-uptime-kuma.yml --ref main
#
# ⚠ THE JOB WAITS ON THE lab-write ENVIRONMENT. Pedro approves each run on the run page in a
# browser (the GitHub iOS app shows no button). Pete-pi is the fault-study instrument and the
# Vault unseal watcher, so a person decides when it converges.
#
# ⚠ DISPATCH ONLY, AND MAIN ONLY. The deploy-uptime-kuma Vault role binds event_name =
# workflow_dispatch, ref = main and this file's workflow_ref (vault-config/deploy-hosts.tf).
#
# ⚠ NO pull_request TRIGGER, EVER (PET-407). The job runs on a self-hosted runner on the LAN and
# this repository is public. docs/GOTCHAS.md explains the exposure in full (PET-407).
#
# Needs: vault-config applied (deploy-hosts.tf), and pete-pi trusting the Vault SSH CA, which
# scripts/trust-ssh-ca-pete-pi.sh does once (docs/runbooks/host-deploys.md). Without the role the
# login answers 403. Without the trust the connection is refused. Both fail the run in the first
# minute.
name: deploy-uptime-kuma

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

concurrency:
  group: deploy-uptime-kuma # serialize deploys against one host
  cancel-in-progress: false

env:
  VAULT_ADDR: https://192.168.50.223:8200
  VAULT_CACERT: ${{ github.workspace }}/environments/homelab/vault-ca.crt

jobs:
  deploy:
    # Pedro approves here, as for every lab-write step. Vault's role binds repository, ref, event_name
    # and workflow_ref, so the environment claim does not change what mints.
    environment: lab-write
    # ⚠ PIN x64. [self-hosted, homelab] also matches pete-pi-1, which is arm64 and has no route to
    # the Docker socket this job needs.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 30
    steps:
      # A dispatch from another ref must fail, not skip: a skipped job reads as a green deploy that
      # never ran. Vault would refuse the login anyway (ref is bound to main).
      - name: Refuse any ref but main
        shell: bash
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error title=deploy::this workflow deploys main only, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Encode Vault CA
        id: vault_ca
        working-directory: environments/homelab
        shell: bash
        run: echo "b64=$(base64 -w0 vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # ⚠ The mount is jwt-github, not the default jwt, and the audience must be set. Either
      # mistake answers a bare 403 that reads like a missing policy.
      - name: Vault — deploy-uptime-kuma via OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: deploy-uptime-kuma
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportToken: true

      - name: Deploy uptime-kuma
        shell: bash
        run: python3 scripts/ci-deploy.py uptime-kuma
