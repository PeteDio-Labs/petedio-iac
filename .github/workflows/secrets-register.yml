# secrets-register (PET-685): check secrets/register.yml against the code on every pull
# request, and against Vault's KV metadata every night.
#
# The `offline` job is GitHub-hosted and credential-free. It fails a PR that reads a Vault
# path no register entry owns, so a new secret cannot land without an owner and a rotation
# method. The `nightly` job runs on the homelab runner, mints the `secrets-register` Vault
# role (metadata read only, vault-config/secrets-register.tf) and fails when a path is absent
# or an expiry is within 21 days. On failure it DMs Pedro through pete-bot.
#
# WHAT A GREEN RUN MEANS. Each job's last line says what it examined: register entries, code
# files and Vault reads. The script exits non-zero below a floor, so a run that read nothing
# is red, not green (the PET-298 shape).
name: secrets-register

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user "pyyaml==6.0.2"
      - name: Prove an expiring entry fails
        run: python3 scripts/secrets-register.py --self-test
      - name: Check the register against the code
        run: python3 scripts/secrets-register.py

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, homelab]
    permissions:
      contents: read
      id-token: write # the OIDC token vault-action exchanges for a Vault token
    env:
      VAULT_ADDR: https://192.168.50.223:8200
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Encode Vault CA
        id: vault_ca
        run: echo "b64=$(base64 -w0 environments/homelab/vault-ca.crt)" >> "$GITHUB_OUTPUT"
      - name: Vault — mint the secrets-register role via OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: secrets-register
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportToken: true
          exportEnv: true
          secrets: |
            kv/data/services/secrets-register notify_bearer_token | NOTIFY_TOKEN
      # The runner ships a minimal Python with no venv or pip (see ansible-stack.yml), and Debian
      # refuses `pip install --user`. The checker runs in an official Python container instead,
      # with the repository mounted read-only. The Vault token reaches it by name, never by value.
      - name: Check the register against the code and Vault
        id: check
        env:
          PY_IMAGE: python:3.12-slim
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w:ro" -w /w \
            -e PYTHONDONTWRITEBYTECODE=1 -e VAULT_ADDR -e VAULT_TOKEN \
            -e VAULT_CACERT=/w/environments/homelab/vault-ca.crt \
            "$PY_IMAGE" sh -c 'pip install -q --no-cache-dir "pyyaml==6.0.2" && python3 scripts/secrets-register.py --live' \
            | tee check.log
      - name: DM Pedro
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NOTIFY_TOKEN:-}" ]; then
            echo "::warning title=secrets-register::No notify token (kv/services/secrets-register is not seeded), so no DM was sent. Run scripts/seed-secrets-register.sh."
            exit 0
          fi
          FAILS="$(grep -c '^FAIL' check.log 2>/dev/null || true)"
          MSG="The secrets register check failed (${FAILS:-0} findings). ${RUN_URL}"
          python3 - "$MSG" <<'PY' > payload.json
          import json, sys
          print(json.dumps({"from": "secrets-register", "message": sys.argv[1]}))
          PY
          # The bearer goes to curl on stdin from the printf builtin (`-H @-`), so it never
          # appears in the process list.
          printf 'Authorization: Bearer %s\n' "$NOTIFY_TOKEN" \
            | curl -fsS -m 15 -X POST http://192.168.50.237:3015/v1/notify \
                -H @- -H "Content-Type: application/json" \
                --data @payload.json
