# terraform-plan — plan a pull request's homelab Terraform and comment the result (PET-866).
#
# WHY. `terraform.yml` validates a pull request and plans only after the merge, so a thread could
# not read a plan and Pedro ran `terraform plan` by hand. This workflow posts the plan as a
# comment: counts, resource addresses, and a flag on every destroy or replace. It prints no
# attribute values, because the repo and the comment are public.
#
# HOW IT STAYS SAFE (PET-104 still holds). This repo is public and the runner can reach Proxmox,
# MinIO and Vault. A `pull_request` run would execute the PR's own workflow there, so this file
# triggers on `workflow_run` instead: GitHub runs main's copy of it, whoever opened the PR.
#   1. Vault binds role terraform-plan to this file on main and event workflow_run
#      (vault-config/auth.tf), so no other trigger or file mints the credentials.
#   2. Only same-repo pull requests are planned; a fork never is. The `terraform` run's success is
#      not a gate: a PR controls that workflow and could make it pass. The guard and the mirror are.
#   3. TWO JOBS. `inspect` runs on a GitHub-hosted runner with no credentials and no id-token. It
#      checks out the PR into pr/, apart from main's scripts, and runs two guards: a text guard
#      (tf-plan-guard.py) and a parsed-HCL comparison with main (tf-plan-inspect.py). The PR's
#      HCL is only read there. `plan` runs on the homelab runner only when `inspect` passes, and
#      checks out the exact merge commit that `inspect` examined. A refused PR gets a comment
#      that says to plan locally.
#   3b. Providers install only from a mirror of main's lock file, so a PR cannot add one.
#   4. `-lock=false`, so a plan never blocks an apply, and nothing here writes state. This
#      workflow has no apply step.
#   5. The comment names resources by address with every [instance key] redacted, because a
#      for_each key can carry an evaluated value. Plan files are mode 0600 and deleted at the end.
# A collaborator's branch still runs Terraform with read credentials. The guards narrow that, and
# do not remove it. They are an allowlist of what a PR may change, not proof that a change is
# safe. python-hcl2 is not Terraform's parser, and docs/GOTCHAS.md records that gap.
#
# SCOPE. environments/homelab only, which is what apply-on-merge covers. environments/portfolio
# needs AWS credentials the runners lack, and offsite-watchdog is not in CI (PET-866).
name: terraform-plan

on:
  workflow_run:
    workflows: [terraform]
    types: [completed]

permissions:
  contents: read

env:
  VAULT_ADDR: https://192.168.50.223:8200

jobs:
  # --- Job 1: read the PR's Terraform where there is nothing to steal -----------------------
  inspect:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment only; no id-token, so no Vault and no OIDC
    concurrency:
      group: tf-plan-inspect-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      number: ${{ steps.pr.outputs.number }}
      merge_sha: ${{ steps.merge.outputs.sha }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Main's copy: the workflow's own scripts. Never read a script from pr/.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Find the pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/tf-plan-gh.py find-pr "$HEAD_SHA" "$PAYLOAD_PR"

      - name: Check out the merge of the pull request into main
        if: steps.pr.outputs.skip == 'false'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false

      # The merge's parents must be this head and a commit that main contains. terraform.yml
      # validates PRs into any branch, and the guard diffs against HEAD^1, so a PR into an
      # unreviewed base branch would hide that branch's content from the guard.
      - name: Verify the merge parents
        id: merge
        if: steps.pr.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P1=$(git -C pr rev-parse 'HEAD^1'); P2=$(git -C pr rev-parse 'HEAD^2')
          [ "$P2" = "$HEAD_SHA" ] || { echo "::error::merge second parent $P2 is not the PR head $HEAD_SHA"; exit 1; }
          python3 -I scripts/tf-plan-gh.py base-ok "$P1" || { echo "::error::base parent $P1 is not contained in main"; exit 1; }
          echo "sha=$(git -C pr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Text guard
        id: guard
        if: steps.pr.outputs.skip == 'false'
        shell: bash
        run: |
          set +e
          python3 -I scripts/tf-plan-guard.py pr | tee guard.txt
          RC=${PIPESTATUS[0]}
          PLANNED=$(sed -n 's/^PLANNED_PATHS=//p' guard.txt)
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "planned=${PLANNED:-0}" >> "$GITHUB_OUTPUT"
          # rc 2 means the guard could not read the diff: fail the job, do not skip.
          [ "$RC" -le 1 ]

      # The parser reads main's tree as the base: the PR's own first merge parent, so both guards
      # compare the same pair even if main has moved since the merge ref was built.
      - name: Install the HCL parser (pinned, with its dependency, so it does not move)
        if: steps.pr.outputs.skip == 'false' && steps.guard.outputs.rc == '0' && steps.guard.outputs.planned != '0'
        shell: bash
        run: pip install --quiet python-hcl2==8.1.4 lark==1.3.1

      - name: Parsed-HCL guard
        id: inspect
        if: steps.pr.outputs.skip == 'false' && steps.guard.outputs.rc == '0' && steps.guard.outputs.planned != '0'
        shell: bash
        run: |
          set +e
          # No -I: pip installs into the user site, which -I ignores. The script and its imports
          # come from main's checkout; nothing from pr/ is on the path.
          mkdir base-tree && git -C pr archive 'HEAD^1' | tar -x -C base-tree
          python3 scripts/tf-plan-inspect.py --base base-tree --head pr | tee inspect.txt
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -le 1 ]

      - name: Decide
        id: verdict
        if: always() && steps.pr.outputs.skip == 'false'
        shell: bash
        run: |
          G="${{ steps.guard.outputs.rc }}"; P="${{ steps.guard.outputs.planned }}"; I="${{ steps.inspect.outputs.rc }}"
          if [ "$G" = "0" ] && [ "$P" = "0" ]; then V=noplan
          elif [ "$G" = "0" ] && [ "$I" = "0" ]; then V=ok
          elif [ "$G" = "1" ] || [ "$I" = "1" ]; then V=refused
          else V=error; fi
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
          echo "Examined: text guard rc=${G:-none}, planned paths=${P:-none}, parsed guard rc=${I:-none}, verdict=$V"
          {
            case "$V" in
              refused)
                echo "### Terraform plan not run"
                echo "This pull request changes something Terraform runs, fetches or points credentials at, so a runner with credentials does not plan it (head \`${HEAD_SHA:0:7}\`). Run \`terraform plan\` locally."
                echo; echo '```'; grep -h '^REFUSE' guard.txt inspect.txt 2>/dev/null || true; echo '```' ;;
              noplan)
                echo "### No Terraform plan for this commit"
                echo "The changed files at \`${HEAD_SHA:0:7}\` are outside the planned Terraform roots (the homelab root and its modules; vault-config has its own state), so there is nothing to plan." ;;
              error)
                echo "### Terraform plan did not run"
                echo "A guard could not run, so this pull request was examined by nothing. Read the [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." ;;
            esac
          } > comment.md

      # A commit with nothing to plan replaces an earlier plan comment and posts none of its own.
      - name: Post the comment
        if: always() && steps.verdict.outputs.verdict != 'ok' && steps.verdict.outputs.verdict != '' && hashFiles('comment.md') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          set -euo pipefail
          CUR=$(python3 -I scripts/tf-plan-gh.py head-sha "$PR")
          [ "$CUR" = "$HEAD_SHA" ] || { echo "PR $PR head moved to $CUR; no comment posted for $HEAD_SHA."; exit 0; }
          FLAG=""; [ "$VERDICT" = "noplan" ] && FLAG="--update-only"
          python3 -I scripts/tf-plan-gh.py upsert "$PR" comment.md $FLAG

      # A refusal is not a plan. Colour the check so a green run never stands for work not done.
      - name: Fail when a guard refused or could not run
        if: always() && (steps.verdict.outputs.verdict == 'refused' || steps.verdict.outputs.verdict == 'error')
        shell: bash
        run: |
          echo "::error::terraform-plan did not plan this pull request (guard verdict: ${{ steps.verdict.outputs.verdict }}). See the PR comment."
          exit 1

  # --- Job 2: plan on the runner that holds credentials, only what job 1 passed -------------
  plan:
    needs: inspect
    if: needs.inspect.outputs.verdict == 'ok'
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: tf-plan-run-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      TF_IN_AUTOMATION: "1"
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR: ${{ needs.inspect.outputs.number }}
      MERGE_SHA: ${{ needs.inspect.outputs.merge_sha }}
      GH_REPO: ${{ github.repository }}
      TF_VAR_manage_resource_pool: ${{ vars.MANAGE_RESOURCE_POOL || 'false' }}
      TF_VAR_manage_backup_job: ${{ vars.MANAGE_BACKUP_JOB || 'false' }}
      TF_VAR_email_routing_live: ${{ vars.EMAIL_ROUTING_LIVE || 'false' }}
      TF_VAR_email_routing_forward: ${{ vars.EMAIL_ROUTING_FORWARD || 'false' }}
      TF_VAR_postgres_db_password_versions: ${{ vars.POSTGRES_DB_PASSWORD_VERSIONS || '{}' }}
      # A placeholder, not the key. modules/proxmox-lxc ignores changes to initialization[0].user_account,
      # so the plan is the same, and this job no longer reads kv/iac/lxc-ssh (root on every LXC).
      TF_VAR_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlanPlaceholderPlanPlaceholderPlanPlacehold plan-placeholder"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The exact commit job 1 examined, not whatever the merge ref points to when the plan runs.
      - name: Check out the examined merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.inspect.outputs.merge_sha }}
          path: pr
          persist-credentials: false

      - name: Confirm the checkout is the examined commit
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$MERGE_SHA" ] || { echo "::error::job 1 passed no merge sha"; exit 1; }
          [ "$(git -C pr rev-parse HEAD)" = "$MERGE_SHA" ] || { echo "::error::checkout is not $MERGE_SHA"; exit 1; }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3 # same pin as terraform.yml (PET-362); bump all of them together
          terraform_wrapper: false

      # Providers come from main's lock file and nowhere else. A PR cannot add `external`,
      # `archive`, `http` or `local` by naming it in HCL, because the mirror below holds only the
      # providers main's configuration already uses and `direct` installs are excluded.
      - name: Install main's providers into a private mirror
        id: mirror
        working-directory: environments/homelab
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -backend=false
          RC="$RUNNER_TEMP/tf-plan.tfrc"
          {
            echo 'provider_installation {'
            echo "  filesystem_mirror { path = \"$PWD/.terraform/providers\" }"
            echo '  direct { exclude = ["registry.terraform.io/*/*"] }'
            echo '}'
          } > "$RC"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Encode Vault CA
        id: vault_ca
        shell: bash
        run: echo "b64=$(base64 -w0 environments/homelab/vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # The CA is read from main's copy above, never from pr/.
      - name: Vault — terraform-plan via OIDC
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: terraform-plan
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportToken: true
          exportEnv: true
          secrets: |
            kv/data/iac/minio access_key | AWS_ACCESS_KEY_ID ;
            kv/data/iac/minio secret_key | AWS_SECRET_ACCESS_KEY ;
            kv/data/iac/proxmox api_token | TF_VAR_proxmox_api_token ;
            kv/data/iac/cloudflare api_token | TF_VAR_cloudflare_api_token ;
            kv/data/iac/cloudflare account_id | TF_VAR_cloudflare_account_id ;
            kv/data/iac/cloudflare zone_id | TF_VAR_cloudflare_zone_id ;
            kv/data/iac/cloudflare tunnel_id | TF_VAR_cloudflare_tunnel_id

      - name: Plan
        id: plan
        working-directory: pr/environments/homelab
        env:
          VAULT_CACERT: ${{ github.workspace }}/environments/homelab/vault-ca.crt
          TF_CLI_CONFIG_FILE: ${{ steps.mirror.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          # Main's lock file replaces the PR's, and init may not change it.
          cp "$GITHUB_WORKSPACE/environments/homelab/.terraform.lock.hcl" .terraform.lock.hcl
          # plan.json holds sensitive inputs. Keep it owner-only; the cleanup step deletes it.
          umask 077
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.log 2>&1 || {
            { grep -m1 'Error:' plan.log || true; } | cut -c1-100 | sed 's/^/plan.log: /'
            echo "::error::terraform plan failed (first error above)"; exit 1; }
          terraform show -json tfplan > plan.json
          SRC=0
          {
            python3 -I "$GITHUB_WORKSPACE/scripts/tf-plan-summary.py" plan.json || SRC=$?
            echo; echo "_Plan of the merge of this pull request (head \`${HEAD_SHA:0:7}\`) into main, with \`-lock=false\`. Nothing was applied._"
          } > "$GITHUB_WORKSPACE/comment.md"
          # A summary that read nothing is a failure, and its text stays in the comment.
          [ "$SRC" -eq 0 ] || { echo "::error::plan summary examined nothing"; exit 1; }

      - name: Say the plan did not run
        if: failure() && hashFiles('comment.md') == ''
        shell: bash
        env:
          MIRROR: ${{ steps.mirror.outcome }}
          VAULT: ${{ steps.vault.outcome }}
          PLAN: ${{ steps.plan.outcome }}
        run: |
          {
            echo "### Terraform plan did not run"
            echo "A step failed before a plan existed (mirror: ${MIRROR}, Vault login: ${VAULT}, plan: ${PLAN}), so this pull request was examined by nothing. Read the [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > comment.md

      - name: Post the comment
        if: always() && hashFiles('comment.md') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A newer commit may have landed while this plan ran. Do not overwrite its comment.
          CUR=$(python3 -I scripts/tf-plan-gh.py head-sha "$PR")
          if [ "$CUR" != "$HEAD_SHA" ]; then
            echo "PR $PR head moved to $CUR; this plan was for $HEAD_SHA, so no comment was posted."
            exit 0
          fi
          python3 -I scripts/tf-plan-gh.py upsert "$PR" comment.md

      # The runner persists between jobs. Delete the checkout, the plan and its JSON, which holds
      # sensitive inputs, on success, failure and cancellation.
      - name: Remove plan files
        if: always()
        shell: bash
        run: rm -rf pr comment.md body.md
