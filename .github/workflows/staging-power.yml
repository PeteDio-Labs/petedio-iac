# staging-power — start or stop the portfolio staging container (CT 249) on demand.
#
# Every 5 minutes, `auto` reads the portfolio's `staging` branch and starts CT 249 while UI work is
# pending and recent, and stops it after the work is promoted to main or after 3 hours with no staging
# push. A dispatch can force start, stop or status.
#
#   gh workflow run staging-power.yml --ref main -f mode=start
#
# ⚠ MAIN ONLY, AND ONLY SCHEDULE OR DISPATCH. The staging-power-<event> Vault roles bind
# repository, ref = main, this file's workflow_ref and the event (vault-config/staging-power.tf), so
# a push, a pull request or another workflow cannot mint the token. The job can do one thing on the
# node: its SSH certificate is fixed to a script that starts, stops or reports on CT 249.
#
# ⚠ NO pull_request TRIGGER, EVER (PET-407). The job runs on a self-hosted runner on the LAN and this
# repository is public. Do not pass the dispatch input to a shell: scripts/staging-power.py reads it
# as an argument from a closed list.
#
# A run prints what it examined. A run that could not read GitHub or the node fails and stops nothing.
name: staging-power

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto decides from the staging branch. The others force the container."
        required: true
        default: auto
        type: choice
        options: [auto, start, stop, status]

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

concurrency:
  group: staging-power # one decision at a time, so two runs never start and stop together
  cancel-in-progress: false

env:
  VAULT_ADDR: https://192.168.50.223:8200
  VAULT_CACERT: ${{ github.workspace }}/environments/homelab/vault-ca.crt

jobs:
  power:
    # ⚠ PIN x64. [self-hosted, homelab] also matches pete-pi-1, which is arm64 and has no pinned node keys.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 10
    steps:
      # A run from another ref must fail, not skip. Vault would refuse the login anyway.
      - name: Refuse any ref but main
        shell: bash
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error title=staging-power::this workflow runs on main only, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Encode Vault CA
        id: vault_ca
        working-directory: environments/homelab
        shell: bash
        run: echo "b64=$(base64 -w0 vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # ⚠ The mount is jwt-github, not the default jwt, and the audience must be set. Either mistake
      # answers a bare 403 that reads like a missing policy.
      - name: Vault, staging-power via OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: staging-power-${{ github.event_name }}
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportToken: true

      - name: Decide and act
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
        run: python3 scripts/staging-power.py "$MODE"
