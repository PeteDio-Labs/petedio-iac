# Reusable Ansible stack workflow (PET-250) — the ONE copy of the apply logic
# that ansible-openfaas.yml and ansible-palworld.yml used to duplicate (~109 lines each).
# Per-stack workflows are now thin CALLERS: they own their `on.paths` triggers and their
# per-host `concurrency` group (serialization semantics unchanged), and pass their playbook
# + knobs here via `workflow_call` inputs. A new stack = a ~20-line caller, not a clone.
#
# Jobs (gated on the CALLER's event, which propagates to reusable workflows):
#   apply         push to main — OIDC → Vault (openfaas-ci role: lxc-ssh + registry pull creds
#                 only) → ansible-playbook against the live host, from the self-hosted
#                 homelab x64 runner (LXC 232 on pve03, or 233 on pve02).
#
# Ansible runs in an official python:3.12-slim container: the runner ships a minimal Python
# (no venv/pip), but it has Docker. openssh-client is added for the apply. (TODO: bake an
# ansible image into the registry to drop the per-run apt/pip.)
name: ansible-stack

on:
  workflow_call:
    inputs:
      playbook:
        description: "Playbook path relative to ansible/ (e.g. playbooks/configure-palworld.yml)"
        required: true
        type: string
      stack:
        description: "Short stack name — used for the temp-dir + log labels (e.g. palworld)"
        required: true
        type: string
      collections:
        description: "Space-separated ansible-galaxy collections to install (empty = none)"
        required: false
        type: string
        default: ""
      with-registry-creds:
        description: "Also mint registry pull creds and pass registry_username/registry_password extra-vars"
        required: false
        type: boolean
        default: false
      host-key-checking:
        description: "ANSIBLE_HOST_KEY_CHECKING value for the apply"
        required: false
        type: string
        default: "False"
      ansible-ssh-args:
        description: "Optional ANSIBLE_SSH_ARGS for the apply (e.g. ControlMaster/accept-new)"
        required: false
        type: string
        default: ""
      extra-vars:
        description: >-
          Optional JSON object of NON-SECRET extra-vars merged into the apply's -e @file
          (e.g. '{"fleet_version": "<sha>"}'). Never put credentials here — they'd sit in
          the workflow file and the run log.
        required: false
        type: string
        default: ""

env:
  VAULT_ADDR: https://192.168.50.223:8200
  VAULT_CACERT: ${{ github.workspace }}/environments/homelab/vault-ca.crt
  ANSIBLE_IMAGE: python:3.12-slim

jobs:
  # ⚠ THERE IS DELIBERATELY NO pull_request JOB HERE ANY MORE (PET-407).
  #
  # There was one: a `syntax-check` job, `if: github.event_name == 'pull_request'`, on
  # `runs-on: [self-hosted, linux, x64, homelab]`, with a bare `actions/checkout`. For a
  # `pull_request` event that checks out the PR's OWN content and runs it on a runner sitting
  # on the LAN with Vault, Proxmox and Postgres. petedio-iac is public, and the fork-PR policy
  # was "require approval for first-time contributors" — i.e. the gate was ONE merged
  # contribution, not membership. A stranger lands a typo fix and thereafter their PRs execute
  # here without approval.
  #
  # It was deleted rather than moved to ubuntu-latest because it was also redundant:
  # ansible-validate.yml syntax-checks EVERY playbook, hosted and credential-free, and is a
  # required check on every PR (PET-397). This job checked exactly one — inputs.playbook.
  # Removing it loses no coverage.
  #
  # If you ever add a PR-triggered job to this file: it does not go on the self-hosted runner.
  # Use ubuntu-latest, or `pull_request_target` with an explicit `ref: main`, and know why.

  # merge to main: apply the play to the stack's live host.
  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, homelab]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Encode Vault CA
        id: vault_ca
        working-directory: environments/homelab
        shell: bash
        run: echo "b64=$(base64 -w0 vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # The openfaas-ci role (main-push-only sub) grants ONLY lxc-ssh + the registry pull creds
      # — every stack apply fits inside it. (Per-stack least-privilege roles = follow-up.)
      - name: Vault — SSH key via OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: openfaas-ci
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportEnv: true
          secrets: |
            kv/data/iac/lxc-ssh private_key | ANSIBLE_SSH_KEY

      - name: Vault — registry pull creds via OIDC
        if: inputs.with-registry-creds
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: openfaas-ci
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportEnv: true
          secrets: |
            kv/data/services/registry username | REGISTRY_USERNAME ;
            kv/data/services/registry password | REGISTRY_PASSWORD

      - name: Apply ${{ inputs.playbook }} (ansible in Docker)
        shell: bash
        env:
          COLLECTIONS: ${{ inputs.collections }}
          PLAYBOOK: ${{ inputs.playbook }}
          STACK: ${{ inputs.stack }}
          HOST_KEY_CHECKING: ${{ inputs.host-key-checking }}
          SSH_ARGS: ${{ inputs.ansible-ssh-args }}
          EXTRA_VARS: ${{ inputs.extra-vars }}
        run: |
          umask 077
          CI="/tmp/ci-$STACK"
          rm -rf "$CI"; mkdir -p "$CI"
          trap 'rm -rf "$CI"' EXIT
          printf '%s\n' "$ANSIBLE_SSH_KEY" > "$CI/key"; chmod 600 "$CI/key"
          # Extra-vars via a JSON @file — never on argv, never logged. python3 stdlib (no pip).
          # ansible_ssh_private_key_file as an extra-var (highest precedence) overrides the
          # inventory group var (~/.ssh/id_ed25519_ansible, absent in the container). Registry
          # creds ride along only when the caller asked for them (env present).
          python3 - "$CI/evars.json" <<'PY'
          import json, os, sys
          ev = {"ansible_ssh_private_key_file": "/ci/key"}
          if os.environ.get("REGISTRY_USERNAME"):
              ev["registry_username"] = os.environ["REGISTRY_USERNAME"]
              ev["registry_password"] = os.environ["REGISTRY_PASSWORD"]
          # Caller-supplied NON-SECRET extra-vars (see the input's description).
          ev.update(json.loads(os.environ.get("EXTRA_VARS") or "{}"))
          json.dump(ev, open(sys.argv[1], "w"))
          PY
          # tools/ is mounted read-only at /tools because /ansible/playbooks/../.. = / inside
          # the container — plays that copy repo artifacts via "{{ playbook_dir }}/../../tools/…"
          # (configure-fleet.yml's static page) resolve to /tools/… . Without it the copy fails
          # with "Could not find … on the Ansible Controller" (first ansible-fleet apply, PET-255).
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ansible:/ansible" -v "$GITHUB_WORKSPACE/tools:/tools:ro" \
            -v "$CI:/ci:ro" -w /ansible \
            -e "ANSIBLE_HOST_KEY_CHECKING=$HOST_KEY_CHECKING" \
            ${SSH_ARGS:+-e "ANSIBLE_SSH_ARGS=$SSH_ARGS"} \
            -e ANSIBLE_TRANSFORM_INVALID_GROUP_CHARS=ignore \
            "$ANSIBLE_IMAGE" sh -c \
            "apt-get update -q >/dev/null && apt-get install -y -q openssh-client >/dev/null && \
             pip install -q ansible-core && \
             { [ -z '$COLLECTIONS' ] || ansible-galaxy collection install $COLLECTIONS; } && \
             if ansible-playbook -i inventory/ '$PLAYBOOK' --list-hosts | grep -q 'hosts (0):'; then \
               echo 'ABORT: play matches zero hosts — inventory or group name is wrong'; exit 1; \
             fi && \
             ansible-playbook -i inventory/ '$PLAYBOOK' -e @/ci/evars.json"
