# petedio-iac's own nightly reconcile. The reusable job lives in plane-reconcile.yml
# beside this file; every OTHER repo carries a copy of THIS file named
# plane-reconcile.yml, with only the cron minute changed.
#
# ⚠ Each repo must have its own caller, and that is the point of PET-363. A reusable
# workflow reads `github.repository` and `github.token` from the CALLER, so a repo with
# no caller is never reconciled by anyone — which is how PET-331 sat stale for two days
# and PET-289 for nineteen, while this job reported green every night.
#
# It is inert until PLANE_BASE_URL / PLANE_WORKSPACE / PLANE_PROJECT_ID are set:
# scripts/plane-sync.sh warns and exits 0 when they are missing, so adding this to a
# repo can never break that repo's CI.
#
# ⚠ STAGGER THE CRON WHEN COPYING. Eleven repos firing at once queue up behind two
# self-hosted x64 runners, and a queued nightly that misses its window is a reconciler
# that did not run. Minutes are spaced five apart per repo.
name: plane-reconcile

on:
  schedule:
    - cron: "17 8 * * *" # 08:17 UTC ≈ 03:17 America/Chicago — after the nightly quiet period
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of merged PRs to re-check"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  reconcile:
    uses: PeteDio-Labs/petedio-iac/.github/workflows/plane-reconcile.yml@main
    permissions:
      contents: read
      id-token: write
      # ⚠ REQUIRED, AND THE REUSABLE JOB CANNOT ADD IT FOR US (PET-430). plane-reconcile
      # lists pull requests, which needs the Pull requests permission. A called workflow
      # can only NARROW what its caller grants, never widen it — so this line has to exist
      # here, in every one of the eleven repos that calls it.
      #
      # ⚠ AND IT MUST LAND BEFORE the reusable workflow starts asking for it. A job
      # requesting more than its caller granted does not fail — it never STARTS
      # (`startup_failure`), and a run that never starts writes no log at all. Measured,
      # not assumed. Until petedio-iac's side lands this line is a harmless no-op: the
      # called job still strips the scope.
      pull-requests: read
    with:
      lookback_days: ${{ github.event.inputs.lookback_days || '3' }}
